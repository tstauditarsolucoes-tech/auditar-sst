<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Área do Cliente • Auditar SST</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#20304e;background:#f2f5fa}
*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}
header{background:linear-gradient(110deg,#142d57,#235e79);color:#fff;padding:19px max(18px,calc((100vw - 1100px)/2));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header strong{font-size:20px}header small{opacity:.88}.wrap{max-width:1100px;padding:22px 16px 70px;margin:0 auto}
.panel{background:#fff;border:1px solid #e3e9f3;border-radius:17px;padding:22px;box-shadow:0 8px 25px #1b365e09;margin-bottom:16px}
.login{max-width:430px;margin:48px auto}h1{font-size:23px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
label{display:block;font-weight:650;font-size:13px;margin:15px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #bdc9da;border-radius:10px;background:#fff;font:inherit;color:#1c2c47}input:focus,textarea:focus,select:focus{outline:2px solid #7cb7c6}
button{border:0;border-radius:11px;padding:12px 16px;background:#176b68;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
button.secondary{color:#234365;background:#e8eff7}button.warn{background:#b25d21}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:#677991;font-size:13px}.error{color:#a32222}.ok{color:#167054}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.metric{padding:15px;background:#f6f9fc;border-radius:12px;border:1px solid #e6edf5}
.metric strong{display:block;font-size:25px;color:#1b5671}.metric span{font-size:12px;color:#5f7188}
.entry{border-top:1px solid #e6edf5;padding:14px 0}.entry:first-child{border-top:0}.entry p{margin:7px 0;white-space:pre-wrap}
.badge{display:inline-block;background:#e7f3f0;color:#136959;border-radius:999px;padding:4px 9px;font-weight:700;font-size:11px}
.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.tabbar button{background:#e8eff7;color:#244460}.tabbar button.active{background:#1b5e6e;color:#fff}
.notice{padding:11px 13px;border-radius:10px;background:#f6f5e9;font-size:13px;color:#514a26;margin:10px 0}
.photo-preview{max-width:240px;max-height:180px;border-radius:8px}.section-title{margin:18px 0 9px}
@media(max-width:500px){header{padding:16px}.wrap{padding:13px 10px}.panel{padding:17px}.login{margin:22px auto}}

/* executive-compact-v329137 */
.exec-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.exec-company{font-size:24px;margin:0;color:#17324e}.exec-kicker{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6b8295}
.update-chip{display:inline-flex;align-items:center;gap:7px;background:#edf7f4;color:#176d61;border:1px solid #d8ebe6;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:750}
.exec-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.exec-card{border:1px solid #e3eaf2;background:#f9fbfd;border-radius:14px;padding:14px;min-height:92px}
.exec-card strong{display:block;font-size:27px;line-height:1;color:#173f5b;margin:6px 0}.exec-card span{font-size:11px;color:#607487}
.exec-card.alert strong{color:#b34848}.exec-card.good strong{color:#19715e}.exec-card.warn strong{color:#9b6a18}
.section-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.75fr);gap:14px;margin-top:14px}
.compact-box{border:1px solid #e3eaf2;border-radius:14px;padding:15px;background:#fff}
.compact-box h3{font-size:14px;margin-bottom:10px}.compact-note{font-size:11px;color:#718397}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:9px;overflow:auto;padding-bottom:3px}
.kanban-col{background:#f6f8fb;border:1px solid #e5eaf1;border-radius:12px;padding:10px;min-height:120px}
.kanban-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#587087;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.k-card{background:#fff;border:1px solid #e2e8ef;border-radius:10px;padding:10px;margin-bottom:7px;box-shadow:0 2px 6px rgba(22,47,75,.04)}
.k-card:last-child{margin-bottom:0}.k-card b{font-size:12px;display:block;color:#223a55}.k-card small{display:block;margin-top:5px;color:#718397;line-height:1.35}
.pill-row{display:flex;gap:7px;flex-wrap:wrap}.mini-pill{background:#f3f7fb;border:1px solid #e1e8f0;border-radius:999px;padding:6px 9px;font-size:11px;color:#4e657b}
.training-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.training-stat{border:1px solid #e4eaf1;border-radius:11px;padding:11px;background:#fbfcfe}
.training-stat strong{display:block;font-size:20px;color:#1f566f}.training-stat span{font-size:10.5px;color:#687b8e}
.activity-toggle{margin-top:12px}.activity-toggle summary{cursor:pointer;font-size:12px;font-weight:750;color:#37526b}
.record-line{padding:10px 0;border-top:1px solid #edf1f5}.record-line:first-child{border-top:0}.record-line b{font-size:12px}.record-line small{display:block;color:#748598;margin-top:3px}
.auto-dot{width:7px;height:7px;border-radius:50%;background:#20a36e;display:inline-block}
@media(max-width:900px){.exec-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(4,220px)}}
@media(max-width:500px){.exec-company{font-size:21px}.exec-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.exec-card{min-height:82px;padding:12px}.exec-card strong{font-size:23px}}


/* executive-actionable-v329138 */
.attention-strip{border:1px solid #e6e8df;background:#fffdf6;border-radius:14px;padding:13px 15px;margin:10px 0 14px}
.attention-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.attention-head b{font-size:13px;color:#374454}.attention-list{display:flex;gap:8px;flex-wrap:wrap}
.attention-item{font-size:11px;border-radius:999px;padding:7px 10px;background:#fff;border:1px solid #e9e6d9;color:#5a5660}
.attention-item.urgent{border-color:#eed1d1;color:#9a3b3b;background:#fff7f7}
.attention-item.warn{border-color:#ebdfba;color:#8a6515;background:#fffaf0}
.drill{margin-top:12px;border-top:1px solid #edf1f5;padding-top:11px}
.drill summary{cursor:pointer;font-size:12px;font-weight:780;color:#31506b;list-style:none}
.drill summary::-webkit-details-marker{display:none}
.drill summary:after{content:"›";float:right;color:#7890a4;font-size:18px;line-height:14px}
.drill[open] summary:after{transform:rotate(90deg)}
.worker-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
.worker-table th,.worker-table td{text-align:left;padding:8px 6px;border-bottom:1px solid #edf1f5;vertical-align:top}
.worker-table th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#74889a}
.status-dot{display:inline-block;border-radius:999px;padding:4px 7px;background:#f6f7f9;color:#516373;font-size:10px;font-weight:750}
.status-dot.bad{background:#fff0f0;color:#a24040}.status-dot.warn{background:#fff7e8;color:#94670e}.status-dot.good{background:#edf8f4;color:#16705d}
.improvement-card{border:1px solid #e4eaf1;border-radius:12px;padding:13px;margin-top:9px;background:#fff}
.improvement-card h4{font-size:13px;margin:0 0 7px;color:#243d57}.improvement-card p{margin:6px 0;font-size:11.5px;line-height:1.5;color:#53677c}
.improvement-card .label{display:block;margin-top:8px;font-size:9.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:#7b8c9e}
.norma-box{background:#f4f8fb;border-left:3px solid #2b6880;padding:8px 10px;border-radius:0 8px 8px 0;margin-top:8px;font-size:11px;color:#314f66}
.report-ribbon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.report-mini{border:1px solid #e5eaf0;border-radius:11px;padding:11px;background:#fafcfd;min-height:74px}
.report-mini b{font-size:11.5px;color:#29445d;display:block}.report-mini small{font-size:10px;color:#788b9d;display:block;margin-top:5px}
@media(max-width:700px){.worker-table th:nth-child(2),.worker-table td:nth-child(2){display:none}.report-ribbon{grid-template-columns:1fr}}

</style>
</head>
<body>
<header><div><strong>Auditar SST</strong><br><small>Área do Cliente • Painel Gerencial</small></div>
<button id="logout" class="secondary hidden" type="button">Sair</button></header>
<main class="wrap">
<section class="panel login" id="login">
 <h1>Acesso individual</h1>
 <p class="muted">Utilize o e-mail e a senha fornecidos pela Auditar. Você verá somente as informações liberadas para sua empresa.</p>
 <form id="loginForm">
  <label for="email">E-mail</label><input id="email" type="email" required autocomplete="username">
  <label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password">
  <p id="loginError" class="error" role="alert"></p><button id="enter" type="submit">Entrar</button>
 </form>
</section>
<section id="dashboard" class="hidden">
 <div class="panel row"><div><h1>Painel Gerencial de SST</h1><span id="welcome" class="muted"></span></div><button id="refresh" class="secondary" type="button">Atualizar</button></div>
 <p id="status" role="status"></p>
 <div id="companies"></div>
</section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('auditar_client_portal_session')||'';
let current=null;
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=String(value==null?'':value);if(cls)e.className=cls;return e;};
function call(name,args,onSuccess,onFailure){
 const runner=google.script.run.withSuccessHandler(onSuccess).withFailureHandler(
  err=>onFailure&&onFailure(err&&err.message?err.message:'Falha na comunicação.'));
 runner[name].apply(runner,args);
}
function setMessage(value, bad){
 const el=$('status');el.textContent=value||'';el.className=bad?'error':'muted';
}
function showLogin(message){
 token='';current=null;sessionStorage.removeItem('auditar_client_portal_session');
 $('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');
 $('loginError').textContent=message||'';
}
function showDashboard(){
 $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');
}
function load(){
 if(!token)return showLogin('');
 setMessage('Carregando informações…');
 call('clientPortalData',[token],res=>{
  if(!res||!res.ok)return showLogin(res&&res.message||'Sessão expirada.');
  current=res;showDashboard();$('welcome').textContent=res.user.name+' • '+(res.user.role==='cliente'?'Empresa cliente':'Auditar');
  $('companies').replaceChildren();
  if(!res.companies.length){$('companies').append(text('p','Nenhuma empresa com painel publicado está disponível.','notice'));}
  res.companies.forEach(renderCompany);setMessage('Dados atualizados.');
 },err=>setMessage(err,true));
}
function safeNum(value,fallback){
 const n=Number(value);return Number.isFinite(n)?n:(fallback==null?null:fallback);
}
function formatPortalDate(value){
 const raw=String(value||'').trim();if(!raw)return 'não informada';
 const d=new Date(raw);if(Number.isNaN(d.getTime()))return raw;
 return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function statusBucket(row){
 const status=String(row.status||'').toLowerCase();
 const due=row.dueDate?new Date(row.dueDate):null;
 const overdue=due&&!Number.isNaN(due.getTime())&&due.getTime()<Date.now()&&!/concl|resol|feito|final/.test(status);
 if(/concl|resol|feito|final/.test(status))return 'done';
 if(/aguard|verifica|confer|evid[eê]ncia/.test(status))return 'verify';
 if(/andamento|execu|tratamento|iniciado/.test(status))return 'doing';
 return 'todo';
}
function renderKanban(actions){
 const wrap=text('div','','kanban');
 const defs=[['todo','A fazer'],['doing','Em andamento'],['verify','Aguardando Auditar'],['done','Concluídas']];
 defs.forEach(def=>{
  const rows=(actions||[]).filter(r=>statusBucket(r)===def[0]).slice(0,6);
  const col=text('div','','kanban-col');const title=text('div','','kanban-title');
  title.append(text('span',def[1]),text('span',rows.length));col.append(title);
  if(!rows.length)col.append(text('div','Sem registros','compact-note'));
  rows.forEach(row=>{
   const card=text('div','','k-card');card.append(text('b',row.title||row.description||'Ação'));
   const due=row.dueDate?new Date(row.dueDate):null;
   const overdue=due&&!Number.isNaN(due.getTime())&&due.getTime()<Date.now()&&statusBucket(row)!=='done';
   const meta=[row.sector,row.responsible,row.dueDate?'Prazo '+row.dueDate:''].filter(Boolean).join(' • ');
   if(meta)card.append(text('small',meta));if(overdue)card.append(text('span','Prazo vencido','status-dot bad'));col.append(card);
  });
  wrap.append(col);
 });
 return wrap;
}
function renderTrainingAndDds(company){
 const side=text('div','','compact-box');
 side.append(text('h3','Capacitação e DDS'));
 const ts=company.trainingSummary||{},dds=company.ddsSummary||{};
 const tg=text('div','','training-grid');
 [['Em dia',ts.current],['Vencidos',ts.expired],['Pendentes',ts.pending],['Sem registro',ts.missing]].forEach(pair=>{
  const box=text('div','','training-stat');box.append(text('strong',pair[1]==null?'—':pair[1]),text('span',pair[0]));tg.append(box);
 });
 side.append(tg);
 side.append(renderTrainingWorkers(company));
 const pills=text('div','','pill-row');pills.style.marginTop='10px';
 pills.append(text('span','DDS no mês: '+(dds.month==null?'—':dds.month),'mini-pill'),
              text('span','DDS no ano: '+(dds.year==null?'—':dds.year),'mini-pill'),
              text('span','Participações: '+(dds.participations==null?'—':dds.participations),'mini-pill'));
 side.append(pills);
 const recent=(dds.recent||[]).slice(0,5);
 if(recent.length){
  const details=document.createElement('details');details.className='activity-toggle';
  details.append(text('summary','Últimos DDS'));
  recent.forEach(item=>{
   const line=text('div','','record-line');line.append(text('b',item.title||'DDS'),
    text('small',[item.date,item.participants+' participante(s)',
      (item.photos||[]).length+' foto(s)',(item.paper||[]).length+' ficha(s)'].join(' • ')));
   details.append(line);
  });side.append(details);
 }
 return side;
}
function renderRecentRecords(shell,company){
 const details=document.createElement('details');details.className='activity-toggle';
 details.append(text('summary','Relatórios, vistorias e registros recentes'));
 const rows=[...(company.reports||[]).slice(0,4),...(company.inspections||[]).slice(0,4)];
 if(!rows.length)details.append(text('p','Nenhum registro recente publicado.','muted'));
 rows.forEach(row=>{
  const line=text('div','','record-line');line.append(text('b',row.title||'Registro'),
   text('small',[row.date,row.status,row.sector].filter(Boolean).join(' • ')));details.append(line);
 });
 shell.append(details);
}

function trainingStatusClass(value){
 const s=String(value||'').toLowerCase();
 if(/venc|sem registro|pend/.test(s))return 'bad';
 if(/vencer|aten/.test(s))return 'warn';
 return 'good';
}
function renderExecutiveAttention(company){
 const summary=company.summary||{},training=company.trainingSummary||{};
 const strip=text('div','','attention-strip');const head=text('div','','attention-head');
 head.append(text('b','Precisa da sua atenção'),text('span','Somente o essencial','compact-note'));strip.append(head);
 const list=text('div','','attention-list');let count=0;
 const add=(label,value,cls)=>{if(value==null||Number(value)<=0)return;list.append(text('span',label+': '+value,'attention-item '+(cls||'')));count++;};
 add('Ações vencidas',summary.overdueActions,'urgent');
 add('Treinamentos vencidos',training.expired,'urgent');
 add('Sem registro',training.missing,'warn');
 const high=(company.nonConformities||[]).filter(r=>/alta|cr[ií]tica|imediata/i.test(String(r.priority||''))).length;
 add('Problemas prioritários',high,'warn');
 if(!count)list.append(text('span','Nenhuma prioridade crítica publicada no momento.','attention-item'));
 strip.append(list);return strip;
}
function renderTrainingWorkers(company){
 const rows=company.trainingPendingWorkers||[];
 const details=document.createElement('details');details.className='drill';
 details.append(text('summary','Ver trabalhadores com pendências ('+rows.length+')'));
 if(!rows.length){details.append(text('p','Nenhum trabalhador com pendência nominal publicada.','compact-note'));return details;}
 const table=document.createElement('table');table.className='worker-table';
 const thead=document.createElement('thead'),tr=document.createElement('tr');
 ['Trabalhador','Setor','Treinamento','Situação'].forEach(v=>tr.append(text('th',v)));thead.append(tr);table.append(thead);
 const tbody=document.createElement('tbody');
 rows.slice(0,80).forEach(item=>{
  const row=document.createElement('tr');
  row.append(text('td',item.worker||'—'),text('td',item.sector||'—'),text('td',item.training||'—'));
  const status=text('span',item.status||'Sem registro','status-dot '+trainingStatusClass(item.status));
  const td=document.createElement('td');td.append(status);row.append(td);tbody.append(row);
 });
 table.append(tbody);details.append(table);
 if(rows.length>80)details.append(text('p','Mostrando os primeiros 80 registros. Use os filtros no módulo de treinamentos para aprofundar.','compact-note'));
 return details;
}
function renderImprovementPlan(company){
 const details=document.createElement('details');details.className='drill';
 details.append(text('summary','O que precisamos resolver?'));
 const source=(company.nonConformities||[]).filter(r=>statusBucket(r)!=='done').slice(0,12);
 if(!source.length){details.append(text('p','Nenhuma pendência publicada no momento.','compact-note'));return details;}
 source.forEach((row,index)=>{
  const card=text('div','','improvement-card');
  card.append(text('h4',(index+1)+'. '+(row.title||row.description||'Providência')));
  if(row.description){card.append(text('span','O que encontramos','label'),text('p',row.description));}
  const action=row.action||row.recommendation;
  if(action){card.append(text('span','O que precisa ser feito','label'),text('p',action));}
  if(row.normative){
   const base=row.normative+(row.normativeItem?' • Item '+row.normativeItem:'');
   card.append(text('div','Base normativa: '+base,'norma-box'));
  }
  const meta=[row.responsible?'Responsável: '+row.responsible:'',row.dueDate?'Prazo: '+row.dueDate:'',row.priority?'Prioridade: '+row.priority:''].filter(Boolean).join(' • ');
  if(meta)card.append(text('p',meta,'compact-note'));
  if(row.recurrence)card.append(text('span','Problema já registrado anteriormente','status-dot warn'));
  details.append(card);
 });
 return details;
}
function renderReportHighlights(company){
 const details=document.createElement('details');details.className='drill';
 const rows=(company.reports||[]).slice(0,3);
 details.append(text('summary','Relatórios e resultados'));
 if(!rows.length){details.append(text('p','Nenhum relatório publicado no momento.','compact-note'));return details;}
 const grid=text('div','','report-ribbon');
 rows.forEach(r=>{
  const c=text('div','','report-mini');c.append(text('b',r.title||'Relatório técnico'),text('small',[r.date,r.status].filter(Boolean).join(' • ')));grid.append(c);
 });
 details.append(grid);return details;
}
function renderCompany(company){
 const shell=text('section','','panel');
 const head=text('div','','exec-head');const left=text('div');
 left.append(text('div','Empresa acompanhada','exec-kicker'),text('h2',company.name,'exec-company'));
 const updated=text('span','','update-chip');updated.append(text('span','','auto-dot'),text('span','Atualização automática • '+formatPortalDate(company.updatedAt)));
 head.append(left,updated);shell.append(head);
 const summary=company.summary||{},training=company.trainingSummary||{};
 const metrics=text('div','','exec-metrics');
 const metricData=[
  ['Problemas em aberto',safeNum(summary.openNcs), ''],
  ['Ações vencidas',safeNum(summary.overdueActions), 'alert'],
  ['Treinamentos vencidos',safeNum(training.expired), 'warn'],
  ['Conformidade',safeNum(summary.conformity), 'good','%']
 ];
 metricData.forEach(m=>{const c=text('div','',('exec-card '+m[2]).trim());c.append(text('span',m[0]),text('strong',m[1]==null?'—':m[1]+(m[3]||'')));metrics.append(c);});
 shell.append(metrics);
 shell.append(renderExecutiveAttention(company));
 const grid=text('div','','section-grid');const main=text('div','','compact-box');
 main.append(text('h3','Acompanhamento das providências'));
 const actions=company.actions||[];main.append(renderKanban(actions));
 if(actions.length>24)main.append(text('div','Mostrando as ações mais recentes por etapa.','compact-note'));
 grid.append(main,renderTrainingAndDds(company));shell.append(grid);
 renderRecentRecords(shell,company);
 shell.append(renderImprovementPlan(company));
 shell.append(renderReportHighlights(company));
 if(company.permissions&&company.permissions.naoConformidades){
  const nc=document.createElement('details');nc.className='activity-toggle';
  const rows=(company.nonConformities||[]);
  nc.append(text('summary','Problemas encontrados ('+rows.length+')'));
  rows.slice(0,20).forEach(row=>{
   const line=text('div','','record-line');line.append(text('b',row.title||row.description||'Não conformidade'),
    text('small',[row.sector,row.status,row.priority].filter(Boolean).join(' • ')));nc.append(line);
  });shell.append(nc);
 }
 if(current.user.role!=='cliente')renderQueue(shell,company);
 $('companies').append(shell);
}
function renderList(shell,title,rows,company){
 const details=document.createElement('details');details.style.marginTop='18px';
 const summary=text('summary',title+' ('+rows.length+')');summary.style.fontWeight='750';summary.style.cursor='pointer';details.append(summary);
 if(!rows.length)details.append(text('p','Nenhum registro liberado no momento.','muted'));
 rows.forEach(row=>{
  const e=text('div','','entry');e.append(text('h3',row.title||row.description||'Registro'));
  const meta=[row.sector,row.date,row.status,row.priority].filter(Boolean).join(' • ');if(meta)e.append(text('div',meta,'muted'));
  if(row.description)e.append(text('p',row.description));if(row.recommendation)e.append(text('p','Recomendação: '+row.recommendation));
  if(row.dueDate)e.append(text('div','Prazo: '+row.dueDate,'muted'));
  if(row.responsible)e.append(text('div','Responsável: '+row.responsible,'muted'));
  if(row.action)e.append(text('p','Ação: '+row.action));
  if(title==='Não conformidades'&&company.permissions.enviarEvidencia&&row.id){
   const button=text('button','Enviar evidência','secondary');button.type='button';
   button.onclick=()=>showEvidenceForm(e,company.id,row.id,button);e.append(button);
  }
  details.append(e);
 });
 shell.append(details);
}
function showEvidenceForm(e,companyId,ncId,button){
 button.disabled=true;const form=text('form');form.append(text('label','Descrição da correção'));
 const note=document.createElement('textarea');note.rows=3;note.maxLength=1000;note.required=false;form.append(note);
 form.append(text('label','Fotografia (opcional, até 2 MB)'));
 const photo=document.createElement('input');photo.type='file';photo.accept='image/jpeg,image/png,image/webp';form.append(photo);
 const message=text('p','','muted');const submit=text('button','Enviar para validação');submit.type='submit';form.append(message,submit);
 form.onsubmit=evt=>{
  evt.preventDefault();submit.disabled=true;message.textContent='Enviando…';
  const file=photo.files&&photo.files[0];if(file&&file.size>2000000){
   message.textContent='Fotografia maior que 2 MB.';submit.disabled=false;return;
  }
  const send=image=>call('clientPortalSubmitEvidence',[token,companyId,ncId,note.value,image],res=>{
   message.textContent=res&&res.message||'Não foi possível enviar.';
   message.className=res&&res.ok?'ok':'error';submit.disabled=!!(res&&res.ok);
  },err=>{message.textContent=err;message.className='error';submit.disabled=false;});
  if(!file)return send(null);
  const reader=new FileReader();
  reader.onerror=()=>{message.textContent='Erro ao ler a fotografia.';submit.disabled=false;};
  reader.onload=()=>{
   const raw=String(reader.result||'');send({mimeType:file.type,base64:raw.split(',')[1]||''});
  };
  reader.readAsDataURL(file);
 };
 e.append(form);
}
function renderQueue(shell,company){
 const details=document.createElement('details');details.style.marginTop='18px';
 details.append(text('summary','Evidências aguardando validação'));
 const btn=text('button','Carregar evidências','secondary');btn.type='button';
 const area=text('div');details.append(btn,area);shell.append(details);
 btn.onclick=()=>{btn.disabled=true;area.replaceChildren(text('p','Carregando…','muted'));
  call('clientPortalEvidenceQueue',[token,company.id],res=>{
   btn.disabled=false;area.replaceChildren();
   if(!res||!res.ok){area.append(text('p',res&&res.message||'Erro.','error'));return;}
   if(!res.evidences.length)area.append(text('p','Nenhuma evidência enviada.','muted'));
   res.evidences.forEach(evidence=>{
    const box=text('div','','entry');box.append(text('h3','NC: '+evidence.ncId),
    text('p',evidence.note||'Fotografia enviada.'),text('div',evidence.date+' • '+evidence.status,'muted'));
    if(evidence.hasPhoto){
     const view=text('button','Ver fotografia','secondary');view.type='button';view.onclick=()=>call('clientPortalEvidencePhoto',[token,evidence.id],res=>{
      if(!res||!res.ok)return box.append(text('p',res&&res.message||'Foto indisponível.','error'));
      const img=document.createElement('img');img.className='photo-preview';img.alt='Evidência de correção';
      img.src='data:'+res.mimeType+';base64,'+res.base64;box.append(img);
     },err=>box.append(text('p',err,'error')));box.append(view);
    }
    if(evidence.status==='PENDENTE_VALIDACAO'){
     const buttons=text('div','','row');
     ['VALIDADA','REJEITADA'].forEach(choice=>{
      const b=text('button',choice==='VALIDADA'?'Validar evidência':'Rejeitar evidência',choice==='VALIDADA'?'':'warn');b.type='button';
      b.onclick=()=>{b.disabled=true;call('clientPortalReviewEvidence',[token,evidence.id,choice],res=>{
       if(res&&res.ok)btn.click();else{b.disabled=false;box.append(text('p',res&&res.message||'Erro.','error'));}
      },err=>{b.disabled=false;box.append(text('p',err,'error'));});};buttons.append(b);
     });box.append(buttons);
    }area.append(box);
   });
  },err=>{btn.disabled=false;area.replaceChildren(text('p',err,'error'));});
 };
}
$('loginForm').onsubmit=event=>{
 event.preventDefault();$('enter').disabled=true;$('loginError').textContent='';
 call('clientPortalLogin',[$('email').value,$('password').value],res=>{
  $('enter').disabled=false;$('password').value='';
  if(!res||!res.ok){$('loginError').textContent=res&&res.message||'Não foi possível entrar.';return;}
  token=res.token;sessionStorage.setItem('auditar_client_portal_session',token);load();
 },err=>{$('enter').disabled=false;$('loginError').textContent=err;});
};
$('refresh').onclick=load;
$('logout').onclick=()=>{const old=token;showLogin('');call('clientPortalLogout',[old],()=>{},()=>{});};
let autoRefreshTimer=null;
function armAutoRefresh(){
 if(autoRefreshTimer)clearInterval(autoRefreshTimer);
 autoRefreshTimer=setInterval(()=>{
  if(token&&current&&current.user&&current.user.role==='cliente'&&!document.hidden)load();
 },60000);
}
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&token&&current&&current.user&&current.user.role==='cliente')load();
});
window.addEventListener('focus',()=>{
 if(token&&current&&current.user&&current.user.role==='cliente')load();
});
armAutoRefresh();
if(token)load();
})();
</script>
