<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Área do Cliente • Auditar SST</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#20304e;background:#f2f5fa}
*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}
header{background:linear-gradient(110deg,#142d57,#235e79);color:#fff;padding:19px max(18px,calc((100vw - 1100px)/2));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header strong{font-size:20px}header small{opacity:.88}.wrap{max-width:1100px;padding:22px 16px 70px;margin:0 auto}
.panel{background:#fff;border:1px solid #e3e9f3;border-radius:17px;padding:22px;box-shadow:0 8px 25px #1b365e09;margin-bottom:16px}
.login{max-width:430px;margin:48px auto}h1{font-size:23px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
label{display:block;font-weight:650;font-size:13px;margin:15px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #bdc9da;border-radius:10px;background:#fff;font:inherit;color:#1c2c47}input:focus,textarea:focus,select:focus{outline:2px solid #7cb7c6}
button{border:0;border-radius:11px;padding:12px 16px;background:#176b68;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
button.secondary{color:#234365;background:#e8eff7}button.warn{background:#b25d21}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:#677991;font-size:13px}.error{color:#a32222}.ok{color:#167054}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.metric{padding:15px;background:#f6f9fc;border-radius:12px;border:1px solid #e6edf5}
.metric strong{display:block;font-size:25px;color:#1b5671}.metric span{font-size:12px;color:#5f7188}
.entry{border-top:1px solid #e6edf5;padding:14px 0}.entry:first-child{border-top:0}.entry p{margin:7px 0;white-space:pre-wrap}
.badge{display:inline-block;background:#e7f3f0;color:#136959;border-radius:999px;padding:4px 9px;font-weight:700;font-size:11px}
.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.tabbar button{background:#e8eff7;color:#244460}.tabbar button.active{background:#1b5e6e;color:#fff}
.notice{padding:11px 13px;border-radius:10px;background:#f6f5e9;font-size:13px;color:#514a26;margin:10px 0}
.photo-preview{max-width:240px;max-height:180px;border-radius:8px}.section-title{margin:18px 0 9px}
@media(max-width:500px){header{padding:16px}.wrap{padding:13px 10px}.panel{padding:17px}.login{margin:22px auto}}
</style>
</head>
<body>
<header><div><strong>Auditar SST</strong><br><small>Área do Cliente • Painel Gerencial</small></div>
<button id="logout" class="secondary hidden" type="button">Sair</button></header>
<main class="wrap">
<section class="panel login" id="login">
 <h1>Acesso individual</h1>
 <p class="muted">Utilize o e-mail e a senha fornecidos pela Auditar. Você verá somente as informações liberadas para sua empresa.</p>
 <form id="loginForm">
  <label for="email">E-mail</label><input id="email" type="email" required autocomplete="username">
  <label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password">
  <p id="loginError" class="error" role="alert"></p><button id="enter" type="submit">Entrar</button>
 </form>
</section>
<section id="dashboard" class="hidden">
 <div class="panel row"><div><h1>Meu Painel Gerencial</h1><span id="welcome" class="muted"></span></div><button id="refresh" class="secondary" type="button">Atualizar</button></div>
 <p id="status" role="status"></p>
 <div id="companies"></div>
</section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('auditar_client_portal_session')||'';
let current=null;
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=String(value==null?'':value);if(cls)e.className=cls;return e;};
function call(name,args,onSuccess,onFailure){
 const runner=google.script.run.withSuccessHandler(onSuccess).withFailureHandler(
  err=>onFailure&&onFailure(err&&err.message?err.message:'Falha na comunicação.'));
 runner[name].apply(runner,args);
}
function setMessage(value, bad){
 const el=$('status');el.textContent=value||'';el.className=bad?'error':'muted';
}
function showLogin(message){
 token='';current=null;sessionStorage.removeItem('auditar_client_portal_session');
 $('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');
 $('loginError').textContent=message||'';
}
function showDashboard(){
 $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');
}
function load(){
 if(!token)return showLogin('');
 setMessage('Carregando informações…');
 call('clientPortalData',[token],res=>{
  if(!res||!res.ok)return showLogin(res&&res.message||'Sessão expirada.');
  current=res;showDashboard();$('welcome').textContent=res.user.name+' • '+(res.user.role==='cliente'?'Empresa cliente':'Auditar');
  $('companies').replaceChildren();
  if(!res.companies.length){$('companies').append(text('p','Nenhuma empresa com painel publicado está disponível.','notice'));}
  res.companies.forEach(renderCompany);setMessage('Dados atualizados.');
 },err=>setMessage(err,true));
}
function renderCompany(company){
 const shell=text('section','','panel');const top=text('div','','row');
 const head=text('div');head.append(text('h2',company.name),text('div','Última atualização: '+(company.updatedAt||'não informada'),'muted'));
 top.append(head);shell.append(top);
 const permissions=company.permissions||{};
 if(permissions.indicadores){
  const metrics=text('div','','metrics');
  const dict=[['conformity','Conformidade','%'],['inspections','Vistorias',''],['openNcs','NC abertas',''],['overdueNcs','NC vencidas',''],
  ['resolvedNcs','NC resolvidas',''],['pendingActions','Ações pendentes',''],['overdueActions','Ações vencidas','']];
  let found=0;
  dict.forEach(pair=>{const value=company.summary&&company.summary[pair[0]];if(value==null)return;
   const card=text('div','','metric');card.append(text('strong',value+pair[2]),text('span',pair[1]));metrics.append(card);found++;});
  if(found){shell.append(text('h3','Indicadores','section-title'),metrics);}
 }
 if(permissions.naoConformidades)renderList(shell,'Não conformidades',company.nonConformities||[],company);
 if(permissions.acoesCorretivas)renderList(shell,'Ações corretivas',company.actions||[],company);
 if(permissions.relatorios){renderList(shell,'Relatórios publicados',company.reports||[],company);
  renderList(shell,'Vistorias recentes',company.inspections||[],company);}
 if(current.user.role!=='cliente')renderQueue(shell,company);
 $('companies').append(shell);
}
function renderList(shell,title,rows,company){
 const details=document.createElement('details');details.style.marginTop='18px';
 const summary=text('summary',title+' ('+rows.length+')');summary.style.fontWeight='750';summary.style.cursor='pointer';details.append(summary);
 if(!rows.length)details.append(text('p','Nenhum registro liberado no momento.','muted'));
 rows.forEach(row=>{
  const e=text('div','','entry');e.append(text('h3',row.title||row.description||'Registro'));
  const meta=[row.sector,row.date,row.status,row.priority].filter(Boolean).join(' • ');if(meta)e.append(text('div',meta,'muted'));
  if(row.description)e.append(text('p',row.description));if(row.recommendation)e.append(text('p','Recomendação: '+row.recommendation));
  if(row.dueDate)e.append(text('div','Prazo: '+row.dueDate,'muted'));
  if(row.responsible)e.append(text('div','Responsável: '+row.responsible,'muted'));
  if(row.action)e.append(text('p','Ação: '+row.action));
  if(title==='Não conformidades'&&company.permissions.enviarEvidencia&&row.id){
   const button=text('button','Enviar evidência','secondary');button.type='button';
   button.onclick=()=>showEvidenceForm(e,company.id,row.id,button);e.append(button);
  }
  details.append(e);
 });
 shell.append(details);
}
function showEvidenceForm(e,companyId,ncId,button){
 button.disabled=true;const form=text('form');form.append(text('label','Descrição da correção'));
 const note=document.createElement('textarea');note.rows=3;note.maxLength=1000;note.required=false;form.append(note);
 form.append(text('label','Fotografia (opcional, até 2 MB)'));
 const photo=document.createElement('input');photo.type='file';photo.accept='image/jpeg,image/png,image/webp';form.append(photo);
 const message=text('p','','muted');const submit=text('button','Enviar para validação');submit.type='submit';form.append(message,submit);
 form.onsubmit=evt=>{
  evt.preventDefault();submit.disabled=true;message.textContent='Enviando…';
  const file=photo.files&&photo.files[0];if(file&&file.size>2000000){
   message.textContent='Fotografia maior que 2 MB.';submit.disabled=false;return;
  }
  const send=image=>call('clientPortalSubmitEvidence',[token,companyId,ncId,note.value,image],res=>{
   message.textContent=res&&res.message||'Não foi possível enviar.';
   message.className=res&&res.ok?'ok':'error';submit.disabled=!!(res&&res.ok);
  },err=>{message.textContent=err;message.className='error';submit.disabled=false;});
  if(!file)return send(null);
  const reader=new FileReader();
  reader.onerror=()=>{message.textContent='Erro ao ler a fotografia.';submit.disabled=false;};
  reader.onload=()=>{
   const raw=String(reader.result||'');send({mimeType:file.type,base64:raw.split(',')[1]||''});
  };
  reader.readAsDataURL(file);
 };
 e.append(form);
}
function renderQueue(shell,company){
 const details=document.createElement('details');details.style.marginTop='18px';
 details.append(text('summary','Evidências aguardando validação'));
 const btn=text('button','Carregar evidências','secondary');btn.type='button';
 const area=text('div');details.append(btn,area);shell.append(details);
 btn.onclick=()=>{btn.disabled=true;area.replaceChildren(text('p','Carregando…','muted'));
  call('clientPortalEvidenceQueue',[token,company.id],res=>{
   btn.disabled=false;area.replaceChildren();
   if(!res||!res.ok){area.append(text('p',res&&res.message||'Erro.','error'));return;}
   if(!res.evidences.length)area.append(text('p','Nenhuma evidência enviada.','muted'));
   res.evidences.forEach(evidence=>{
    const box=text('div','','entry');box.append(text('h3','NC: '+evidence.ncId),
    text('p',evidence.note||'Fotografia enviada.'),text('div',evidence.date+' • '+evidence.status,'muted'));
    if(evidence.hasPhoto){
     const view=text('button','Ver fotografia','secondary');view.type='button';view.onclick=()=>call('clientPortalEvidencePhoto',[token,evidence.id],res=>{
      if(!res||!res.ok)return box.append(text('p',res&&res.message||'Foto indisponível.','error'));
      const img=document.createElement('img');img.className='photo-preview';img.alt='Evidência de correção';
      img.src='data:'+res.mimeType+';base64,'+res.base64;box.append(img);
     },err=>box.append(text('p',err,'error')));box.append(view);
    }
    if(evidence.status==='PENDENTE_VALIDACAO'){
     const buttons=text('div','','row');
     ['VALIDADA','REJEITADA'].forEach(choice=>{
      const b=text('button',choice==='VALIDADA'?'Validar evidência':'Rejeitar evidência',choice==='VALIDADA'?'':'warn');b.type='button';
      b.onclick=()=>{b.disabled=true;call('clientPortalReviewEvidence',[token,evidence.id,choice],res=>{
       if(res&&res.ok)btn.click();else{b.disabled=false;box.append(text('p',res&&res.message||'Erro.','error'));}
      },err=>{b.disabled=false;box.append(text('p',err,'error'));});};buttons.append(b);
     });box.append(buttons);
    }area.append(box);
   });
  },err=>{btn.disabled=false;area.replaceChildren(text('p',err,'error'));});
 };
}
$('loginForm').onsubmit=event=>{
 event.preventDefault();$('enter').disabled=true;$('loginError').textContent='';
 call('clientPortalLogin',[$('email').value,$('password').value],res=>{
  $('enter').disabled=false;$('password').value='';
  if(!res||!res.ok){$('loginError').textContent=res&&res.message||'Não foi possível entrar.';return;}
  token=res.token;sessionStorage.setItem('auditar_client_portal_session',token);load();
 },err=>{$('enter').disabled=false;$('loginError').textContent=err;});
};
$('refresh').onclick=load;
$('logout').onclick=()=>{const old=token;showLogin('');call('clientPortalLogout',[old],()=>{},()=>{});};
if(token)load();
})();
</script>
</body>
</html>
