name: Auditar SST v3.29.37 Windows

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.37-data-safety-fix]
    paths:
      - ".github/workflows/build-v32937-windows.yml"
      - "build_sources/v3.29.37-data-safety/**"

permissions:
  contents: read

jobs:
  windows:
    name: Windows v3.29.37
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Montar base funcional v3.29.20
        shell: pwsh
        run: |
          python tools/assemble_v32920.py
          $pub = Get-Content app/Auditar_SST_v1_5_dashboard/pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.20+163')) { throw 'base v3.29.20 incorreta' }

      - name: Reconstruir patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64, hashlib, lzma, re
          root=Path('.')
          parts=['part00.b64','part01.b64','part02.b64','part03.b64','part04.b64','part05.b64','part06.b64','part07a.b64','part07b.b64','part08.b64']
          packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','', ''.join((root/'build_sources/v3.29.27-patch'/p).read_text() for p in parts)))
          assert hashlib.sha256(packed).hexdigest()=='0b238c75455f7cb942acaa5a28e6f8c3eeb18be0fb52cdaac06b2f5ba8dc2c7c'
          patch=lzma.decompress(packed); assert hashlib.sha256(patch).hexdigest()=='860792297ff41e2267971e7bbe9551f24e371e2d3c766816c2c4fa805f08edc3'; Path('v32927.patch').write_bytes(patch)
          specs=[
            ('build_sources/v3.29.28-panel/v32927_to_v32928.patch.xz.b64','v32928.patch','9779b432169de1e7fa1df4501651e6449d0aab467b1a027d25373023d3eb9ef6','f47da23a6a6dd399b58c1f7e13e43f0fe07c038e430024d400531daa65e27e6e'),
            ('build_sources/v3.29.31-pc-layout/v32930_to_v32931.patch.xz.b64','v32931.patch','2aeaf0d617547c609a51589502a654244581b73011b13269884e56fd0dedf3a5','15f360f51a032d7ca114919943e19b210b7609a7b5c818182f273b9ae60f5264'),
            ('build_sources/v3.29.32-pc-premium/v32931_to_v32932.patch.xz.b64','v32932.patch','3a6b3ce5ded2017d1c4a38df41134ffda2c4fffb0bd436f3bf47849155ece2c8','04303227ec9eb1cceaca66390e6b300bab979f0579cbb312c99036531554aab6'),
            ('build_sources/v3.29.34-drive-evidence/v32933_to_v32934.patch.xz.b64','v32934.patch','8734b362e83d69aac49bdb3178d7634e058462f3160edc5977869ac50e615de2','f77d0c42d4a1457bc99b3ff23ff5cccdb06312b69485e7c1601c1b009fcc8297'),
            ('build_sources/v3.29.35-pc-deep/v32934_to_v32935.patch.xz.b64','v32935.patch','c1fe1ba1f1f3d98a1b5081ad06d570ff73c1db6417b746b8db9b90ff0e41d65e','a6eabb51c3a363ed5e63e23cb413d25a78e01e9752a206b2711abfae07631f1d'),
            ('build_sources/v3.29.36-pc-syncfix/v32935_to_v32936_v2.patch.xz.b64','v32936.patch','ebbc15b7e51233f2aec9620a9209d55d902629e3770668764953f36a313de6ee','cbdf2056e4e9e81d71d3c594bf8d3faf357899c8277cdfc04b0cffbe30b8bc50'),
            ('build_sources/v3.29.37-data-safety/v32936_to_v32937.patch.xz.b64','v32937.patch','4c407c05789d314b31aa738a303da260b5e59326c135c128ad4abfed76e813f0','48ba67262889ee1fb034eb0a034f724a13e79c68c8359a83326c5b8e61358669')]
          for src,out,packed_sha,patch_sha in specs:
              packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',Path(src).read_text())); assert hashlib.sha256(packed).hexdigest()==packed_sha
              patch=lzma.decompress(packed); assert hashlib.sha256(patch).hexdigest()==patch_sha; Path(out).write_bytes(patch)
          '@ | Set-Content "$env:RUNNER_TEMP\rebuild.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\rebuild.py"

      - name: Aplicar v3.29.27 a v3.29.37
        shell: pwsh
        run: |
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32927.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard build_sources/v3.29.27-patch/hotfix-sync-biblioteca.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32928.patch
          python tools/patch_tutorial_v32930.py app/Auditar_SST_v1_5_dashboard "$PWD"
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32931.patch
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32932.patch
          python tools/patch_photo_recovery_v32933.py app/Auditar_SST_v1_5_dashboard
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32934.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32935.patch
          git apply -p1 --directory=app/Auditar_SST_v1_5_dashboard v32936.patch
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32937.patch
          $pub=Get-Content app/Auditar_SST_v1_5_dashboard/pubspec.yaml -Raw
          $safety=Get-Content app/Auditar_SST_v1_5_dashboard/lib/screens/data_safety_screen.dart -Raw
          if (-not $pub.Contains('version: 3.29.37+179')) { throw 'versão v3.29.37 ausente' }
          if (-not $safety.Contains('libraryStatusQuick')) { throw 'status rápido da biblioteca ausente' }
          if (-not $safety.Contains('LinearProgressIndicator')) { throw 'abertura progressiva da tela ausente' }
          if (-not $safety.Contains('Duration(seconds: 4)')) { throw 'timeout individual ausente' }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar, analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          if (Test-Path 'test') { dart format test }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'flutter analyze falhou' }
          if (Test-Path 'test') { flutter test; if ($LASTEXITCODE -ne 0) { throw 'flutter test falhou' } }

      - name: Compilar Windows release
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"

      - name: Gerar portátil e instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          Compress-Archive "$release/*" 'dist/windows/Auditar-SST-Windows-v3.29.37-PORTATIL.zip' -Force
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup não disponível' }
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppId={{E659A16C-8CF2-4B57-B357-5B4DB8F32200}
          AppName=Auditar SST
          AppVersion=3.29.37
          AppPublisher=Auditar Soluções
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.37
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & $iscc "$env:RUNNER_TEMP\auditar.iss"
          if (-not (Test-Path 'dist/windows/Auditar-SST-Setup-v3.29.37.exe')) { throw 'instalador não foi gerado' }
          Get-FileHash 'dist/windows/Auditar-SST-Setup-v3.29.37.exe' -Algorithm SHA256 | Format-List | Out-File 'dist/windows/Auditar-SST-Setup-v3.29.37.sha256.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.37-Windows
          path: dist/windows/*
          retention-days: 30
