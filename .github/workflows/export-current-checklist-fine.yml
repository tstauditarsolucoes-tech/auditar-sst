name: Export current checklist and report

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/export-current-checklist-fine.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Assemble current source
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          src=Path('build_sources/v3.29.71-nc-quick-resolve/patch_nc_quick_resolve_v32971.py.xz.b64')
          Path('/tmp/patch_nc.py').write_bytes(lzma.decompress(base64.b64decode(src.read_text().strip())))
          PY
          python /tmp/patch_nc.py "$APP_DIR"
          python tools/patch_login_resilience_v32972.py "$APP_DIR"
          python tools/patch_training_bulk_import_v32973.py "$APP_DIR"
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          src=Path('build_sources/v3.29.74-training-photo/patch_training_import_photo_v32974.py.xz.b64')
          Path('/tmp/patch_training_photo.py').write_bytes(lzma.decompress(base64.b64decode(src.read_text().strip())))
          PY
          python /tmp/patch_training_photo.py "$APP_DIR"
          python tools/patch_training_import_robust_v32975.py "$APP_DIR"
          python tools/patch_cipa_management_v32976.py "$APP_DIR"

          mkdir -p export
          cp "$APP_DIR/lib/models.dart" export/
          cp "$APP_DIR/lib/database.dart" export/
          grep -RIlE "ChecklistQuestion|InspectionAnswer|checklist|Relatório|report" "$APP_DIR/lib" | sort > export/matched_files.txt
          while IFS= read -r f; do
            rel="${f#$APP_DIR/}"
            mkdir -p "export/$(dirname "$rel")"
            cp "$f" "export/$rel"
          done < export/matched_files.txt
          grep -RniE "class Checklist|class InspectionAnswer|questionReference|recommendation|reportNumber|includeActionPlan|ChecklistQuestion" "$APP_DIR/lib" > export/key_refs.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: current-checklist-report-source
          path: export
          retention-days: 3
