name: Diagnose Nine Pending Records
on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/diag-nine-pending.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble current Windows source
        run: |
          python tools/assemble_sync_response_fix.py windows
          python tools/patch_sync_progress_v32939_32942.py app/Auditar_SST_v1_5_dashboard windows
          python tools/patch_sync_progress_compile_safety.py app/Auditar_SST_v1_5_dashboard
          python tools/patch_windows_sync_logo_stability_v32943.py app/Auditar_SST_v1_5_dashboard
      - name: Inspect sync queue and automatic loop
        run: |
          APP=app/Auditar_SST_v1_5_dashboard
          echo '=== SYNC COORDINATOR FULL ==='
          sed -n '1,320p' "$APP/lib/services/sync_coordinator.dart" || true
          echo '=== ALL AUTOMATIC SYNC CALLS ==='
          grep -RIn -A8 -B8 "Timer.periodic\|DeviceSyncService.synchronize\|SyncCoordinator\|syncBackgroundBatch\|startAuto\|autoSync\|Duration(seconds: 15)\|Duration(seconds: 30)\|Duration(minutes:" "$APP/lib" || true
          echo '=== DEVICE SYNC CORE ==='
          sed -n '130,410p' "$APP/lib/services/device_sync_service.dart" || true
          echo '=== MEDIA WRITES THAT CAN RE-DIRTY ==='
          grep -n -A20 -B8 "db.update(\|db.insert(\|media_assets\|_downloadAsset\|uploadPending\|_localOnlyPathUpdate" "$APP/lib/services/media_sync_service.dart" || true
