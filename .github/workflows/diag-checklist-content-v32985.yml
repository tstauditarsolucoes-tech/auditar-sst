name: Diagnostico Conteudo Checklists v3.29.85

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/diag-checklist-content-v32985.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Montar fonte atual v3.29.84
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          python tools/patch_management_panel_logo_theme_v32970_v3308.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          for src,out in [
            ('build_sources/v3.29.71-nc-quick-resolve/patch_nc_quick_resolve_v32971.py.xz.b64','/tmp/p71.py'),
            ('build_sources/v3.29.74-training-photo/patch_training_import_photo_v32974.py.xz.b64','/tmp/p74.py'),
            ('build_sources/v3.29.77-checklist-fine-face/patch_checklist_fine_face_v32977.py.xz.b64','/tmp/p77.py'),
          ]:
            Path(out).write_bytes(lzma.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY
          python /tmp/p71.py "$APP_DIR"
          python tools/patch_login_resilience_v32972.py "$APP_DIR"
          python tools/patch_training_bulk_import_v32973.py "$APP_DIR"
          python /tmp/p74.py "$APP_DIR"
          python tools/patch_training_import_robust_v32975.py "$APP_DIR"
          python tools/patch_cipa_management_v32976.py "$APP_DIR"
          python /tmp/p77.py "$APP_DIR"
          python tools/patch_refine_new_features_v32978.py "$APP_DIR"
          python tools/patch_refine_new_features_v32979.py "$APP_DIR"
          python tools/patch_performance_report_v32980.py "$APP_DIR"
          python tools/patch_cross_platform_refinement_v32981.py "$APP_DIR" android
          python tools/patch_signature_handoff_v32982.py "$APP_DIR" android
          python tools/patch_pre_admission_search_v32983.py "$APP_DIR" android
          python tools/patch_deferred_inspection_ai_v32984.py "$APP_DIR" android

      - name: Estruturar biblioteca e localizar duplicidades reais
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import re, sys, unicodedata, collections
          p=Path(sys.argv[1])/'lib/ready_checklists.dart'
          s=p.read_text(encoding='utf-8')

          starts=[m.start() for m in re.finditer(r'\bReadyChecklistDefinition\s*\(',s)]
          blocks=[]
          for st in starts:
            depth=0; quote=None; esc=False; end=None
            for i in range(s.find('(',st),len(s)):
              ch=s[i]
              if quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==quote: quote=None
                continue
              if ch in "'\"": quote=ch; continue
              if ch=='(': depth+=1
              elif ch==')':
                depth-=1
                if depth==0:
                  end=i+1; break
            if end: blocks.append(s[st:end])

          def field(block,key):
            m=re.search(r"\b"+re.escape(key)+r"\s*:\s*(['\"])(.*?)\1",block,re.S)
            return m.group(2).strip() if m else ''
          def norm(x):
            x=unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower()
            x=re.sub(r'[^a-z0-9 ]+',' ',x)
            return re.sub(r'\s+',' ',x).strip()
          itemrx=re.compile(r"ReadyChecklistItem\s*\((.*?)\)(?=\s*,|\s*\])",re.S)
          rows=[]
          for b in blocks:
            ident,name,cat=field(b,'id'),field(b,'name'),field(b,'category')
            items=[]
            for im in itemrx.finditer(b):
              ib=im.group(1)
              text=field(ib,'text'); ref=field(ib,'reference'); pri=field(ib,'priority'); icat=field(ib,'category')
              if text: items.append((text,ref,pri,icat))
            rows.append((ident,name,cat,items))

          print('=== TEMPLATE_SUMMARY ===')
          print('TEMPLATE_COUNT',len(rows),'ITEM_COUNT',sum(len(x[3]) for x in rows))
          for ident,name,cat,items in rows:
            print(f'TEMPLATE|{ident}|{name}|{cat}|{len(items)}')

          print('=== DUPLICATES_WITHIN_SAME_CHECKLIST ===')
          found=0
          for ident,name,cat,items in rows:
            g=collections.defaultdict(list)
            for idx,(text,ref,pri,icat) in enumerate(items,1): g[norm(text)].append((idx,text))
            for n,v in g.items():
              if len(v)>1:
                found+=1
                print(f'INDUP|{ident}|{name}|{len(v)}|{n}')
                for idx,text in v: print(f'  {idx}|{text}')
          print('INDUP_GROUPS',found)

          print('=== PANIFICACAO_FULL ===')
          for ident,name,cat,items in rows:
            key=norm(' '.join([ident,name,cat]))
            if 'panificacao' in key or 'padaria' in key:
              print(f'PAN_TEMPLATE|{ident}|{name}|{cat}|{len(items)}')
              for idx,(text,ref,pri,icat) in enumerate(items,1):
                print(f'PAN_ITEM|{ident}|{idx}|{icat}|{text}|{ref}|{pri}')

          print('=== RESPONSE_OPTIONS ===')
          cs=(Path(sys.argv[1])/'lib/screens/checklist_screen.dart').read_text(encoding='utf-8',errors='ignore')
          for i,line in enumerate(cs.splitlines(),1):
            if re.search(r'n[aã]o se aplica|n/?a|conforme|n[aã]o conforme',line,re.I):
              print(f'OPT|{i}|{line.strip()}')
          PY
