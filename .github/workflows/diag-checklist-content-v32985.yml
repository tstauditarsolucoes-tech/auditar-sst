name: Diagnostico Conteudo Checklists v3.29.85

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/diag-checklist-content-v32985.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Montar fonte atual v3.29.84
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          python tools/patch_management_panel_logo_theme_v32970_v3308.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          for src,out in [
            ('build_sources/v3.29.71-nc-quick-resolve/patch_nc_quick_resolve_v32971.py.xz.b64','/tmp/p71.py'),
            ('build_sources/v3.29.74-training-photo/patch_training_import_photo_v32974.py.xz.b64','/tmp/p74.py'),
            ('build_sources/v3.29.77-checklist-fine-face/patch_checklist_fine_face_v32977.py.xz.b64','/tmp/p77.py'),
          ]:
            Path(out).write_bytes(lzma.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY
          python /tmp/p71.py "$APP_DIR"
          python tools/patch_login_resilience_v32972.py "$APP_DIR"
          python tools/patch_training_bulk_import_v32973.py "$APP_DIR"
          python /tmp/p74.py "$APP_DIR"
          python tools/patch_training_import_robust_v32975.py "$APP_DIR"
          python tools/patch_cipa_management_v32976.py "$APP_DIR"
          python /tmp/p77.py "$APP_DIR"
          python tools/patch_refine_new_features_v32978.py "$APP_DIR"
          python tools/patch_refine_new_features_v32979.py "$APP_DIR"
          python tools/patch_performance_report_v32980.py "$APP_DIR"
          python tools/patch_cross_platform_refinement_v32981.py "$APP_DIR" android
          python tools/patch_signature_handoff_v32982.py "$APP_DIR" android
          python tools/patch_pre_admission_search_v32983.py "$APP_DIR" android
          python tools/patch_deferred_inspection_ai_v32984.py "$APP_DIR" android

      - name: Diagnosticar combinacao, sobreposicao e origem
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import re,sys,unicodedata,itertools
          root=Path(sys.argv[1])/'lib'
          s=(root/'ready_checklists.dart').read_text(encoding='utf-8')

          def norm(x):
            x=unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower()
            x=re.sub(r'[^a-z0-9 ]+',' ',x)
            return re.sub(r'\s+',' ',x).strip()
          stop=set('a as o os e de da do das dos em para por com sem ou se ao aos um uma quando esta estao e sao ser sendo durante forma'.split())

          # Parser simples por blocos balanceados
          starts=[m.start() for m in re.finditer(r'\bReadyChecklistDefinition\s*\(',s)]
          defs=[]
          for st in starts:
            op=s.find('(',st); depth=0; q=None; esc=False; end=None
            for i in range(op,len(s)):
              ch=s[i]
              if q:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==q: q=None
                continue
              if ch in "'\"": q=ch
              elif ch=='(': depth+=1
              elif ch==')':
                depth-=1
                if depth==0: end=i+1; break
            if not end: continue
            b=s[st:end]
            def fld(txt,key):
              m=re.search(r"\b"+re.escape(key)+r"\s*:\s*(['\"])(.*?)\1",txt,re.S)
              return m.group(2).strip() if m else ''
            ident,name,cat=fld(b,'id'),fld(b,'name'),fld(b,'category')
            items=[]
            for im in re.finditer(r"ReadyChecklistItem\s*\((.*?)\)(?=\s*,|\s*\])",b,re.S):
              ib=im.group(1); txt=fld(ib,'text')
              if txt: items.append(txt)
            defs.append((ident,name,cat,items))

          def toks(x): return {w for w in norm(x).split() if len(w)>2 and w not in stop}
          print('=== NEAR_DUP_WITHIN ===')
          n=0
          for ident,name,cat,items in defs:
            for (i,a),(j,b) in itertools.combinations(enumerate(items,1),2):
              A,B=toks(a),toks(b)
              sim=len(A&B)/max(1,len(A|B))
              containment=max(len(A&B)/max(1,len(A)),len(A&B)/max(1,len(B)))
              if sim>=0.58 or containment>=0.78:
                n+=1; print(f'NEARIN|{ident}|{name}|{i}|{j}|{sim:.2f}|{containment:.2f}|{a}|{b}')
          print('NEARIN_COUNT',n)

          print('=== PANIFICACAO_CROSS_OVERLAP ===')
          pan=[d for d in defs if 'panificacao' in norm(' '.join(d[:3])) or 'padaria' in norm(' '.join(d[:3]))]
          pn=0
          for a,b in itertools.combinations(pan,2):
            for ia,qa in enumerate(a[3],1):
              A=toks(qa)
              for ib,qb in enumerate(b[3],1):
                B=toks(qb); sim=len(A&B)/max(1,len(A|B)); cont=max(len(A&B)/max(1,len(A)),len(A&B)/max(1,len(B)))
                if sim>=0.45 or cont>=0.72:
                  pn+=1
                  print(f'PANOVER|{a[0]}|{ia}|{b[0]}|{ib}|{sim:.2f}|{cont:.2f}|{qa}|{qb}')
          print('PANOVER_COUNT',pn)

          print('=== READY_CHECKLIST_HELPERS ===')
          for i,line in enumerate(s.splitlines(),1):
            if re.search(r'common|base|generic|append|expand|items|definition|catalog|category',line,re.I):
              print(f'RLINE|{i}|{line.rstrip()}')

          print('=== NEW_INSPECTION_CHECKLIST_LOADING ===')
          ns=(root/'screens/new_inspection_screen.dart').read_text(encoding='utf-8')
          lines=ns.splitlines()
          hits=[i for i,l in enumerate(lines) if re.search(r'checklist.*item|getChecklistItems|selected.*checklist|templateIds|checklistTemplate',l,re.I)]
          shown=set()
          for h in hits:
            for k in range(max(0,h-8),min(len(lines),h+14)):
              if k not in shown:
                print(f'NLINE|{k+1}|{lines[k].rstrip()}'); shown.add(k)
          PY
