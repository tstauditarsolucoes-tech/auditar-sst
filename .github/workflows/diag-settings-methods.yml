name: Diagnostico metodos settings
on:
  workflow_dispatch:
  push:
    branches: [feature-report-templates-v32962]
    paths: ['.github/workflows/diag-settings-methods.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/assemble_android_v32961.sh app/Auditar_SST_v1_5_dashboard >/dev/null
      - run: |
          grep -n -A28 -B8 "getSetting\|setSetting" app/Auditar_SST_v1_5_dashboard/lib/database.dart | tail -n 120
