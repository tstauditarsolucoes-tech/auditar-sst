name: Debug v3.28.0 Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3.29.0
    paths:
      - ".github/workflows/debug-v3280-baseline.yml"

permissions:
  contents: read

jobs:
  baseline:
    name: Montar baseline v3.28.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Montar fonte até v3.28.0
        run: |
          rm -rf app && mkdir -p app
          unzip -q Auditar_SST_v1.5_dashboard_completo.zip -d app
          cp -R source_overrides/Auditar_SST_v1_5_dashboard/. app/Auditar_SST_v1_5_dashboard/
          python3 tools/patch_management_snapshot.py app/Auditar_SST_v1_5_dashboard
          python3 tools/prepare_sst_source.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_resume_vistoria.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_multiuser.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_checklist_v324.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_quality_v3241.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_auth_timeout_v3241.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_simple_login_v3242.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_sync_v3243.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_windows_db_v3244.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_visual_v3245.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_pgr_ai_v3250.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_worker_sector_import_v3251.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_checklist_ai_v3252.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_pgr_tools_v3260.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_hardening_v3270.py app/Auditar_SST_v1_5_dashboard
          python3 tools/patch_report_v3280.py app/Auditar_SST_v1_5_dashboard
          grep '^version:' app/Auditar_SST_v1_5_dashboard/pubspec.yaml

      - name: Compactar baseline
        run: |
          cd app
          zip -qr ../Auditar-SST-v3.28.0-Baseline-Exata.zip Auditar_SST_v1_5_dashboard -x "Auditar_SST_v1_5_dashboard/build/*" "Auditar_SST_v1_5_dashboard/.dart_tool/*"

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.28.0-Baseline-Exata
          path: Auditar-SST-v3.28.0-Baseline-Exata.zip
          retention-days: 7
