name: Validar portal CIPA simples e acessível
on:
  push:
    branches:
      - feature/cipa-portal-simples-acessivel-20261106
      - feature/cipa-membro-vistoria-assistida-20261109
    paths:
      - 'feature_sources/cipa_member_portal_screen_v1.dart'
      - 'feature_sources/cipa_member_portal_simple_test_v1.dart'
      - 'feature_sources/cipa_member_guided_inspection_v1.dart'
      - 'feature_sources/cipa_member_guided_inspection_test_v1.dart'
      - '.github/workflows/validate-cipa-portal-simple.yml'
  pull_request:
    branches:
      - feature/cipa-portal-simples-acessivel-20261106
    paths:
      - 'feature_sources/cipa_member_guided_inspection_v1.dart'
      - 'feature_sources/cipa_member_guided_inspection_test_v1.dart'
      - 'feature_sources/cipa_member_portal_screen_v1.dart'
      - 'feature_sources/cipa_member_portal_simple_test_v1.dart'
      - '.github/workflows/validate-cipa-portal-simple.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessible-member-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Criar app de homologação com sessão simulada
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name auditar_sst /tmp/auditar_cipa_simple
          mkdir -p /tmp/auditar_cipa_simple/lib/services
          mkdir -p /tmp/auditar_cipa_simple/lib/screens
          mkdir -p /tmp/auditar_cipa_simple/lib/widgets
          cp feature_sources/cipa_member_identity_v1.dart /tmp/auditar_cipa_simple/lib/services/cipa_member_identity.dart
          cp feature_sources/cipa_member_portal_policy_v1.dart /tmp/auditar_cipa_simple/lib/services/cipa_member_portal_policy.dart
          cp feature_sources/cipa_member_access_header_v1.dart /tmp/auditar_cipa_simple/lib/widgets/cipa_member_access_header.dart
          cp feature_sources/cipa_member_portal_screen_v1.dart /tmp/auditar_cipa_simple/lib/screens/cipa_member_portal_screen.dart
          cp feature_sources/cipa_member_guided_inspection_v1.dart /tmp/auditar_cipa_simple/lib/widgets/cipa_member_guided_inspection.dart
          cp feature_sources/cipa_member_portal_screen_test_v1.dart /tmp/auditar_cipa_simple/test/cipa_member_portal_screen_test.dart
          cp feature_sources/cipa_member_portal_simple_test_v1.dart /tmp/auditar_cipa_simple/test/cipa_member_portal_simple_test.dart
          cp feature_sources/cipa_member_guided_inspection_test_v1.dart /tmp/auditar_cipa_simple/test/cipa_member_guided_inspection_test.dart
          rm /tmp/auditar_cipa_simple/test/widget_test.dart
      - name: Testar telas e autorização por empresa e membro
        run: |
          set -euo pipefail
          cd /tmp/auditar_cipa_simple
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test
          flutter test --reporter expanded test/cipa_member_portal_screen_test.dart test/cipa_member_portal_simple_test.dart test/cipa_member_guided_inspection_test.dart
