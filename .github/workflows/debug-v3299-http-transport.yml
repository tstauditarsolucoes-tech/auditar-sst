name: Debug v3.29.9 HTTP Transport

on:
  push:
    branches: [feature/v3.29.9]
    paths:
      - ".github/workflows/debug-v3299-http-transport.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.9
        run: python3 tools/assemble_v3299.py
      - name: Exportar transporte HTTP e serviço IA
        uses: actions/upload-artifact@v4
        with:
          name: debug-v3299-http-transport
          path: |
            app/Auditar_SST_v1_5_dashboard/lib/services/apps_script_http.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/ai_assistant_service.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/report_screen.dart
          if-no-files-found: error
          retention-days: 2
