name: Diagnostico v3.29.61 Fonte Relatorios e Modelos

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - '.github/workflows/diag-v32961-report-templates-source.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Montar fonte Android v3.29.61
        run: bash tools/assemble_android_v32961.sh "$APP_DIR"

      - name: Preparar fontes de referencia
        run: |
          mkdir -p /tmp/report-source
          cp "$APP_DIR/lib/services/pdf_service.dart" /tmp/report-source/pdf_service.dart
          cp "$APP_DIR/lib/screens/report_screen.dart" /tmp/report-source/report_screen.dart
          cp "$APP_DIR/pubspec.yaml" /tmp/report-source/pubspec.yaml
          sha256sum \
            "$APP_DIR/lib/services/sync_coordinator.dart" \
            "$APP_DIR/lib/services/device_sync_service.dart" \
            "$APP_DIR/lib/services/apps_script_http.dart" \
            > /tmp/report-source/sync-critical.sha256

      - name: Inspecionar pontos de extensao dos relatorios
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/Auditar_SST_v1_5_dashboard')
          candidates = [
              root / 'lib/services/pdf_service.dart',
              root / 'lib/screens/report_screen.dart',
          ]
          patterns = [
              r'executive', r'Executivo', r'Relat[oó]rio', r'PdfService',
              r'generate', r'includeActionPlan', r'Segmentation', r'ChoiceChip',
              r'RadioListTile', r'Dropdown', r'header', r'checklist',
          ]
          rx = re.compile('|'.join(patterns), re.I)

          for path in candidates:
              print(f'\n===== FILE {path} =====')
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = [i for i, line in enumerate(lines) if rx.search(line)]
              blocks = []
              for i in hits:
                  a, b = max(0, i-5), min(len(lines), i+8)
                  if blocks and a <= blocks[-1][1] + 2:
                      blocks[-1] = (blocks[-1][0], max(blocks[-1][1], b))
                  else:
                      blocks.append((a,b))
              for a,b in blocks[:35]:
                  print(f'--- lines {a+1}-{b} ---')
                  for n in range(a,b):
                      print(f'{n+1:04d}: {lines[n]}')
          PY

      - name: Publicar fontes de referencia
        uses: actions/upload-artifact@v4
        with:
          name: v32961-report-source-reference
          path: /tmp/report-source
          retention-days: 1
