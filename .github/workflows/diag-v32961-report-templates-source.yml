name: Diagnostico v3.29.61 Fonte Relatorios e Modelos

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - '.github/workflows/diag-v32961-report-templates-source.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Montar fonte Android v3.29.61
        run: bash tools/assemble_android_v32961.sh "$APP_DIR"

      - name: Preparar fontes de referencia
        run: |
          mkdir -p /tmp/report-source
          cp "$APP_DIR/lib/services/pdf_service.dart" /tmp/report-source/pdf_service.dart
          cp "$APP_DIR/lib/screens/report_screen.dart" /tmp/report-source/report_screen.dart
          cp "$APP_DIR/lib/services/report_file_service.dart" /tmp/report-source/report_file_service.dart
          cp "$APP_DIR/lib/database.dart" /tmp/report-source/database.dart
          cp "$APP_DIR/lib/models.dart" /tmp/report-source/models.dart
          cp "$APP_DIR/pubspec.yaml" /tmp/report-source/pubspec.yaml
          sha256sum \
            "$APP_DIR/lib/services/sync_coordinator.dart" \
            "$APP_DIR/lib/services/device_sync_service.dart" \
            "$APP_DIR/lib/services/apps_script_http.dart" \
            > /tmp/report-source/sync-critical.sha256

      - name: Publicar fontes de referencia
        uses: actions/upload-artifact@v4
        with:
          name: v32961-report-source-reference
          path: /tmp/report-source
          retention-days: 1
