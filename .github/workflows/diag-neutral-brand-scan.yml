name: Diagnostico identidade final da edicao neutra

on:
  workflow_dispatch:
  push:
    branches: [neutral-sst-separate-edition]
    paths: ['.github/workflows/diag-neutral-brand-scan.yml']

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  scan_android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Montar edicao neutra Android v1.0.0
        run: bash tools/assemble_neutral_android_v1.sh "$APP_DIR"
      - name: Inventario final Android
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ANDROID: TODAS AS OCORRENCIAS REMANESCENTES ==='
          grep -RniEi 'auditar|auditar_sst|tstauditarsolucoes|br\.com\.auditar' \
            "$APP_DIR/lib" "$APP_DIR/pubspec.yaml" 2>/dev/null | sed -n '1,1400p' || true

  scan_windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Montar edicao neutra Windows v1.0.0
        run: python tools/assemble_neutral_windows_v1.py "$APP_DIR"
      - name: Inventario final Windows
        shell: bash
        run: |
          set -euo pipefail
          echo '=== WINDOWS: TODAS AS OCORRENCIAS REMANESCENTES ==='
          grep -RniEi 'auditar|auditar_sst|tstauditarsolucoes|br\.com\.auditar' \
            "$APP_DIR/lib" "$APP_DIR/pubspec.yaml" 2>/dev/null | sed -n '1,1600p' || true
