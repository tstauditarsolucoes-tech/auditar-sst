name: Auditar SST v3.38.0 Entrega Estoque Extintores

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.37.0-central-trabalho-pc]
    paths:
      - ".github/workflows/deliver-v3800-extintor-estoque.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows v3.38.0
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.38.0
        run: python tools/assemble_v3800.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar, analisar e testar
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib test
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.38.0+159')) { throw 'versão incorreta' }
          $stock = Get-Content lib/screens/extinguisher_stock_screen.dart -Raw
          if (-not $stock.Contains('Enviar para recarga')) { throw 'ação de recarga ausente' }
          if (-not $stock.Contains('Instalar em um ponto')) { throw 'ação de instalação ausente' }
          if (-not $stock.Contains('Retirar do ponto')) { throw 'ação de retirada ausente' }
          $hub = Get-Content lib/screens/extinguishers_hub_screen.dart -Raw
          foreach ($label in @('Instalados','Estoque','Movimentações')) { if (-not $hub.Contains($label)) { throw "aba ausente: $label" } }
          $sync = Get-Content lib/services/device_sync_service.dart -Raw
          if (-not $sync.Contains("'syncProtocol': 2")) { throw 'sync v2 foi perdido' }
          if ((Select-String lib/ready_checklists.dart -Pattern '^  ReadyChecklistDefinition\(').Count -ne 44) { throw 'biblioteca de 44 checklists alterada' }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar portátil e instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.38.0-PORTATIL.zip' -Force
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppName=Auditar SST
          AppVersion=3.38.0
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.38.0
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:RUNNER_TEMP\auditar.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.38.0-Windows
          path: dist/windows/*
          retention-days: 30

  android-test:
    name: Android v3.38.0 TESTE separado
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.38.0
        run: python3 tools/assemble_v3800.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android de teste
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text, count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "br.com.auditar.auditar_sst.estoque"', text, count=1)
          if count != 1:
              raise SystemExit('Não foi possível alterar applicationId de teste')
          gradle.write_text(text, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          m = re.sub(r'android:label="[^"]+"', 'android:label="Auditar SST ESTOQUE"', m, count=1)
          for permission in (
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ):
              if permission not in m:
                  m = m.replace('<application', permission + '\n    <application', 1)
          manifest.write_text(m, encoding='utf-8')
          PY
          flutter pub get
          dart format lib test
          grep -Fq 'version: 3.38.0+159' pubspec.yaml
          grep -Fq 'EXTINTOR_ESTOQUE' lib/services/extinguisher_inventory_service.dart
          grep -Fq 'Enviar para recarga' lib/screens/extinguisher_stock_screen.dart
          grep -Fq 'Instalar em um ponto' lib/screens/extinguisher_stock_screen.dart
          grep -Fq 'Assinar em tela cheia' lib/screens/signature_screen.dart
          grep -Fq "label: const Text('Tirar foto')" lib/screens/checklist_screen.dart
          grep -Fq 'FieldQuickScreen' lib/screens/home_screen.dart
          grep -Fq "'syncProtocol': 2" lib/services/device_sync_service.dart
          test "$(grep -c '^  ReadyChecklistDefinition(' lib/ready_checklists.dart)" -eq 44
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK TESTE
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if [ -z "$AUDITAR_SYNC_KEY" ]; then echo '::error::AUDITAR_SYNC_KEY ausente'; exit 1; fi
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Preparar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-Android-v3.38.0-ESTOQUE-TESTE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-Android-v3.38.0-ESTOQUE-TESTE
          path: dist/android/Auditar-SST-Android-v3.38.0-ESTOQUE-TESTE.apk
          retention-days: 30

  source:
    name: Código-fonte v3.38.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Montar e empacotar
        run: |
          python3 tools/assemble_v3800.py
          cd app
          zip -qr ../Auditar-SST-Codigo-Fonte-v3.38.0-Estoque-Extintores.zip Auditar_SST_v1_5_dashboard \
            -x 'Auditar_SST_v1_5_dashboard/build/*' \
               'Auditar_SST_v1_5_dashboard/.dart_tool/*' \
               'Auditar_SST_v1_5_dashboard/android/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-Codigo-Fonte-v3.38.0
          path: Auditar-SST-Codigo-Fonte-v3.38.0-Estoque-Extintores.zip
          retention-days: 30
