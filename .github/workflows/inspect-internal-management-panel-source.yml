name: Inspect internal management panel source

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/inspect-internal-management-panel-source.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble and copy source
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          mkdir -p inspect
          cp "$APP_DIR/lib/screens/management_panel_screen.dart" inspect/
          cp "$APP_DIR/lib/screens/company_detail_screen.dart" inspect/
          cp "$APP_DIR/lib/services/management_panel_service.dart" inspect/
      - uses: actions/upload-artifact@v4
        with:
          name: internal-management-panel-source
          path: inspect
          retention-days: 3
