name: Validar unificação de vistorias Android (sem publicar)
on:
  push:
    branches:
      - feature/android-unified-visits-dashboard-20261105
      - feature/android-indicadores-vistorias-confiaveis-20261111
      - feature/android-visita-inteligente-homologacao-20261111
    paths:
      - 'feature_sources/android_unified_visit_metrics_v1.dart'
      - 'feature_sources/android_unified_visit_metrics_test_v1.dart'
      - 'feature_sources/auditar_unified_conclusion_v1.dart'
      - 'feature_sources/auditar_unified_conclusion_test_v1.dart'
      - 'feature_sources/android_visit_type_chooser_v1.dart'
      - 'feature_sources/visit_intelligence_v1.dart'
      - 'feature_sources/visit_intelligence_test_v1.dart'
      - 'feature_sources/smart_visit_briefing_screen_v1.dart'
      - 'feature_sources/smart_visit_briefing_widget_test_v1.dart'
      - 'tools/stage_smart_visit_fixture_v1.py'
      - 'tools/patch_android_unified_visits_v1.py'
      - 'tools/patch_android_standard_conclusion_v1.py'
      - 'tools/patch_checklist_signature_lock_v1.py'
      - 'tools/test_checklist_signature_lock_v1.py tools/stage_smart_visit_fixture_v1.py'
      - '.github/workflows/validate-android-unified-visits.yml'
  pull_request:
    branches:
      - feature/android-unified-visits-dashboard-20261105
      - feature/android-indicadores-vistorias-confiaveis-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Validar sintaxe dos instaladores isolados
        run: |
          python3 -m py_compile tools/patch_android_unified_visits_v1.py tools/patch_android_standard_conclusion_v1.py tools/patch_checklist_signature_lock_v1.py tools/test_checklist_signature_lock_v1.py
          python3 tools/test_checklist_signature_lock_v1.py
      - name: Validar métricas e conclusão de forma independente
        run: |
          dart format feature_sources/android_unified_visit_metrics_v1.dart feature_sources/android_unified_visit_metrics_test_v1.dart feature_sources/auditar_unified_conclusion_v1.dart feature_sources/auditar_unified_conclusion_test_v1.dart feature_sources/visit_intelligence_v1.dart feature_sources/visit_intelligence_test_v1.dart
          dart analyze feature_sources/android_unified_visit_metrics_v1.dart feature_sources/android_unified_visit_metrics_test_v1.dart feature_sources/auditar_unified_conclusion_v1.dart feature_sources/auditar_unified_conclusion_test_v1.dart feature_sources/visit_intelligence_v1.dart feature_sources/visit_intelligence_test_v1.dart
          dart feature_sources/android_unified_visit_metrics_test_v1.dart
          dart feature_sources/auditar_unified_conclusion_test_v1.dart
          dart feature_sources/visit_intelligence_test_v1.dart

  smart-visit-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validar tela e navegação no cliente Android isolado
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name auditar_sst /tmp/auditar_smart_visit_fixture
          python3 tools/stage_smart_visit_fixture_v1.py /tmp/auditar_smart_visit_fixture
          cd /tmp/auditar_smart_visit_fixture
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test
          flutter test --reporter expanded test/smart_visit_briefing_widget_test.dart
