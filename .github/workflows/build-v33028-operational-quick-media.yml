name: Auditar SST Windows v3.30.28 Captura Rapida e Midia

on:
  push:
    branches: [fix-operational-quick-media-v329104]
    paths:
      - '.github/workflows/build-v33028-operational-quick-media.yml'
      - 'tools/patch_operational_quick_media_v329104.py'
      - 'tools/regression_operational_quick_media_v329104.py'
      - 'tools/patch_ronda_checklist_models_v329103.py'
      - 'build_sources/v3.29.103-ronda-models/**'
      - 'tools/patch_dual_ai_v329102.py'
      - 'tools/regression_dual_ai_v329102.py'
      - 'build_sources/v3.29.102-dual-ai/**'
      - 'tools/patch_ronda_pdf_pagination_v329101.py'
      - 'tools/patch_ronda_pdf_pagination_windows_v33025.py'
      - 'build_sources/v3.29.101-ronda-pdf/**'
      - 'tools/patch_windows_receive_first_v33024.py'
      - 'tools/patch_home_immediate_sync_v32993_v33020.py'
      - 'tools/regression_home_immediate_sync_v32993.py'
      - 'tools/restore_fast_home_sync_windows_v33023.py'
      - 'tools/patch_checklist_ai_stable_v32992_v33019.py'
      - 'tools/regression_checklist_ai_stable_v32992.py'
      - 'tools/patch_workers_manual_registration_v32994_v33021.py'
      - 'tools/regression_workers_manual_registration_v32994.py'
      - 'tools/patch_workers_windows_load_compat_v33021.py'
      - 'tools/patch_worker_ai_central_endpoint_v32995_v33022.py'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5

      - name: Montar base Windows atual
        shell: pwsh
        run: |
          python tools/assemble_windows_v3309_mobile_parity.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Base Windows falhou' }
          python tools/patch_signature_handoff_v32982.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura Windows falhou' }
          python tools/patch_pre_admission_search_v32983.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Pre-admissao Windows falhou' }
          python tools/patch_deferred_inspection_ai_v32984.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA base Windows falhou' }
          python tools/patch_checklist_reality_v32985.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Checklists revisados falharam' }
          python tools/patch_checklist_ai_background_v32986_v33013.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA background base falhou' }

      - name: Proteger sincronizacao e banco
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          files=[
            'lib/services/media_sync_service.dart',
            'lib/services/apps_script_http.dart',
            'lib/services/sync_coordinator.dart',
            'lib/services/auth_service.dart',
            'lib/services/drive_service.dart',
            'lib/database.dart',
          ]
          Path('protected33021.json').write_text(
            json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files}),
            encoding='utf-8'
          )
          '@ | python -

      - name: Aplicar recursos atuais e correcao da IA do checklist
        shell: pwsh
        run: |
          python tools/patch_checklist_ai_confirm_v32987_v33014.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Confirmacao IA falhou' }
          python tools/patch_reports_management_v32988_v33015.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Relatorios gerenciais falharam' }
          python tools/patch_report_template_ai_import_v32989_v33016.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Criador de modelos IA falhou' }
          python tools/patch_management_panel_refine_v32990_v33017.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Painel Gerencial refinado falhou' }
          python tools/patch_checklist_ai_stable_v32992_v33019.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA estavel do checklist falhou' }
          python tools/patch_home_immediate_sync_v32993_v33020.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Sync imediato Home Windows falhou' }
          python tools/patch_workers_manual_registration_v32994_v33021.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Cadastro de trabalhadores falhou' }
          python tools/patch_workers_windows_load_compat_v33021.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Compatibilidade tela Windows falhou' }
          python tools/patch_worker_ai_central_endpoint_v32995_v33022.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Central da IA falhou' }
          python tools/restore_fast_home_sync_windows_v33023.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Restauracao da versao Windows falhou' }
          python tools/patch_windows_receive_first_v33024.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Recebimento inicial Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          protected=['lib/services/device_sync_service.dart','lib/services/sync_coordinator.dart','lib/services/media_sync_service.dart','lib/services/ai_assistant_service.dart','lib/screens/express_round_screen.dart','lib/database.dart']
          Path('pdf_win_protected.json').write_text(json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in protected}),encoding='utf-8')
          '@ | python -
          python tools/patch_ronda_pdf_pagination_windows_v33025.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Paginacao PDF Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          old=json.loads(Path('pdf_win_protected.json').read_text(encoding='utf-8'))
          changed=[f for f,h in old.items() if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('Fora do escopo PDF: '+', '.join(changed))
          print('RONDA_PDF_WINDOWS_PATCH_ISOLADO_OK')
          '@ | python -
          python tools/patch_dual_ai_v329102.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA texto/foto Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          protected=['lib/services/device_sync_service.dart','lib/services/sync_coordinator.dart','lib/services/media_sync_service.dart','lib/services/ai_assistant_service.dart','lib/screens/checklist_screen.dart','lib/screens/safety_observations_screen.dart','lib/database.dart']
          Path('ronda_model_windows_protected.json').write_text(json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in protected}),encoding='utf-8')
          '@ | python -
          python tools/patch_ronda_checklist_models_v329103.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Modelos da Ronda Windows falharam' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          files=['lib/services/media_sync_service.dart','lib/services/apps_script_http.dart','lib/services/auth_service.dart','lib/services/ai_assistant_service.dart','lib/services/sync_coordinator.dart','lib/database.dart','lib/screens/express_round_screen.dart','lib/services/express_round_pdf_service.dart']
          Path('operational_scope_windows.json').write_text(json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files}),encoding='utf-8')
          '@ | python -
          python tools/patch_operational_quick_media_v329104.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Captura rapida Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          expected=json.loads(Path('operational_scope_windows.json').read_text(encoding='utf-8'))
          changed=[f for f,h in expected.items() if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('OUT_OF_SCOPE_CHANGE: '+', '.join(changed))
          print('OPERATIONAL_SCOPE_WINDOWS_ISOLATED_OK')
          '@ | python -

          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          old=json.loads(Path('ronda_model_windows_protected.json').read_text(encoding='utf-8'))
          old.pop('lib/services/device_sync_service.dart',None)
          old.pop('lib/screens/checklist_screen.dart',None)
          changed=[f for f,h in old.items() if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('Alteracao fora dos relatorios: '+', '.join(changed))
          print('RONDA_MODEL_WINDOWS_PATCH_ISOLATED_OK')
          '@ | python -



      - name: Confirmar sincronizacao intacta
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          old=json.loads(Path('protected33021.json').read_text(encoding='utf-8'))
          changed=[f for f,h in old.items() if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('SYNC/BANCO WINDOWS ALTERADO: '+', '.join(changed))
          print('SYNC_WINDOWS_V33021_INTACTO_OK')
          '@ | python -

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar analisar testar
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          Copy-Item '..\..\build_sources\v3.29.101-ronda-pdf\express_round_pdf_pagination_test.dart' 'test\express_round_pdf_pagination_test.dart' -Force
          Copy-Item '..\..\build_sources\v3.29.102-dual-ai\inspection_text_ai_test.dart' 'test\inspection_text_ai_test.dart' -Force
          Copy-Item '..\..\build_sources\v3.29.103-ronda-models\ronda_report_models_test.dart' 'test\ronda_report_models_test.dart' -Force
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'Analyze Windows falhou' }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw 'Testes Windows falharam' }

      - name: Regressoes
        shell: pwsh
        run: |
          python tools/regression_home_immediate_sync_v32993.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao sync imediato Home falhou' }
          python tools/regression_training_records_v32968_v3306.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao treinamentos falhou' }
          python tools/regression_internal_management_training_v32969_v3307.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao gerencial falhou' }
          python tools/regression_reports_management_v32988.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao relatorios falhou' }
          python tools/regression_report_template_ai_import_v32989.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao criador modelos IA falhou' }
          python tools/regression_management_panel_refine_v32990.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao Painel Gerencial falhou' }
          python tools/regression_checklist_ai_stable_v32992.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao IA checklist falhou' }
          python tools/regression_workers_manual_registration_v32994.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao trabalhadores falhou' }
          if (-not (Select-String "$env:APP_DIR/lib/services/ai_assistant_service.dart" -Pattern 'embeddedEndpoint.isNotEmpty ? embeddedEndpoint : savedEndpoint' -SimpleMatch -Quiet)) { throw 'Central da IA nao priorizada' }
          $service = Get-Content "$env:APP_DIR/lib/services/device_sync_service.dart" -Raw
          if (-not ($service.Contains('final firstResponse = await _post(') -and $service.Contains('bootstrapHasMore'))) { throw 'Faltou primeiro pull Windows' }
          python tools/regression_dual_ai_v329102.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao IA texto/foto falhou' }
          if (-not (Select-String "$env:APP_DIR/lib/screens/express_round_screen.dart" -Pattern 'ReportTemplateService.getAllTemplates()' -SimpleMatch -Quiet)) { throw 'Escolha de modelo na Ronda ausente' }
          python tools/regression_operational_quick_media_v329104.py "$env:APP_DIR" 3.30.28+215
          if ($LASTEXITCODE -ne 0) { throw 'Regressao captura/midia falhou' }
          Write-Host 'REGRESSOES_WINDOWS_V33028_OK'

      - name: Teste real da rota robusta de foto
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          New-Item -ItemType Directory -Force tool | Out-Null
          Copy-Item '..\..\tools\live_ronda_ai_probe_v3304_windows.dart' 'tool\live_checklist_ai_probe.dart' -Force
          dart run --define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY" tool/live_checklist_ai_probe.dart
          if ($LASTEXITCODE -ne 0) { throw 'Teste real da rota robusta falhou' }

      - name: Compilar Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
          if ($LASTEXITCODE -ne 0) { throw 'Build Windows falhou' }

      - name: Empacotar portatil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $release=(Resolve-Path "$env:APP_DIR/build/windows/x64/runner/Release").Path
          Compress-Archive "$release/*" 'dist/windows/Auditar-SST-Windows-v3.30.28-PORTATIL.zip' -Force
          Get-FileHash 'dist/windows/Auditar-SST-Windows-v3.30.28-PORTATIL.zip' -Algorithm SHA256 | Format-List | Out-File 'dist/windows/Auditar-SST-Windows-v3.30.28-PORTATIL.sha256.txt'

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup nao disponivel' }
          $release=(Resolve-Path "$env:APP_DIR/build/windows/x64/runner/Release").Path
          $output=(Resolve-Path 'dist/windows').Path
          $issPath="$env:RUNNER_TEMP\auditar-v33021.iss"
          $lines=@(
            '[Setup]',
            'AppId={{E659A16C-8CF2-4B57-B357-5B4DB8F32200}',
            'AppName=Auditar SST',
            'AppVersion=3.30.28',
            'AppPublisher=Auditar Solucoes',
            'DefaultDirName={autopf}\Auditar SST',
            'DefaultGroupName=Auditar SST',
            "OutputDir=$output",
            'OutputBaseFilename=Auditar-SST-Setup-v3.30.28',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'ArchitecturesAllowed=x64compatible',
            'ArchitecturesInstallIn64BitMode=x64compatible',
            '[Files]',
            ('Source: "' + $release + '\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'),
            '[Icons]',
            'Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"',
            'Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"',
            '[Run]',
            'Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent'
          )
          Set-Content $issPath $lines -Encoding UTF8
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup falhou' }
          Get-FileHash 'dist/windows/Auditar-SST-Setup-v3.30.28.exe' -Algorithm SHA256 | Format-List | Out-File 'dist/windows/Auditar-SST-Setup-v3.30.28.sha256.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.30.28-Windows-Rapido
          path: dist/windows/*
          retention-days: 30
