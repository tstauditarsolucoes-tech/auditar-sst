name: Gerar Windows Gestão EPI Portátil

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-epi-windows-portable.yml'

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar base funcional do PC
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'auditar-epi-windows/app' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'auditar-epi-windows/app' | Out-Null
          Copy-Item -Recurse -Force 'auditar-epi-gestao/*' 'auditar-epi-windows/app/'

          Copy-Item -Force 'auditar-epi-windows/stable-central-config.js' 'auditar-epi-windows/app/central-config.js'
          Copy-Item -Force 'auditar-epi-windows/pc-stable.js' 'auditar-epi-windows/app/pc-stable.js'
          Copy-Item -Force 'auditar-epi-windows/pc-modern.js' 'auditar-epi-windows/app/pc-modern.js'
          Copy-Item -Force 'auditar-epi-windows/pc-integrity.js' 'auditar-epi-windows/app/pc-integrity.js'
          Copy-Item -Force 'auditar-epi-windows/pc-login-session.js' 'auditar-epi-windows/app/pc-login-session.js'
          Copy-Item -Force 'auditar-epi-windows/pc-login-interaction-v275.js' 'auditar-epi-windows/app/pc-login-interaction-v275.js'
          Copy-Item -Force 'auditar-epi-windows/pc-runtime-fix.js' 'auditar-epi-windows/app/pc-runtime-fix.js'
          Copy-Item -Force 'auditar-epi-windows/pc-worker-sheet.js' 'auditar-epi-windows/app/pc-worker-sheet.js'
          Copy-Item -Force 'auditar-epi-windows/pc-worker-sheet-fiscal.js' 'auditar-epi-windows/app/pc-worker-sheet-fiscal.js'
          Copy-Item -Force 'auditar-epi-windows/pc-fichas-clean-v272.js' 'auditar-epi-windows/app/pc-fichas-clean-v272.js'
          Copy-Item -Force 'auditar-epi-windows/pc-easy-layout-v273.js' 'auditar-epi-windows/app/pc-easy-layout-v273.js'
          Copy-Item -Force 'auditar-epi-windows/pc-batch-delivery-v274.js' 'auditar-epi-windows/app/pc-batch-delivery-v274.js'
          Copy-Item -Force 'auditar-epi-windows/pc-external-face.js' 'auditar-epi-windows/app/pc-external-face.js'
          Copy-Item -Force 'auditar-epi-windows/pc-reliability-v240.js' 'auditar-epi-windows/app/pc-reliability-v240.js'
          Copy-Item -Force 'auditar-epi-windows/pc-productivity-v250.js' 'auditar-epi-windows/app/pc-productivity-v250.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-core-v260.js' 'auditar-epi-windows/app/pc-professional-core-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-alerts-v260.js' 'auditar-epi-windows/app/pc-professional-alerts-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-operations-v260.js' 'auditar-epi-windows/app/pc-professional-operations-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-safety-v260.js' 'auditar-epi-windows/app/pc-professional-safety-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-intelligence-v270.js' 'auditar-epi-windows/app/pc-intelligence-v270.js'
          Copy-Item -Force 'auditar-epi-windows/pc-version-v275.js' 'auditar-epi-windows/app/pc-version-v275.js'

          $indexPath = 'auditar-epi-windows/app/index.html'
          $index = Get-Content $indexPath -Raw
          $scripts = "`r`n  <script src=`"pc-login-session.js`"></script>`r`n  <script src=`"pc-stable.js`"></script>`r`n  <script src=`"auth-gestao.js`" data-auth-gestao=`"1`"></script>`r`n  <script src=`"app.js`"></script>`r`n  <script src=`"central-config.js`"></script>`r`n  <script src=`"indicators.js`"></script>`r`n  <script src=`"pc-modern.js`"></script>`r`n  <script src=`"pc-external-face.js`"></script>`r`n  <script src=`"pc-integrity.js`"></script>`r`n  <script src=`"pc-runtime-fix.js`"></script>`r`n  <script src=`"pc-worker-sheet.js`"></script>`r`n  <script src=`"pc-worker-sheet-fiscal.js`"></script>`r`n  <script src=`"pc-fichas-clean-v272.js`"></script>`r`n  <script src=`"pc-reliability-v240.js`"></script>`r`n  <script src=`"pc-productivity-v250.js`"></script>`r`n  <script src=`"pc-professional-core-v260.js`"></script>`r`n  <script src=`"pc-professional-alerts-v260.js`"></script>`r`n  <script src=`"pc-professional-operations-v260.js`"></script>`r`n  <script src=`"pc-professional-safety-v260.js`"></script>`r`n  <script src=`"pc-version-v275.js`"></script>`r`n  <script src=`"pc-intelligence-v270.js`"></script>`r`n  <script src=`"pc-easy-layout-v273.js`"></script>`r`n  <script src=`"pc-batch-delivery-v274.js`"></script>`r`n  <script src=`"pc-login-interaction-v275.js`"></script>`r`n</body>`r`n</html>`r`n"
          $index = [regex]::Replace($index, '(?s)\s*<!-- Ordem obrigatória:.*?</body>\s*</html>\s*$', $scripts)
          Set-Content -Path $indexPath -Value $index -Encoding UTF8

          if ((Get-Content $indexPath -Raw) -notmatch 'auth-gestao\.js') { throw 'Autenticação não incluída.' }

          node --check 'auditar-epi-windows/main.js'
          node --check 'auditar-epi-windows/preload.js'
          node --check 'auditar-epi-windows/app/auth-gestao.js'
          node --check 'auditar-epi-windows/app/app.js'
          node --check 'auditar-epi-windows/app/pc-login-interaction-v275.js'
          node --check 'auditar-epi-windows/app/pc-batch-delivery-v274.js'

      - name: Gerar ícone do Windows
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y --no-progress
            $env:Path += ';C:\Program Files\ImageMagick-7.1.1-Q16-HDRI'
          }
          magick -background none 'auditar-epi-windows/app/icon.svg' -resize 512x512 'auditar-epi-windows/app-icon.png'

      - name: Instalar dependências
        working-directory: auditar-epi-windows
        run: npm install

      - name: Gerar versão portátil
        working-directory: auditar-epi-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --config.win.artifactName="Gestao-EPI-PC-v2.7.5-PORTATIL.exe"

      - name: Conferir arquivo portátil
        shell: pwsh
        run: |
          Get-ChildItem 'auditar-epi-windows/dist' -File | ForEach-Object { Write-Host $_.FullName }
          if (-not (Test-Path 'auditar-epi-windows/dist/Gestao-EPI-PC-v2.7.5-PORTATIL.exe')) { throw 'EXE portátil não foi criado.' }

      - name: Disponibilizar versão portátil
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-PC-v2.7.5-PORTATIL
          path: auditar-epi-windows/dist/Gestao-EPI-PC-v2.7.5-PORTATIL.exe
          if-no-files-found: error
          retention-days: 14
