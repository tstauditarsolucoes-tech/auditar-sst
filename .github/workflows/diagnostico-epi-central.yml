name: Diagnóstico Central Gestão EPI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-epi-central.yml'
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Testar Central
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbxqMnKiTlAJTFv3-odS2dB1NRcSD8wwvtNxxa-zCFhTM6GeNZszib_1N6eT9wSnOnOyjg/exec'

          echo '=== master_status ==='
          curl -sS -L -D /tmp/h1 -o /tmp/b1 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data '{"action":"master_status"}' "$URL"
          head -n 20 /tmp/h1
          echo 'BODY:'
          head -c 1000 /tmp/b1; echo
          echo

          echo '=== epi_sync_merge sem token ==='
          curl -sS -L -D /tmp/h2 -o /tmp/b2 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data '{"action":"epi_sync_merge","payload":{"version":1,"revision":0,"updatedAt":"","app":{"companies":[],"workers":[],"epis":[],"deliveries":[]},"stock":{"startedAt":"","processedDeliveryIds":[],"movements":[],"minimums":{}}}}' "$URL"
          head -n 20 /tmp/h2
          echo 'BODY:'
          head -c 1000 /tmp/b2; echo
          echo

          echo '=== tenant_login inválido ==='
          curl -sS -L -D /tmp/h3 -o /tmp/b3 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data '{"action":"tenant_login","tenantCode":"NAO_EXISTE","username":"TESTE","password":"TESTE","deviceId":"diag","deviceLabel":"GitHub"}' "$URL"
          head -n 20 /tmp/h3
          echo 'BODY:'
          head -c 1000 /tmp/b3; echo
