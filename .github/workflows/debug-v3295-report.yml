name: Debug v3.29.5 Report

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.4 atual
        run: python3 tools/assemble_v3294.py
      - name: Inspecionar mídia, relatório e sincronização finais
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def snippets(rel, needles, radius=18):
              p=Path(rel)
              if not p.exists():
                  print(f'===== {rel} AUSENTE =====')
                  return
              text=p.read_text(encoding='utf-8')
              lines=text.splitlines()
              print(f'===== {rel} ({len(lines)} linhas) =====')
              shown=set()
              for needle in needles:
                  hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
                  print(f'--- needle={needle!r} hits={hits} ---')
                  for i in hits:
                      a=max(0,i-radius); b=min(len(lines),i+radius+1)
                      key=(a,b)
                      if key in shown: continue
                      shown.add(key)
                      for n in range(a,b):
                          print(f'{n+1:04d}: {lines[n]}')
                      print('---')

          print('===== ARQUIVOS RELACIONADOS A MIDIA =====')
          for p in sorted(Path('lib').rglob('*.dart')):
              low=str(p).lower()
              txt=p.read_text(encoding='utf-8', errors='ignore')
              if 'media' in low or 'MediaSyncService' in txt or 'media_assets' in txt or 'media_sync' in txt:
                  print(p)

          snippets('lib/services/media_sync_service.dart', [
              'class MediaSyncService', 'uploadPending', 'download', 'media_assets',
              'local_path', 'remote', 'file', 'cache', 'asset'
          ], 22)
          snippets('lib/database.dart', [
              'media_assets', 'MediaAsset', 'media_sync', 'evidence_photos',
              'completion_photos', 'getPhotosForAnswer', 'getCompletionPhotos',
              'getOriginalPhotosForAction'
          ], 16)
          snippets('lib/services/pdf_service.dart', [
              'Foto indisponível', '_loadImage', '_photoBox', 'pw.MultiPage',
              'pageNumber', 'pagesCount', 'getPhotosForAnswer',
              'getCompletionPhotos', 'getOriginalPhotosForAction'
          ], 18)
          snippets('lib/services/device_sync_service.dart', [
              'MediaSyncService', '_ensureChangeTracking', '_pendingChanges',
              '_attemptIsDue', 'pendingChangesCount', 'synchronize'
          ], 20)
          snippets('lib/services/sync_coordinator.dart', [
              'addPostFrameCallback', 'verifySession', 'Timer.periodic',
              '_trySync', '_tryAutoBackup', 'Connectivity'
          ], 20)
          PY
