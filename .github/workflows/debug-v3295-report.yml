name: Debug v3.29.5 Report

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.4 atual
        run: python3 tools/assemble_v3294.py
      - name: Inspecionar tipos de fotos e renderização final
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def around(rel, needles, radius=45):
              lines=Path(rel).read_text(encoding='utf-8').splitlines()
              print(f'===== {rel} ({len(lines)} linhas) =====')
              shown=set()
              for needle in needles:
                  hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
                  print(f'--- {needle!r}: {hits} ---')
                  for i in hits:
                      a=max(0,i-radius); b=min(len(lines),i+radius+1)
                      key=(a,b)
                      if key in shown: continue
                      shown.add(key)
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
                      print('---')

          around('lib/models.dart', [
              'class EvidencePhoto',
              'class CompletionPhoto',
              'class ActionPlan',
          ], 50)
          around('lib/services/pdf_service.dart', [
              'static Future<List<pw.Widget>> _photoRows',
              'static Future<pw.Widget> _photoBox',
              'static Future<pw.ImageProvider?> _loadImage',
          ], 65)
          PY
