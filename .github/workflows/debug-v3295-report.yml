name: Debug v3.29.7 Relatorio Semanal

on:
  push:
    branches: [feature/v3.29.7]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.6 atual
        run: python3 tools/assemble_v3296.py
      - name: Salvar fonte final relevante
        uses: actions/upload-artifact@v4
        with:
          name: debug-v3297-weekly-report
          path: |
            app/Auditar_SST_v1_5_dashboard/lib/models.dart
            app/Auditar_SST_v1_5_dashboard/lib/database.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/management_panel_screen.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/company_form_screen.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/management_panel_service.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/management_snapshot_service.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/pdf_service.dart
            app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/Code.gs
            app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/MultiUser.gs
            app/Auditar_SST_v1_5_dashboard/pubspec.yaml
          if-no-files-found: warn
          retention-days: 2
