name: Debug v3.29.5 Pending Improvements

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.5 atual
        run: python3 tools/assemble_v3295.py
      - name: Inspecionar snapshot e configurações de relatórios
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def around(rel, needles, radius=45):
              p=Path(rel)
              if not p.exists():
                  print(f'ARQUIVO AUSENTE: {rel}')
                  return
              lines=p.read_text(encoding='utf-8').splitlines()
              print(f'===== {rel} ({len(lines)} linhas) =====')
              shown=set()
              for needle in needles:
                  hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
                  print(f'--- {needle!r}: {hits} ---')
                  for i in hits:
                      a=max(0,i-radius); b=min(len(lines),i+radius+1)
                      key=(a,b)
                      if key in shown: continue
                      shown.add(key)
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
                      print('---')

          around('lib/services/management_panel_service.dart', [
              "'openNonConformities'", "'pendingActions'", "'recentInspections'",
              "'monthlyReport'", "'notifications'", 'return {',
          ], 60)
          around('lib/models.dart', [
              'monthlyReportEnabled', 'primaryEmail', 'secondaryEmail',
              'class Company', 'notifications',
          ], 45)
          around('lib/screens/settings_screen.dart', [
              'monthlyReportEnabled', 'Relatório mensal', 'primaryEmail',
              'monthlyReportDay', 'notifica',
          ], 45)
          around('lib/database.dart', [
              'monthly_report', 'primary_email', 'secondary_email', 'notifications',
          ], 30)
          PY
