name: Debug v3.29.5 Pending Improvements

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.5 atual
        run: python3 tools/assemble_v3295.py
      - name: Inspecionar IA do checklist e backend
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def around(rel, needles, radius=35):
              lines=Path(rel).read_text(encoding='utf-8').splitlines()
              print(f'===== {rel} ({len(lines)} linhas) =====')
              shown=set()
              for needle in needles:
                  hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
                  print(f'--- {needle!r}: {hits} ---')
                  for i in hits:
                      a=max(0,i-radius); b=min(len(lines),i+radius+1)
                      key=(a,b)
                      if key in shown: continue
                      shown.add(key)
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
                      print('---')

          around('lib/screens/checklist_screen.dart', [
              'analyzeChecklistPhoto',
              'technicianContext',
              'Analisar com IA',
              'Analisar foto',
              'observations[item.id]',
              'Fotos de evidência',
          ], 45)
          around('lib/services/ai_assistant_service.dart', [
              'analyzeChecklistPhoto',
              'technicianContext',
              'return _send',
          ], 30)
          around('painel_web_google_apps_script/Code.gs', [
              "mode === 'checklist_photo'",
              'function doGet',
              'function sendMonthlyReportIfDue_',
              'function createMonthlyPdf_',
              'weekly',
              'persistent',
              'recurring',
              'corrected',
          ], 25)
          PY
