name: Debug v3.29.5 Pending Improvements

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.5 atual
        run: python3 tools/assemble_v3295.py
      - name: Inspecionar relatório, checklist IA e sincronização finais
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          python3 - <<'PY' > ../../debug-v3295.txt
          from pathlib import Path

          def around(rel, needles, radius=32):
              p=Path(rel)
              if not p.exists():
                  print(f'ARQUIVO AUSENTE: {rel}')
                  return
              lines=p.read_text(encoding='utf-8').splitlines()
              print(f'===== {rel} ({len(lines)} linhas) =====')
              shown=set()
              for needle in needles:
                  hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
                  print(f'--- {needle!r}: {hits} ---')
                  for i in hits:
                      a=max(0,i-radius); b=min(len(lines),i+radius+1)
                      key=(a,b)
                      if key in shown: continue
                      shown.add(key)
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
                      print('---')

          around('lib/services/management_panel_service.dart', [
              "'openNonConformities'", "'pendingActions'", "'recentInspections'",
              "'monthlyReport'", "'notifications'", 'managementFollowUp', 'weeklyReport',
          ], 40)
          around('lib/screens/new_inspection_screen.dart', [
              'analy', 'technicianContext', 'AiAssistant', 'foto', 'photo',
              'Observação do técnico', 'O que você observou',
          ], 28)
          around('lib/services/ai_assistant_service.dart', [
              'technicianContext', 'analyze', 'checklist', 'images',
          ], 32)
          around('lib/services/device_sync_service.dart', [
              '_ensureChangeTracking', '_pendingChanges', '_attemptIsDue',
              'device_sync_push', 'device_sync_pull',
          ], 32)
          around('lib/services/sync_coordinator.dart', [
              'Timer.periodic', 'addPostFrameCallback', '_trySync', 'minutes:', 'seconds:',
          ], 28)
          around('painel_web_google_apps_script/Code.gs', [
              'function pushDeviceChanges_', 'function pullDeviceChanges_',
              'sendWeeklyReportIfDue_', 'createWeeklyPdf_', 'managementFollowUp',
              "'Observação do técnico:'", 'technicianContext',
          ], 38)
          PY
          cat ../../debug-v3295.txt
      - name: Salvar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: debug-v3295
          path: debug-v3295.txt
          if-no-files-found: error
          retention-days: 2
