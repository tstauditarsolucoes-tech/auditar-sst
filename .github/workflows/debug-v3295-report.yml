name: Debug v3.29.5 Report

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.4 atual
        run: python3 tools/assemble_v3294.py
      - name: Inspecionar somente mídia e pontos críticos
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def print_all(rel):
              p = Path(rel)
              print(f'===== {rel} =====')
              if not p.exists():
                  print('AUSENTE')
                  return
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  print(f'{n:04d}: {line}')

          def around(rel, needles, radius=28):
              p = Path(rel)
              lines = p.read_text(encoding='utf-8').splitlines()
              print(f'===== {rel} ({len(lines)} linhas) =====')
              covered = []
              for needle in needles:
                  hits = [i for i, line in enumerate(lines) if needle.lower() in line.lower()]
                  print(f'--- {needle!r}: {hits} ---')
                  for i in hits:
                      a=max(0, i-radius); b=min(len(lines), i+radius+1)
                      if any(a >= x and b <= y for x,y in covered):
                          continue
                      covered.append((a,b))
                      for j in range(a,b):
                          print(f'{j+1:04d}: {lines[j]}')
                      print('---')

          print_all('lib/services/media_sync_service.dart')
          around('lib/database.dart', [
              'CREATE TABLE evidence_photos',
              'CREATE TABLE completion_photos',
              'Future<List<EvidencePhoto>> getPhotosForAnswer',
              'Future<List<CompletionPhoto>> getCompletionPhotos',
              'getOriginalPhotosForAction',
              'media_assets',
              'remote_url',
              'remote_key'
          ], 24)
          around('lib/services/device_sync_service.dart', [
              'Future<void> _ensureChangeTracking',
              'Future<int> pendingChangesCount',
              'Future<DeviceSyncResult> synchronize',
              'MediaSyncService',
              'uploadPending'
          ], 30)
          PY
