name: Debug v3.29.5 Pending Improvements

on:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/debug-v3295-report.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.5 atual
        run: python3 tools/assemble_v3295.py
      - name: Validar arquivos relevantes
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          test -f lib/database.dart
          test -f lib/models.dart
          test -f lib/services/management_panel_service.dart
          test -f lib/screens/checklist_screen.dart
          test -f lib/services/ai_assistant_service.dart
          test -f lib/services/device_sync_service.dart
          test -f lib/services/sync_coordinator.dart
          test -f painel_web_google_apps_script/Code.gs
          test -f painel_web_google_apps_script/MultiUser.gs
          echo "Fonte final v3.29.5 montada para inspeção."
      - name: Salvar fonte final relevante
        uses: actions/upload-artifact@v4
        with:
          name: debug-v3295-source
          path: |
            app/Auditar_SST_v1_5_dashboard/lib/database.dart
            app/Auditar_SST_v1_5_dashboard/lib/models.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/management_panel_service.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/checklist_screen.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/ai_assistant_service.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/device_sync_service.dart
            app/Auditar_SST_v1_5_dashboard/lib/services/sync_coordinator.dart
            app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/Code.gs
            app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/MultiUser.gs
            app/Auditar_SST_v1_5_dashboard/pubspec.yaml
          if-no-files-found: error
          retention-days: 2
