name: Validar nome e função do membro CIPA (sem publicar)
on:
  push:
    branches:
      - feature/android-cipa-member-access-secure-20261105
    paths:
      - 'feature_sources/cipa_member_identity_v1.dart'
      - 'feature_sources/cipa_member_identity_test_v1.dart'
      - 'feature_sources/cipa_member_access_header_v1.dart'
      - 'feature_sources/cipa_member_access_header_test_v1.dart'
      - 'tools/patch_cipa_member_label_v1.py'
      - 'tools/test_cipa_member_label_v1.py'
      - '.github/workflows/validate-cipa-member-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Verificar instalador CIPA com núcleo intacto
        run: |
          python3 -m py_compile tools/patch_cipa_member_label_v1.py tools/test_cipa_member_label_v1.py
          python3 tools/test_cipa_member_label_v1.py
      - name: Verificar rótulos e contrato de vínculo com Dart real
        run: |
          dart format feature_sources/cipa_member_identity_v1.dart feature_sources/cipa_member_identity_test_v1.dart feature_sources/cipa_member_access_header_v1.dart feature_sources/cipa_member_access_header_test_v1.dart
          dart analyze feature_sources/cipa_member_identity_v1.dart feature_sources/cipa_member_identity_test_v1.dart
          dart feature_sources/cipa_member_identity_test_v1.dart
