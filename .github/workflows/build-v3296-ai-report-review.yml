name: Auditar SST v3.29.6 Revisao Final com IA

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.29.6]
    paths:
      - ".github/workflows/build-v3296-ai-report-review.yml"
      - "tools/assemble_v3296.py"
      - "tools/patch_ai_report_review_v3296.py"
      - "tools/patch_ai_report_review_v3296.part1"

permissions:
  contents: read

jobs:
  windows:
    name: Windows v3.29.6
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.6
        run: python tools/assemble_v3296.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar, analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.6+149')) { throw 'versão incorreta' }
          $reportScreen = Get-Content lib/screens/report_screen.dart -Raw
          foreach ($term in @('Revisão final com IA','Avaliar relatório com IA','Verificações automáticas','Aplicar conclusão da IA','Manter relatório original','Incluir plano de ação no relatório')) {
            if (-not $reportScreen.Contains($term)) { throw "recurso de relatório ausente: $term" }
          }
          $ai = Get-Content lib/services/ai_assistant_service.dart -Raw
          foreach ($term in @('reviewFinalReport','Pendência sem local exato','Prazo de ação vencido','Item marcado como Conforme precisa de conferência',"'mode': 'report_conclusion'")) {
            if (-not $ai.Contains($term)) { throw "revisão IA ausente: $term" }
          }
          $db = Get-Content lib/database.dart -Raw
          if (-not $db.Contains('updateInspectionNarrative')) { throw 'gravação da conclusão IA ausente' }
          $sig = Get-Content lib/screens/signature_screen.dart -Raw
          foreach ($term in @('Assinar em tela cheia','Assinar externamente por Gov.br','Emitir sem assinatura')) {
            if (-not $sig.Contains($term)) { throw "assinatura regrediu: $term" }
          }
          $checklist = Get-Content lib/screens/checklist_screen.dart -Raw
          if (-not $checklist.Contains('O que você observou no local? (opcional)')) { throw 'observação da IA do checklist ausente' }
          $createAction = Get-Content lib/screens/create_action_screen.dart -Raw
          if (-not $createAction.Contains('Local exato / ponto de referência')) { throw 'local exato do plano ausente' }
          $pdf = Get-Content lib/services/pdf_service.dart -Raw
          if (-not $pdf.Contains('await MediaSyncService.downloadMissing();')) { throw 'recuperação de mídia ausente' }
          if ($pdf.Contains('context.pageNumber + 1') -or $pdf.Contains('context.pagesCount + 1')) { throw 'paginação antiga retornou' }
          $sync = Get-Content lib/services/sync_coordinator.dart -Raw
          if (-not $sync.Contains('Duration(seconds: 45)')) { throw 'cadência otimizada de sync ausente' }
          $multi = Get-Content painel_web_google_apps_script/MultiUser.gs -Raw
          if (-not $multi.Contains('let AUDITAR_AUTH_SS_CACHE_ = null;')) { throw 'otimização MultiUser ausente' }
          $screens = @(
            (Get-Content lib/screens/companies_screen.dart -Raw),
            (Get-Content lib/screens/workers_screen.dart -Raw),
            (Get-Content lib/screens/compliance_alerts_screen.dart -Raw),
            (Get-Content lib/screens/routine_hub_screen.dart -Raw),
            (Get-Content lib/screens/management_panel_screen.dart -Raw),
            (Get-Content lib/screens/home_screen.dart -Raw)
          ) -join "`n"
          foreach ($term in @('Alertas de exames periódicos','Data do último exame','Próximo exame periódico','Exames periódicos','Periódicos críticos','Exames a verificar','Periódicos ≤30d')) {
            if ($screens.Contains($term)) { throw "controle de exames retornou: $term" }
          }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar instalador e portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.29.6-PORTATIL.zip' -Force
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppName=Auditar SST
          AppVersion=3.29.6
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.6
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:RUNNER_TEMP\auditar.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.6-Windows
          path: dist/windows/*
          retention-days: 30

  android:
    name: Android v3.29.6
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.6
        run: python3 tools/assemble_v3296.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          for perm in ('<uses-permission android:name="android.permission.CAMERA" />','<uses-permission android:name="android.permission.INTERNET" />'):
              if perm not in text:
                  text=text.replace('<application',perm+'\n    <application',1)
          manifest.write_text(text)
          PY
          flutter pub get
      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          dart format lib
          grep -Fq 'version: 3.29.6+149' pubspec.yaml
          grep -Fq 'Revisão final com IA' lib/screens/report_screen.dart
          grep -Fq 'Avaliar relatório com IA' lib/screens/report_screen.dart
          grep -Fq 'Verificações automáticas' lib/screens/report_screen.dart
          grep -Fq 'Aplicar conclusão da IA' lib/screens/report_screen.dart
          grep -Fq 'reviewFinalReport' lib/services/ai_assistant_service.dart
          grep -Fq 'Pendência sem local exato' lib/services/ai_assistant_service.dart
          grep -Fq 'Prazo de ação vencido' lib/services/ai_assistant_service.dart
          grep -Fq 'updateInspectionNarrative' lib/database.dart
          grep -Fq 'Assinar em tela cheia' lib/screens/signature_screen.dart
          grep -Fq 'Assinar externamente por Gov.br' lib/screens/signature_screen.dart
          grep -Fq 'Emitir sem assinatura' lib/screens/signature_screen.dart
          grep -Fq 'O que você observou no local? (opcional)' lib/screens/checklist_screen.dart
          grep -Fq 'Local exato / ponto de referência' lib/screens/create_action_screen.dart
          grep -Fq 'await MediaSyncService.downloadMissing();' lib/services/pdf_service.dart
          grep -Fq 'Duration(seconds: 45)' lib/services/sync_coordinator.dart
          ! grep -Fq 'context.pageNumber + 1' lib/services/pdf_service.dart
          ! grep -Fq 'context.pagesCount + 1' lib/services/pdf_service.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK v3.29.6
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Empacotar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.6-Android
          path: dist/android/*
          retention-days: 30
