name: Testar diagnóstico Android sem dispositivo
on:
  pull_request:
    branches: ['fix/android-conectado-seguro-20261126']
    paths:
      - 'tools/android_perf_snapshot_v1.py'
      - '.github/workflows/test-android-perf-snapshot-v1.yml'
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Testes sem ADB, credenciais ou rede da Central
        run: python3 tools/android_perf_snapshot_v1.py --self-test
