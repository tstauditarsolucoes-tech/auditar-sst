name: Diagnóstico Home SST Gestão

on:
  workflow_dispatch:
  push:
    branches: [neutral-sst-separate-edition]
    paths: ['.github/workflows/diag-neutral-home-source.yml']

permissions:
  contents: read

jobs:
  home-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte neutra
        run: |
          set -euo pipefail
          bash tools/assemble_neutral_android_v1.sh app/Auditar_SST_v1_5_dashboard
          mkdir -p diag
          cp app/Auditar_SST_v1_5_dashboard/lib/screens/home_screen.dart diag/home_screen.dart
          cp app/Auditar_SST_v1_5_dashboard/lib/screens/login_screen.dart diag/login_screen.dart
          cp app/Auditar_SST_v1_5_dashboard/lib/widgets/sst_brand_logo.dart diag/sst_brand_logo.dart
          cp app/Auditar_SST_v1_5_dashboard/lib/brand.dart diag/brand.dart
      - uses: actions/upload-artifact@v4
        with:
          name: sst-neutral-home-source
          path: diag/*
          if-no-files-found: error
          retention-days: 2
