name: Auditar SST v3.29.16 Campo Rápido + IA

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.29.16-campo-rapido-ia]
    paths:
      - ".github/workflows/build-v32916-campo-rapido-ia.yml"
      - "tools/assemble_v32916.py"
      - "tools/patch_campo_rapido_ia_v32916.py"

permissions:
  contents: read

jobs:
  android:
    name: Android v3.29.16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.16
        run: python3 tools/assemble_v32916.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib test
          grep -Fq 'version: 3.29.16+159' pubspec.yaml
          grep -Fq 'class FieldQuickScreen' lib/screens/field_quick_screen.dart
          grep -Fq 'Vistoria avulsa' lib/screens/field_quick_screen.dart
          grep -Fq 'Campo rápido / vistoria avulsa' lib/screens/home_screen.dart
          grep -Fq 'initialCompany' lib/screens/new_inspection_screen.dart
          grep -Fq 'fieldMode' lib/screens/new_inspection_screen.dart
          grep -Fq 'IA • O que merece sua atenção' lib/screens/company_detail_screen.dart
          grep -Fq 'startAiPriorities' lib/screens/management_panel_screen.dart
          grep -Fq "'mode': 'checklist_photo'" lib/services/ai_assistant_service.dart
          grep -Fq "'mode': 'report_review_chat'" lib/services/ai_assistant_service.dart
          test "$(grep -c '^  ReadyChecklistDefinition(' lib/ready_checklists.dart)" -eq 44
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK release
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Preparar artefato Android
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.16.apk
          sha256sum dist/android/Auditar-SST-v3.29.16.apk > dist/android/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.16-Android
          path: dist/android/*
          retention-days: 30

  windows:
    name: Windows v3.29.16
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.16
        run: python tools/assemble_v32916.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib test
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.16+159')) { throw 'versão incorreta' }
          $field = Get-Content lib/screens/field_quick_screen.dart -Raw
          if (-not $field.Contains('Vistoria avulsa')) { throw 'vistoria avulsa ausente' }
          $company = Get-Content lib/screens/company_detail_screen.dart -Raw
          if (-not $company.Contains('IA • O que merece sua atenção')) { throw 'atalho IA ausente' }
          $ai = Get-Content lib/services/ai_assistant_service.dart -Raw
          if (-not $ai.Contains("'mode': 'checklist_photo'") -or -not $ai.Contains("'mode': 'report_review_chat'")) { throw 'IA existente foi alterada' }
          if ((Select-String lib/ready_checklists.dart -Pattern '^  ReadyChecklistDefinition\(').Count -ne 44) { throw 'biblioteca de checklists alterada' }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows release
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Preparar portátil Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.29.16-PORTATIL.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.16-Windows
          path: dist/windows/*
          retention-days: 30
