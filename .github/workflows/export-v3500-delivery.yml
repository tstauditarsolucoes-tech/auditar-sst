name: Exportar entrega v3.35.0

on:
  push:
    branches: [feature/v3.35.0-central-multiempresa-campo]
    paths:
      - ".github/workflows/export-v3500-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.35.0
        run: python3 tools/assemble_v3500.py
      - name: Preparar entrega
        run: |
          set -euo pipefail
          APP="app/Auditar_SST_v1_5_dashboard"
          mkdir -p dist/v3500
          cp "$APP/painel_web_google_apps_script/Code.gs" "dist/v3500/Code.gs_v3.35.0_Multiempresa.txt"
          cp "$APP/painel_web_google_apps_script/MultiUser.gs" "dist/v3500/MultiUser.gs_v3.35.0_Multiempresa.txt"
          (cd app && zip -qr "../dist/v3500/Auditar-SST-Codigo-Fonte-v3.35.0-Multiempresa-Campo.zip" "Auditar_SST_v1_5_dashboard")
          sha256sum dist/v3500/* > dist/v3500/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.35.0-Entrega-Complementar
          path: dist/v3500/*
          retention-days: 30
