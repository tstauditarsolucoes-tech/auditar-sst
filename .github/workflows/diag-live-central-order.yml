name: Diagnose Live Central Sync Ordering

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/diag-live-central-order.yml"

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Montar transporte atual e mapear ordem sem PII
        shell: bash
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDITAR_SYNC_KEY:-}"
          python tools/assemble_sync_response_fix.py android
          python tools/patch_sync_queue_android_v32940_v2.py "$APP_DIR"
          python tools/patch_android_transport_guard_v32941.py "$APP_DIR"
          python tools/patch_android_dns_bypass_v32942.py "$APP_DIR"
          python tools/patch_android_dns_bypass_compile_fix.py "$APP_DIR"
          cd "$APP_DIR"
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst . >/dev/null
          flutter pub get >/dev/null
          mkdir -p tool
          cat > tool/order.dart <<'DART'
          import 'dart:convert';
          import '../lib/services/apps_script_http.dart';
          const endpoint='https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec';
          const key=String.fromEnvironment('AUDITAR_SYNC_KEY');
          Future<Map<String,dynamic>> post(Map<String,Object?> body) async {
            final r=await AppsScriptHttp.postJson(Uri.parse(endpoint),body,timeout:const Duration(seconds:30));
            final x=jsonDecode(utf8.decode(r.bodyBytes,allowMalformed:true));
            return Map<String,dynamic>.from(x as Map);
          }
          Future<void> main() async {
            var since=0; final all=<Map<String,dynamic>>[];
            while(true){
              final r=await post({'action':'device_sync_pull','syncKey':key,'deviceId':'order-diag','platform':'android','sinceVersion':since,'limit':500});
              final c=(r['changes'] as List? ?? const []);
              for(final raw in c){ if(raw is Map) all.add(Map<String,dynamic>.from(raw)); }
              final next=(r['nextVersion'] as num?)?.toInt()??since;
              if(r['hasMore']!=true) break;
              if(next<=since) throw StateError('cursor stalled');
              since=next;
            }
            final interesting=['companies','workers','inspections','sectors','evidence_photos','media_assets','checklist_items','checklist_templates'];
            print('TOTAL=${all.length}');
            for(final table in interesting){
              final positions=<int>[]; final versions=<int>[];
              for(var i=0;i<all.length;i++){
                if('${all[i]['table']}'==table){positions.add(i+1);versions.add((all[i]['serverVersion'] as num?)?.toInt()??0);}
              }
              if(positions.isEmpty){print('$table count=0');continue;}
              print('$table count=${positions.length} first_pos=${positions.first} last_pos=${positions.last} first_version=${versions.first} last_version=${versions.last}');
            }
            final checkpoints=[100,300,600,900,1200,1500,1800,2199];
            for(final n in checkpoints){
              final slice=all.take(n);
              final tables=<String,int>{};
              for(final row in slice){final t='${row['table']}';tables[t]=(tables[t]??0)+1;}
              print('FIRST_$n companies=${tables['companies']??0} workers=${tables['workers']??0} inspections=${tables['inspections']??0} evidence=${tables['evidence_photos']??0} media=${tables['media_assets']??0} checklistItems=${tables['checklist_items']??0}');
            }
          }
          DART
          dart run --define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY" tool/order.dart
