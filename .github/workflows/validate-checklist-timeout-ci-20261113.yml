name: Validar ajuste de timeout do checklist IA (sem publicar)
on:
  push:
    branches:
      - feature/auditar-sst-estabilizacao-ci-20261113
    paths:
      - 'tools/patch_checklist_builder_reliability_v329200_v330128.py'
      - 'tools/test_checklist_builder_timeout_compat_v20261113.py'
      - '.github/workflows/validate-checklist-timeout-ci-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeout-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validar duas variantes sem alterar serviços
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_checklist_builder_reliability_v329200_v330128.py tools/test_checklist_builder_timeout_compat_v20261113.py
          python3 tools/test_checklist_builder_timeout_compat_v20261113.py
