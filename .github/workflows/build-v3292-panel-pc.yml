name: Auditar SST v3.29.2 Painel PC

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.29.0]
    paths:
      - ".github/workflows/build-v3292-panel-pc.yml"
      - "tools/assemble_v3292.py"
      - "tools/patch_panel_pc_v3292.py"
      - "tools/patch_signature_fullscreen_v3291.py"

permissions:
  contents: read

jobs:
  windows:
    name: Windows v3.29.2
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.2
        run: python tools/assemble_v3292.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar, analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.2+144')) { throw 'versão incorreta' }
          $nc = Get-Content lib/screens/non_conformities_screen.dart -Raw
          if (-not $nc.Contains('selectedColor: AuditarBrand.greenSoft')) { throw 'contraste de chips ausente' }
          $index = Get-Content painel_web_google_apps_script/Index.html -Raw
          if (-not $index.Contains('v3.29.2 painel gerencial desktop e contraste')) { throw 'painel gerencial v3.29.2 ausente' }
          $sig = Get-Content lib/screens/signature_screen.dart -Raw
          if (-not $sig.Contains('Assinar em tela cheia')) { throw 'assinatura tela cheia ausente' }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar instalador, portátil e painel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          New-Item -ItemType Directory -Force dist/painel | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.29.2-PORTATIL.zip' -Force
          Copy-Item 'app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/Index.html' 'dist/painel/Index-Painel-Gerencial-v3.29.2.html' -Force
          Copy-Item 'app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/Index.html' 'dist/painel/Index-Painel-Gerencial-v3.29.2.txt' -Force
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppName=Auditar SST
          AppVersion=3.29.2
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.2
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:RUNNER_TEMP\auditar.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.2-Windows
          path: dist/windows/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.2-Painel-Gerencial
          path: dist/painel/*
          retention-days: 30

  android:
    name: Android v3.29.2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.2
        run: python3 tools/assemble_v3292.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          for perm in ('<uses-permission android:name="android.permission.CAMERA" />','<uses-permission android:name="android.permission.INTERNET" />'):
              if perm not in text:
                  text=text.replace('<application',perm+'\n    <application',1)
          manifest.write_text(text)
          PY
          flutter pub get
      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          dart format lib
          grep -Fq 'version: 3.29.2+144' pubspec.yaml
          grep -Fq 'Assinar em tela cheia' lib/screens/signature_screen.dart
          grep -Fq 'selectedColor: AuditarBrand.greenSoft' lib/screens/non_conformities_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK v3.29.2
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Empacotar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.2-Android
          path: dist/android/*
          retention-days: 30
