name: Export v3.29.16 Full Audit Source

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.29.16-vistoria-avulsa-layout]
    paths:
      - ".github/workflows/export-v32916-full-audit.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.16
        run: python3 tools/assemble_v32916.py
      - name: Empacotar fonte funcional para auditoria
        run: |
          set -euo pipefail
          APP=app/Auditar_SST_v1_5_dashboard
          mkdir -p dist/audit
          cp "$APP/pubspec.yaml" dist/audit/
          cp -r "$APP/lib" dist/audit/lib
          cp -r "$APP/painel_web_google_apps_script" dist/audit/painel_web_google_apps_script
          find dist/audit -type f | sort > dist/audit/FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.16-Full-Audit-Source
          path: dist/audit/**
          retention-days: 2
