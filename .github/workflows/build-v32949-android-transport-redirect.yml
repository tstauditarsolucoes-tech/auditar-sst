name: Auditar SST Android v3.29.49 Transport Redirect Fix

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/build-v32949-android-transport-redirect.yml"
      - "tools/patch_android_transport_ipv4_redirect_v32949.py"

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Montar Android v3.29.48 e registrar interface
        shell: bash
        run: |
          set -euo pipefail
          python tools/assemble_sync_response_fix.py android
          python tools/patch_sync_queue_android_v32940_v2.py "$APP_DIR"
          python tools/patch_android_transport_guard_v32941.py "$APP_DIR"
          python tools/patch_android_dns_bypass_v32942.py "$APP_DIR"
          python tools/patch_android_dns_bypass_compile_fix.py "$APP_DIR"
          python tools/patch_android_offline_background_sync_v32943.py "$APP_DIR"
          python tools/patch_android_offline_compile_fix_v32943.py "$APP_DIR"
          python tools/patch_android_sync_immediate_v32944.py "$APP_DIR"
          python tools/patch_android_sync_first_pull_v32945.py "$APP_DIR"
          python tools/patch_android_sync_core_v32946.py "$APP_DIR"
          python tools/patch_dds_digital_signature_v32947.py "$APP_DIR"
          python tools/patch_dds_formal_pdf_v32948.py "$APP_DIR"
          python tools/patch_dds_formal_pdf_compile_fix_v32948.py "$APP_DIR"
          grep -q 'version: 3.29.48+190' "$APP_DIR/pubspec.yaml"
          find "$APP_DIR/lib/screens" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/screens-before.sha256

      - name: Aplicar transporte Android v3.29.49
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_android_transport_ipv4_redirect_v32949.py "$APP_DIR"
          grep -q 'version: 3.29.49+191' "$APP_DIR/pubspec.yaml"

      - name: Confirmar interface móvel intacta
        shell: bash
        run: |
          set -euo pipefail
          find "$APP_DIR/lib/screens" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/screens-after.sha256
          diff -u /tmp/screens-before.sha256 /tmp/screens-after.sha256
          echo 'UI Android preservada byte a byte.'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar Android, analisar e testar
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib/services/apps_script_http.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Regressão transporte + sincronização + DDS
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          http=Path('lib/services/apps_script_http.dart').read_text(encoding='utf-8')
          sync=Path('lib/services/device_sync_service.dart').read_text(encoding='utf-8')
          auth=Path('lib/services/auth_service.dart').read_text(encoding='utf-8')
          form=Path('lib/screens/sst_record_form_screen.dart').read_text(encoding='utf-8')
          listing=Path('lib/screens/sst_records_screen.dart').read_text(encoding='utf-8')
          pdf=Path('lib/services/dds_pdf_service.dart').read_text(encoding='utf-8')
          assert 'forceAndroidDirectForTesting' in http
          assert '_resolvePreferredIpv4' in http
          assert 'InternetAddressType.IPv4' in http
          assert 'connectionTimeout = const Duration(seconds: 8)' in http
          assert "method = 'GET';" in http
          assert '_redirectCodes = {301, 302, 303, 307, 308}' in http
          assert 'Não foi possível concluir a comunicação com ${uri.host}' in http
          assert '// Primeiro RECEBE a Central.' in sync
          assert "setSetting('device_sync_server_version', '0')" not in auth
          assert 'Assinaturas digitais' in form
          assert 'Gerar PDF / lista de presença' in listing
          assert 'REGISTRO DE DDS' in pdf
          print('REGRESSAO OK: transporte Android + sync core + DDS formal preservados.')
          PY

      - name: Testar caminho Android direto contra Central real
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/live_transport_v32949.dart <<'DART'
          import 'dart:convert';
          import '../lib/services/apps_script_http.dart';

          final endpoint=Uri.parse('https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec');

          Future<Map<String,dynamic>> call(Map<String,Object?> body) async {
            final sw=Stopwatch()..start();
            final r=await AppsScriptHttp.postJson(endpoint, body, timeout: const Duration(seconds: 30));
            sw.stop();
            if(r.statusCode!=200) throw StateError('HTTP ${r.statusCode}');
            final decoded=jsonDecode(utf8.decode(r.bodyBytes,allowMalformed:true));
            if(decoded is! Map) throw StateError('Resposta não JSON/mapa');
            print('LIVE action=${body['action']} ms=${sw.elapsedMilliseconds} body=$decoded');
            return Map<String,dynamic>.from(decoded);
          }

          Future<void> main() async {
            AppsScriptHttp.forceAndroidDirectForTesting=true;
            final status=await call({'action':'auth_status'});
            if(status['ok']!=true || status['configured']!=true) throw StateError('auth_status inesperado: $status');
            final bad=await call({
              'action':'auth_login',
              'username':'__auditar_v32949_diag_inexistente__',
              'email':'__auditar_v32949_diag_inexistente__',
              'password':'__senha_diag_invalida__',
              'deviceId':'diag-v32949-direct',
              'platform':'android',
            });
            if(bad['code']!='LOGIN_INVALID') throw StateError('Login inválido não retornou contrato esperado: $bad');
            print('LIVE_ANDROID_DIRECT_OK');
          }
          DART
          dart run tool/live_transport_v32949.dart

      - name: Compilar APK release
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDITAR_SYNC_KEY:-}"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            "dist/android/Auditar-SST-v3.29.49-TRANSPORTE-ANDROID-REDIRECT-CORRIGIDO.apk"
          sha256sum "dist/android/Auditar-SST-v3.29.49-TRANSPORTE-ANDROID-REDIRECT-CORRIGIDO.apk" \
            > "dist/android/Auditar-SST-v3.29.49-TRANSPORTE-ANDROID-REDIRECT-CORRIGIDO.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.49-Android-Transporte-Redirect-Corrigido
          path: dist/android/*
          retention-days: 30
