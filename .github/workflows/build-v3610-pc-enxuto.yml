name: Auditar SST v3.36.1 PC Enxuto

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.36.1-pc-enxuto]
    paths:
      - ".github/workflows/build-v3610-pc-enxuto.yml"
      - "tools/assemble_v3610.py"

permissions:
  contents: read

jobs:
  windows:
    name: Windows v3.36.1
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.36.1
        run: python tools/assemble_v3610.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analisar e testar
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib test
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.36.1+156')) { throw 'versão incorreta' }
          $checklist = Get-Content lib/screens/checklist_screen.dart -Raw
          if (-not $checklist.Contains('if (!Platform.isWindows)')) { throw 'câmera ainda está destacada no Windows' }
          if (-not $checklist.Contains('Adicionar foto / arquivo')) { throw 'seleção de arquivo/foto ausente no Windows' }
          $signature = Get-Content lib/screens/signature_screen.dart -Raw
          if (-not $signature.Contains('if (Platform.isAndroid) ...[') -or -not $signature.Contains('Assinar em tela cheia')) { throw 'assinatura mobile não foi separada corretamente' }
          $report = Get-Content lib/screens/report_screen.dart -Raw
          if (-not $report.Contains("? 'Salvar PDF'")) { throw 'ação Salvar PDF do Windows ausente' }
          $homeText = Get-Content lib/screens/home_screen.dart -Raw
          if (-not $homeText.Contains("if (!Platform.isWindows)")) { throw 'Campo rápido ainda destacado no Windows' }
          $sync = Get-Content lib/services/device_sync_service.dart -Raw
          if (-not $sync.Contains("'syncProtocol': 2")) { throw 'sync v2 foi perdido' }
          if ((Select-String lib/ready_checklists.dart -Pattern '^  ReadyChecklistDefinition\(').Count -ne 44) { throw 'biblioteca de 44 checklists alterada' }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar portátil e instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.36.1-PORTATIL.zip' -Force
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppName=Auditar SST
          AppVersion=3.36.1
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.36.1
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:RUNNER_TEMP\auditar.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.36.1-Windows
          path: dist/windows/*
          retention-days: 30

  android-audit:
    name: Android v3.36.1 - auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.36.1
        run: python3 tools/assemble_v3610.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib test
          grep -Fq 'version: 3.36.1+156' pubspec.yaml
          grep -Fq 'Assinar em tela cheia' lib/screens/signature_screen.dart
          grep -Fq 'if (Platform.isAndroid) ...[' lib/screens/signature_screen.dart
          grep -Fq "label: const Text('Tirar foto')" lib/screens/checklist_screen.dart
          grep -Fq 'FieldQuickScreen' lib/screens/home_screen.dart
          grep -Fq "'syncProtocol': 2" lib/services/device_sync_service.dart
          test "$(grep -c '^  ReadyChecklistDefinition(' lib/ready_checklists.dart)" -eq 44
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
