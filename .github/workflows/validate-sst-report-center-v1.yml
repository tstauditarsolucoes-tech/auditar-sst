name: Validar Central de Relatórios SST (6 modelos) isolada
on:
  push:
    branches:
      - feature/android-report-center-six-models-20261106
      - feature/android-pdf-fotos-evidencias-20261111
    paths:
      - 'feature_sources/sst_report_center_*'
      - 'tools/patch_sst_report_center_v1.py'
      - 'tools/test_sst_report_center_patch_v1.py'
      - 'tools/stage_sst_report_center_fixture_v1.py'
      - '.github/workflows/validate-sst-report-center-v1.yml'
  pull_request:
    branches:
      - feature/android-report-center-six-models-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-center:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Aplicar integração em arquivos fictícios sem tocar no núcleo
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_sst_report_center_v1.py tools/test_sst_report_center_patch_v1.py tools/stage_sst_report_center_fixture_v1.py
          python3 tools/test_sst_report_center_patch_v1.py
      - name: Testar modelos, UI e geração de PDF offline em Flutter
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name auditar_sst /tmp/auditar_report_center_fixture
          python3 tools/stage_sst_report_center_fixture_v1.py /tmp/auditar_report_center_fixture
          cd /tmp/auditar_report_center_fixture
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded test/sst_report_center_models_test.dart test/sst_report_center_history_test.dart test/sst_report_center_widget_test.dart test/sst_report_center_pdf_evidence_test.dart
