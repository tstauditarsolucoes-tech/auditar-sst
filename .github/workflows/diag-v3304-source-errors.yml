name: Diagnostico v3.30.4 source errors

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths: ['.github/workflows/diag-v3304-source-errors.yml']

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
  PYTHONIOENCODING: utf-8

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte
        shell: pwsh
        run: |
          python tools/assemble_windows_v3304_ronda_latest.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'montagem falhou' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Formatar e mostrar linhas exatas dos erros
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          dart format lib/screens/express_round_screen.dart lib/services/express_round_pdf_service.dart
          @'
          from pathlib import Path
          for rel, ranges in {
              'lib/screens/express_round_screen.dart': [(238,252)],
              'lib/services/express_round_pdf_service.dart': [(216,250)],
          }.items():
              p=Path(rel)
              lines=p.read_text(encoding='utf-8').splitlines()
              print('\n###', rel)
              for a,b in ranges:
                  for i in range(a,b+1):
                      if 1 <= i <= len(lines): print(f'{i:04d}: {lines[i-1]}')
          '@ | python -
