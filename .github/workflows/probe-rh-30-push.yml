name: Probe RH 30 trabalhadores

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/probe-rh-30-push.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Testar lote de 30
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUDITAR_SYNC_KEY"
          python -m pip install --quiet reportlab requests
          python - <<'PY'
          import base64, io, os, time
          import requests
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          endpoint='https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec'
          buf=io.BytesIO(); c=canvas.Canvas(buf,pagesize=A4); _,h=A4
          y=h-45; c.setFont('Helvetica-Bold',10); c.drawString(35,y,'Nome | Cargo | Setor'); y-=18
          c.setFont('Helvetica',8)
          for i in range(1,31):
              c.drawString(35,y,f'TRABALHADOR TESTE {i:03d} | CERAMISTA | SETOR {((i-1)%10)+1:02d}'); y-=13
          c.save(); pdf=buf.getvalue()
          payload={'action':'ai_assistant','syncKey':os.environ['AUDITAR_SYNC_KEY'],'payload':{'mode':'employee_pdf_import','document':'data:application/pdf;base64,'+base64.b64encode(pdf).decode()}}
          print('PDF_BYTES',len(pdf),flush=True)
          t=time.monotonic()
          r=requests.post(endpoint,json=payload,timeout=180)
          print('HTTP',r.status_code,'ELAPSED_SECONDS',round(time.monotonic()-t,2),flush=True)
          data=r.json(); result=data.get('result') if isinstance(data,dict) else None
          employees=result.get('employees') if isinstance(result,dict) else None
          print('OK',data.get('ok'),'MODEL',data.get('model'),'EMPLOYEE_COUNT',len(employees) if isinstance(employees,list) else None,'MESSAGE',data.get('message'),flush=True)
          PY
