name: Export v3.29.12 AI Source

on:
  push:
    branches: [feature/v3.29.12]
    paths:
      - ".github/workflows/export-v32912-ai-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.12
        run: python3 tools/assemble_v32912.py
      - name: Exportar fontes de IA e HTTP
        uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.12-AI-Source
          path: |
            app/Auditar_SST_v1_5_dashboard/lib/services/*.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/ai_report_chat_screen.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/report_screen.dart
            app/Auditar_SST_v1_5_dashboard/lib/screens/inspection_form_screen.dart
            app/Auditar_SST_v1_5_dashboard/pubspec.yaml
          retention-days: 2
