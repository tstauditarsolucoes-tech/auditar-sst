name: Auditar SST v3.32.0 Android - Auditoria

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.32.0]
    paths:
      - ".github/workflows/audit-v3320-android.yml"

permissions:
  contents: read

jobs:
  android-audit:
    name: Android v3.32.0 - análise e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.32.0
        run: python3 tools/assemble_v3320.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
      - name: Vistoria estrutural Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          grep -Fq 'version: 3.32.0+148' pubspec.yaml
          grep -Fq 'Assinar em tela cheia' lib/screens/signature_screen.dart
          grep -Fq "value: 'gov'" lib/screens/signature_screen.dart
          grep -Fq "value: 'none'" lib/screens/signature_screen.dart
          grep -Fq 'includeActionPlan' lib/screens/signature_screen.dart
          grep -Fq 'DDS Inteligente' lib/screens/dds_ai_screen.dart
          grep -Fq 'IA de Prevenção' lib/screens/prevention_ai_screen.dart
          test "$(grep -c '^  ReadyChecklistDefinition(' lib/ready_checklists.dart)" -eq 44
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Android para auditoria
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
          echo 'APK compilado apenas para teste de regressão. Não substituir instalação atual sem validar assinatura/backup.'

# Auditoria de regressão criada para validar a base compartilhada sem substituir o app instalado.
