name: Validar portal individual CIPA (sem publicar)
on:
  push:
    branches:
      - feature/android-cipa-member-portal-v1-20261105
    paths:
      - 'feature_sources/cipa_member_portal_*'
      - 'feature_sources/cipa_member_server_policy_v1.js'
      - 'tools/patch_cipa_member_portal_v1.py'
      - 'tools/test_cipa_member_portal_v1.py'
      - 'tools/test_cipa_member_server_policy_v1.cjs'
      - '.github/workflows/validate-cipa-member-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Instalação isolada sem alterar auth/sync/Apps Script
        run: |
          python3 -m py_compile tools/patch_cipa_member_portal_v1.py tools/test_cipa_member_portal_v1.py
          python3 tools/test_cipa_member_portal_v1.py
      - name: Permissões do membro no servidor
        run: node tools/test_cipa_member_server_policy_v1.cjs
      - name: Verificar a sintaxe das interfaces
        run: |
          dart format feature_sources/cipa_member_portal_policy_v1.dart feature_sources/cipa_member_portal_policy_test_v1.dart feature_sources/cipa_member_portal_screen_v1.dart feature_sources/cipa_member_portal_screen_test_v1.dart
      - name: Executar casos reais de Dart com dois membros e duas empresas
        run: |
          mkdir -p /tmp/auditar-member-portal
          cp feature_sources/cipa_member_identity_v1.dart /tmp/auditar-member-portal/cipa_member_identity.dart
          cp feature_sources/cipa_member_portal_policy_v1.dart /tmp/auditar-member-portal/cipa_member_portal_policy.dart
          sed -e 's/cipa_member_identity_v1.dart/cipa_member_identity.dart/' -e 's/cipa_member_portal_policy_v1.dart/cipa_member_portal_policy.dart/' feature_sources/cipa_member_portal_policy_test_v1.dart > /tmp/auditar-member-portal/member_test.dart
          dart analyze /tmp/auditar-member-portal
          dart /tmp/auditar-member-portal/member_test.dart
