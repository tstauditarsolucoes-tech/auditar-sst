name: SST Investigacao fotos IA - preflight UX
on:
  push:
    branches:
      - feature/auditar-sst-investigacao-fotos-ux-seguranca-20261125
    paths:
      - 'feature_sources/sst_accident_photo_ai_v1.dart'
      - 'feature_sources/sst_accident_photo_ai_test_v1.dart'
      - 'feature_sources/sst_report_center_screen_v1.dart'
      - 'tools/test_sst_accident_photo_ux_v1.py'
      - '.github/workflows/test-sst-accident-photo-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verificar modulo original e refinamentos (sem dados reais)
        run: |
          python3 tools/test_sst_accident_investigation_guide_v1.py
          python3 tools/test_sst_accident_photo_ai_v1.py
          python3 tools/test_sst_accident_photo_ux_v1.py
