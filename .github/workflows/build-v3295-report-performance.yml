name: Auditar SST v3.29.5 Relatório e Desempenho

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.29.5]
    paths:
      - ".github/workflows/build-v3295-report-performance.yml"
      - "tools/assemble_v3295.py"
      - "tools/patch_report_media_performance_v3295.py"

permissions:
  contents: read

jobs:
  windows:
    name: Windows v3.29.5
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.5
        run: python tools/assemble_v3295.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar, analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.5+147')) { throw 'versão incorreta' }
          $screens = @(
            (Get-Content lib/screens/companies_screen.dart -Raw),
            (Get-Content lib/screens/workers_screen.dart -Raw),
            (Get-Content lib/screens/compliance_alerts_screen.dart -Raw),
            (Get-Content lib/screens/routine_hub_screen.dart -Raw),
            (Get-Content lib/screens/management_panel_screen.dart -Raw),
            (Get-Content lib/screens/home_screen.dart -Raw)
          ) -join "`n"
          foreach ($term in @('Alertas de exames periódicos','Data do último exame','Próximo exame periódico','Exames periódicos','Periódicos críticos','Exames a verificar','Periódicos ≤30d')) {
            if ($screens.Contains($term)) { throw "controle de exames ainda visível: $term" }
          }
          $sig = Get-Content lib/screens/signature_screen.dart -Raw
          if (-not $sig.Contains('Assinar em tela cheia')) { throw 'assinatura em tela cheia ausente' }
          if (-not $sig.Contains('Assinar externamente por Gov.br')) { throw 'fluxo Gov.br ausente' }
          if (-not $sig.Contains('Emitir sem assinatura')) { throw 'emissão sem assinatura ausente' }
          $report = Get-Content lib/services/pdf_service.dart -Raw
          if (-not $report.Contains("import 'media_sync_service.dart';")) { throw 'recuperação de mídia ausente' }
          if (-not $report.Contains('await MediaSyncService.downloadMissing();')) { throw 'download sob demanda de mídia ausente' }
          if (-not $report.Contains('final photoCache = <String, Future<List<EvidencePhoto>>>{};')) { throw 'cache de fotos ausente' }
          if (-not $report.Contains("'Página `${context.pageNumber} de `${context.pagesCount}',")) { throw 'paginação v3.29.5 ausente' }
          if ($report.Contains('context.pageNumber + 1') -or $report.Contains('context.pagesCount + 1')) { throw 'paginação antiga ainda presente' }
          $reportScreen = Get-Content lib/screens/report_screen.dart -Raw
          if (-not $reportScreen.Contains('Incluir plano de ação no relatório')) { throw 'plano de ação opcional ausente' }
          $main = Get-Content lib/main.dart -Raw
          if (-not $main.Contains('checkmarkColor: AuditarBrand.greenDark')) { throw 'contraste global foi perdido' }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar instalador e portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.29.5-PORTATIL.zip' -Force
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppName=Auditar SST
          AppVersion=3.29.5
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.5
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:RUNNER_TEMP\auditar.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.5-Windows
          path: dist/windows/*
          retention-days: 30

  android:
    name: Android v3.29.5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.5
        run: python3 tools/assemble_v3295.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          for perm in ('<uses-permission android:name="android.permission.CAMERA" />','<uses-permission android:name="android.permission.INTERNET" />'):
              if perm not in text:
                  text=text.replace('<application',perm+'\n    <application',1)
          manifest.write_text(text)
          PY
          flutter pub get
      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          dart format lib
          grep -Fq 'version: 3.29.5+147' pubspec.yaml
          grep -Fq 'Assinar em tela cheia' lib/screens/signature_screen.dart
          grep -Fq 'Assinar externamente por Gov.br' lib/screens/signature_screen.dart
          grep -Fq 'Emitir sem assinatura' lib/screens/signature_screen.dart
          grep -Fq 'Incluir plano de ação no relatório' lib/screens/report_screen.dart
          grep -Fq 'checkmarkColor: AuditarBrand.greenDark' lib/main.dart
          grep -Fq "import 'media_sync_service.dart';" lib/services/pdf_service.dart
          grep -Fq 'await MediaSyncService.downloadMissing();' lib/services/pdf_service.dart
          grep -Fq 'final photoCache = <String, Future<List<EvidencePhoto>>>{};' lib/services/pdf_service.dart
          grep -Fq "'Página ${context.pageNumber} de ${context.pagesCount}'," lib/services/pdf_service.dart
          ! grep -Fq 'context.pageNumber + 1' lib/services/pdf_service.dart
          ! grep -Fq 'context.pagesCount + 1' lib/services/pdf_service.dart
          ! grep -Fq 'Alertas de exames periódicos' lib/screens/companies_screen.dart
          ! grep -Fq 'Data do último exame' lib/screens/workers_screen.dart
          ! grep -Fq 'Próximo exame periódico' lib/screens/workers_screen.dart
          ! grep -Fq 'Exames periódicos' lib/screens/compliance_alerts_screen.dart
          ! grep -Fq 'Exames a verificar' lib/screens/routine_hub_screen.dart
          ! grep -Fq 'Periódicos críticos' lib/screens/management_panel_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK v3.29.5
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Empacotar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.5-Android
          path: dist/android/*
          retention-days: 30
