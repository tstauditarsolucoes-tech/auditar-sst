name: Probe RH 121 trabalhadores

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Gerar PDF sintético e testar Central
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUDITAR_SYNC_KEY"
          python -m pip install --quiet reportlab requests
          python - <<'PY'
          import base64, io, json, os, time
          import requests
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4

          endpoint='https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec'
          sync_key=os.environ['AUDITAR_SYNC_KEY']

          buf=io.BytesIO()
          c=canvas.Canvas(buf,pagesize=A4)
          width,height=A4
          y=height-45
          c.setFont('Helvetica-Bold',10)
          c.drawString(35,y,'Nome | Cargo | Setor')
          y-=18
          c.setFont('Helvetica',8)
          for i in range(1,122):
              if y < 45:
                  c.showPage(); c.setFont('Helvetica',8); y=height-45
              c.drawString(35,y,f'TRABALHADOR TESTE {i:03d} | CERAMISTA | SETOR {((i-1)%10)+1:02d}')
              y-=13
          c.save()
          pdf=buf.getvalue()
          doc='data:application/pdf;base64,'+base64.b64encode(pdf).decode()
          payload={
              'action':'ai_assistant',
              'syncKey':sync_key,
              'payload':{'mode':'employee_pdf_import','document':doc},
          }
          print('PDF_BYTES',len(pdf),'BASE64_CHARS',len(doc),flush=True)
          started=time.monotonic()
          try:
              r=requests.post(endpoint,json=payload,timeout=300)
              elapsed=time.monotonic()-started
              print('HTTP',r.status_code,'ELAPSED_SECONDS',round(elapsed,2),flush=True)
              print('CONTENT_TYPE',r.headers.get('content-type',''),flush=True)
              try:
                  data=r.json()
                  print('OK',data.get('ok'),'MODEL',data.get('model'),flush=True)
                  result=data.get('result') if isinstance(data,dict) else None
                  employees=result.get('employees') if isinstance(result,dict) else None
                  print('EMPLOYEE_COUNT',len(employees) if isinstance(employees,list) else None,flush=True)
                  print('MESSAGE',data.get('message'),flush=True)
                  if isinstance(employees,list):
                      print('FIRST',json.dumps(employees[:2],ensure_ascii=False),flush=True)
                      print('LAST',json.dumps(employees[-2:],ensure_ascii=False),flush=True)
              except Exception as e:
                  print('JSON_ERROR',repr(e),'BODY_HEAD',r.text[:1000],flush=True)
          except Exception as e:
              elapsed=time.monotonic()-started
              print('REQUEST_ERROR',type(e).__name__,str(e),'ELAPSED_SECONDS',round(elapsed,2),flush=True)
              raise
          PY
