name: Inspect v3.29.67 management training

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/inspect-v32967-management-training.yml'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Assemble v3.29.67
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          mkdir -p inspect/lib/screens inspect/lib/services inspect/panel
          cp "$APP_DIR/lib/screens/trainings_screen.dart" inspect/lib/screens/
          cp "$APP_DIR/lib/screens/sst_records_screen.dart" inspect/lib/screens/
          cp "$APP_DIR/lib/screens/sst_record_form_screen.dart" inspect/lib/screens/
          cp "$APP_DIR/lib/services/management_panel_service.dart" inspect/lib/services/ || true
          cp "$APP_DIR/lib/services/media_sync_service.dart" inspect/lib/services/
          cp "$APP_DIR/lib/database.dart" inspect/lib/
          cp "$APP_DIR/lib/models.dart" inspect/lib/
          cp "$APP_DIR/painel_web_google_apps_script/Index.html" inspect/panel/
          cp "$APP_DIR/painel_web_google_apps_script/Code.gs" inspect/panel/
      - uses: actions/upload-artifact@v4
        with:
          name: v32967-management-training-source
          path: inspect
          retention-days: 3
