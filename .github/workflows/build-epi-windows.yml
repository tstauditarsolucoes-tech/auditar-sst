name: Gerar Windows Gestão EPI

on:
  workflow_dispatch:
  push:
    branches: [pc-campo-completo]
    paths:
      - 'auditar-epi-gestao/**'
      - 'auditar-epi-windows/**'
      - '.github/workflows/build-epi-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar scripts
        shell: pwsh
        run: |
          node --check 'auditar-epi-gestao/campo-pc.js'
          node --check 'auditar-epi-gestao/ai-import-pc.js'
          node --check 'auditar-epi-gestao/worker-link-pc-fix.js'
          node --check 'auditar-epi-gestao/central-config.js'
          node --check 'auditar-epi-windows/main.js'

      - name: Preparar interface Gestão
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'auditar-epi-windows/app' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'auditar-epi-windows/app' | Out-Null
          Copy-Item -Recurse -Force 'auditar-epi-gestao/*' 'auditar-epi-windows/app/'

      - name: Gerar ícone do Windows
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y --no-progress
            $env:Path += ';C:\Program Files\ImageMagick-7.1.1-Q16-HDRI'
          }
          magick -background none 'auditar-epi-windows/app/icon.svg' -resize 512x512 'auditar-epi-windows/app-icon.png'
          if (-not (Test-Path 'auditar-epi-windows/app-icon.png')) { throw 'Não foi possível gerar o ícone do Gestão EPI.' }

      - name: Instalar dependências
        working-directory: auditar-epi-windows
        run: npm install

      - name: Gerar aplicativo Windows
        working-directory: auditar-epi-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Gestao-Windows
          path: auditar-epi-windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
