name: Gerar Windows Gestão EPI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/gestao-epi-pc-desktop-v280, feature/gestao-epi-biometria-evidencia-v281, feature/gestao-epi-worker-portal-v290, feature/gestao-epi-brand-login-v300, feature/gestao-epi-quality-v310, feature/gestao-epi-legal-v320, feature/gestao-epi-pc-legibility-v321]
    paths:
      - 'auditar-epi-gestao/**'
      - 'auditar-epi-windows/**'
      - 'backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt'
      - 'backend/PortalTrabalhador.html'
      - '.github/workflows/build-epi-windows.yml'

concurrency:
  group: gestao-epi-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar base funcional do PC
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'auditar-epi-windows/app' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'auditar-epi-windows/app' | Out-Null
          Copy-Item -Recurse -Force 'auditar-epi-gestao/*' 'auditar-epi-windows/app/'
          Copy-Item -Force 'auditar-epi-windows/brand-logo-v279.svg' 'auditar-epi-windows/app/brand-logo-v279.svg'
          Copy-Item -Force 'auditar-epi-windows/brand-logo-v300.svg' 'auditar-epi-windows/app/brand-logo-v300.svg'
          Copy-Item -Force 'auditar-epi-windows/stable-central-config.js' 'auditar-epi-windows/app/central-config.js'
          Copy-Item -Force 'auditar-epi-windows/pc-stable.js' 'auditar-epi-windows/app/pc-stable.js'
          Copy-Item -Force 'auditar-epi-windows/pc-biometric-crypto-v281.js' 'auditar-epi-windows/app/pc-biometric-crypto-v281.js'
          Copy-Item -Force 'auditar-epi-windows/pc-modern.js' 'auditar-epi-windows/app/pc-modern.js'
          Copy-Item -Force 'auditar-epi-windows/pc-integrity.js' 'auditar-epi-windows/app/pc-integrity.js'
          Copy-Item -Force 'auditar-epi-windows/pc-login-session.js' 'auditar-epi-windows/app/pc-login-session.js'
          Copy-Item -Force 'auditar-epi-windows/pc-login-safe-v277.js' 'auditar-epi-windows/app/pc-login-safe-v277.js'
          Copy-Item -Force 'auditar-epi-windows/pc-runtime-fix.js' 'auditar-epi-windows/app/pc-runtime-fix.js'
          Copy-Item -Force 'auditar-epi-windows/pc-worker-sheet.js' 'auditar-epi-windows/app/pc-worker-sheet.js'
          Copy-Item -Force 'auditar-epi-windows/pc-worker-portal-v290.js' 'auditar-epi-windows/app/pc-worker-portal-v290.js'
          Copy-Item -Force 'auditar-epi-windows/pc-worker-sheet-fiscal.js' 'auditar-epi-windows/app/pc-worker-sheet-fiscal.js'
          Copy-Item -Force 'auditar-epi-windows/pc-fichas-clean-v272.js' 'auditar-epi-windows/app/pc-fichas-clean-v272.js'
          Copy-Item -Force 'auditar-epi-windows/pc-batch-delivery-v274.js' 'auditar-epi-windows/app/pc-batch-delivery-v274.js'
          Copy-Item -Force 'auditar-epi-windows/pc-external-face.js' 'auditar-epi-windows/app/pc-external-face.js'
          Copy-Item -Force 'auditar-epi-windows/pc-reliability-v240.js' 'auditar-epi-windows/app/pc-reliability-v240.js'
          Copy-Item -Force 'auditar-epi-windows/pc-productivity-v250.js' 'auditar-epi-windows/app/pc-productivity-v250.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-core-v260.js' 'auditar-epi-windows/app/pc-professional-core-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-alerts-v260.js' 'auditar-epi-windows/app/pc-professional-alerts-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-operations-v260.js' 'auditar-epi-windows/app/pc-professional-operations-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-professional-safety-v260.js' 'auditar-epi-windows/app/pc-professional-safety-v260.js'
          Copy-Item -Force 'auditar-epi-windows/pc-intelligence-v270.js' 'auditar-epi-windows/app/pc-intelligence-v270.js'
          Copy-Item -Force 'auditar-epi-windows/pc-brand-v279.js' 'auditar-epi-windows/app/pc-brand-v279.js'
          Copy-Item -Force 'auditar-epi-windows/pc-brand-login-v300.js' 'auditar-epi-windows/app/pc-brand-login-v300.js'
          Copy-Item -Force 'auditar-epi-windows/pc-version-v280.js' 'auditar-epi-windows/app/pc-version-v280.js'
          Copy-Item -Force 'auditar-epi-windows/pc-mobile-parity-v280.js' 'auditar-epi-windows/app/pc-mobile-parity-v280.js'
          Copy-Item -Force 'auditar-epi-windows/pc-desktop-shell-v280.js' 'auditar-epi-windows/app/pc-desktop-shell-v280.js'
          Copy-Item -Force 'auditar-epi-windows/pc-management-v310.js' 'auditar-epi-windows/app/pc-management-v310.js'
          Copy-Item -Force 'auditar-epi-windows/pc-legal-compliance-v320.js' 'auditar-epi-windows/app/pc-legal-compliance-v320.js'
          Copy-Item -Force 'auditar-epi-windows/pc-legibility-v321.js' 'auditar-epi-windows/app/pc-legibility-v321.js'

          $indexPath = 'auditar-epi-windows/app/index.html'
          $index = Get-Content $indexPath -Raw
          $marker = '<!-- Ordem obrigatória:'
          $pos = $index.IndexOf($marker)
          if ($pos -lt 0) { throw 'Marcador de scripts não encontrado no index.html.' }
          $head = $index.Substring(0,$pos)
          $scriptLines = @(
            '  <script src="pc-login-session.js"></script>',
            '  <script src="pc-stable.js"></script>',
            '  <script src="auth-gestao.js" data-auth-gestao="1"></script>',
            '  <script src="pc-biometric-crypto-v281.js"></script>',
            '  <script src="app.js"></script>',
            '  <script src="central-config.js"></script>',
            '  <script src="indicators.js"></script>',
            '  <script src="pc-modern.js"></script>',
            '  <script src="pc-external-face.js"></script>',
            '  <script src="pc-integrity.js"></script>',
            '  <script src="pc-runtime-fix.js"></script>',
            '  <script src="pc-worker-sheet.js"></script>',
            '  <script src="pc-worker-portal-v290.js"></script>',
            '  <script src="pc-worker-sheet-fiscal.js"></script>',
            '  <script src="pc-fichas-clean-v272.js"></script>',
            '  <script src="pc-reliability-v240.js"></script>',
            '  <script src="pc-productivity-v250.js"></script>',
            '  <script src="pc-professional-core-v260.js"></script>',
            '  <script src="pc-professional-alerts-v260.js"></script>',
            '  <script src="pc-professional-operations-v260.js"></script>',
            '  <script src="pc-professional-safety-v260.js"></script>',
            '  <script src="pc-intelligence-v270.js"></script>',
            '  <script src="pc-batch-delivery-v274.js"></script>',
            '  <script src="pc-brand-v279.js"></script>',
            '  <script src="pc-brand-login-v300.js"></script>',
            '  <script src="pc-version-v280.js"></script>',
            '  <script src="pc-login-safe-v277.js"></script>',
            '  <script src="pc-mobile-parity-v280.js"></script>',
            '  <script src="pc-desktop-shell-v280.js"></script>',
            '  <script src="pc-management-v310.js"></script>',
            '  <script src="pc-legal-compliance-v320.js"></script>',
            '  <script src="pc-legibility-v321.js"></script>',
            '</body>',
            '</html>'
          )
          Set-Content -Path $indexPath -Value ($head + (($scriptLines -join "`r`n") + "`r`n")) -Encoding UTF8
          $assembled = Get-Content $indexPath -Raw

          foreach ($required in @('auth-gestao.js','pc-login-session.js','pc-login-safe-v277.js','pc-biometric-crypto-v281.js','pc-worker-portal-v290.js','pc-batch-delivery-v274.js','pc-brand-v279.js','pc-brand-login-v300.js','pc-version-v280.js','pc-mobile-parity-v280.js','pc-desktop-shell-v280.js','pc-management-v310.js','pc-legal-compliance-v320.js','pc-legibility-v321.js')) {
            if ($assembled -notmatch [regex]::Escape($required)) { throw "Script obrigatório ausente: $required" }
          }
          if ($assembled -match 'pc-login-bootstrap-v276\.js|pc-login-interaction-v275\.js|login-uppercase-gestao\.js|worker-link-gestao\.js|pc-fix\.js|prepare-pc\.js|pc-easy-layout-v273\.js') {
            throw 'Entrou um módulo antigo/incompatível na montagem.'
          }
          if (-not (Test-Path 'auditar-epi-windows/app/brand-logo-v300.svg')) { throw 'Nova logo oficial ausente na montagem.' }

          node --check 'auditar-epi-windows/main.js'
          node --check 'auditar-epi-windows/preload.js'
          node --check 'auditar-epi-windows/app/auth-gestao.js'
          node --check 'auditar-epi-windows/app/app.js'
          node --check 'auditar-epi-windows/app/pc-login-session.js'
          node --check 'auditar-epi-windows/app/pc-login-safe-v277.js'
          node --check 'auditar-epi-windows/app/pc-stable.js'
          node --check 'auditar-epi-windows/app/pc-worker-portal-v290.js'
          node --check 'auditar-epi-windows/app/pc-biometric-crypto-v281.js'
          node --check 'auditar-epi-windows/app/pc-external-face.js'
          node --check 'auditar-epi-windows/app/pc-modern.js'
          node --check 'auditar-epi-windows/app/pc-integrity.js'
          node --check 'auditar-epi-windows/app/pc-batch-delivery-v274.js'
          node --check 'auditar-epi-windows/app/pc-brand-v279.js'
          node --check 'auditar-epi-windows/app/pc-brand-login-v300.js'
          node --check 'auditar-epi-windows/app/pc-version-v280.js'
          node --check 'auditar-epi-windows/app/pc-mobile-parity-v280.js'
          node --check 'auditar-epi-windows/app/pc-desktop-shell-v280.js'
          node --check 'auditar-epi-windows/app/pc-management-v310.js'
          node --check 'auditar-epi-windows/app/pc-legal-compliance-v320.js'
          node --check 'auditar-epi-windows/app/pc-legibility-v321.js'
          node --check 'auditar-epi-windows/app/pc-intelligence-v270.js'

      - name: Validar paridade funcional do PC
        shell: pwsh
        run: |
          $index = Get-Content 'auditar-epi-windows/app/index.html' -Raw
          $requiredScripts = @(
            'pc-modern.js',
            'pc-biometric-crypto-v281.js',
            'pc-worker-portal-v290.js',
            'pc-batch-delivery-v274.js',
            'pc-reliability-v240.js',
            'pc-productivity-v250.js',
            'pc-professional-core-v260.js',
            'pc-professional-alerts-v260.js',
            'pc-professional-operations-v260.js',
            'pc-professional-safety-v260.js',
            'pc-intelligence-v270.js',
            'pc-fichas-clean-v272.js',
            'pc-mobile-parity-v280.js',
            'pc-desktop-shell-v280.js',
            'pc-management-v310.js',
            'pc-legal-compliance-v320.js',
            'pc-legibility-v321.js'
          )
          foreach ($script in $requiredScripts) {
            if ($index -notmatch [regex]::Escape($script)) { throw "Paridade PC incompleta: $script não foi carregado." }
          }
          if ($index -match 'pc-easy-layout-v273\.js') { throw 'Regressão visual detectada: easy-layout antigo voltou para a montagem.' }
          $parity = Get-Content 'auditar-epi-windows/app/pc-mobile-parity-v280.js' -Raw
          foreach ($feature in @('invoice_document_import','ca_validate','tenant_store_purchase_document','nfImportPc')) {
            if ($parity -notmatch [regex]::Escape($feature)) { throw "Função obrigatória ausente no PC: $feature" }
          }

      - name: Validar Portal do Trabalhador
        shell: pwsh
        run: |
          Copy-Item 'backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt' 'portal-backend-check.js'
          node --check 'portal-backend-check.js'
          $html = Get-Content 'backend/PortalTrabalhador.html' -Raw
          $match = [regex]::Match($html,'<script>([\s\S]*?)</script>')
          if (-not $match.Success) { throw 'JavaScript do Portal do Trabalhador não encontrado.' }
          Set-Content -Path 'portal-html-check.js' -Value $match.Groups[1].Value -Encoding UTF8
          node --check 'portal-html-check.js'
          if ($html -notmatch 'workerPortalPublicData') { throw 'Portal sem chamada segura ao backend.' }
          if ((Get-Content 'backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt' -Raw) -notmatch 'tenant_worker_portal_link') { throw 'Rota de geração do Portal ausente.' }

      - name: Gerar ícone do Windows
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y --no-progress
            $env:Path += ';C:\Program Files\ImageMagick-7.1.1-Q16-HDRI'
          }
          magick -background none 'auditar-epi-windows/app-icon-v300.svg' -resize 512x512 'auditar-epi-windows/app-icon.png'
          if (-not (Test-Path 'auditar-epi-windows/app-icon.png')) { throw 'Não foi possível gerar o ícone do Gestão EPI.' }

      - name: Instalar dependências
        working-directory: auditar-epi-windows
        run: npm install

      - name: Gerar aplicativo Windows
        working-directory: auditar-epi-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Ler versão do aplicativo
        shell: pwsh
        run: |
          $pkg = Get-Content 'auditar-epi-windows/package.json' -Raw | ConvertFrom-Json
          "APP_VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publicar atualização do aplicativo
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gestao-epi-v${{ env.APP_VERSION }}
          name: Gestão EPI PC v${{ env.APP_VERSION }}
          body: |
            Interface desktop dedicada, com navegação lateral persistente, tabelas densas e melhor uso de telas grandes.
            Mantida a base funcional estável de login, sincronização e inicialização.
            Mantidas fichas individuais, estoque, facial, entrega normal, entrega em grupo, CA e demais módulos.
            Incluído Portal do Trabalhador com link individual, histórico, próximas trocas e comprovantes.
            Nova identidade profissional Gestão EPI Auditar, login renovado e novo ícone do aplicativo.
            Painel gerencial v3.1 com indicadores de 30 dias, tendência semanal, trocas previstas, estoque em atenção e qualidade dos cadastros.
            Central LGPD & Compliance v3.2 com checklist de governança, inventário biométrico, solicitações de titulares e modelos de documentos de privacidade, RIPD e resposta a incidentes.
            Escala de leitura desktop v3.2.1 com fontes maiores em menu, títulos, cards, tabelas, formulários, botões, painel gerencial e Central LGPD.
          files: auditar-epi-windows/dist/Gestao-EPI-Setup-${{ env.APP_VERSION }}.exe
          make_latest: true
          overwrite_files: true

      - name: Disponibilizar Portal do Trabalhador
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Portal-Trabalhador-v4.4.0
          path: |
            backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt
            backend/PortalTrabalhador.html
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-PC-v${{ env.APP_VERSION }}-DESKTOP
          path: auditar-epi-windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
