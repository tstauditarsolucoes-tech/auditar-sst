name: Gerar Windows Gestão EPI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auditar-epi-gestao/**'
      - 'auditar-epi-windows/**'
      - '.github/workflows/build-epi-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar base funcional do PC
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'auditar-epi-windows/app' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'auditar-epi-windows/app' | Out-Null
          Copy-Item -Recurse -Force 'auditar-epi-gestao/*' 'auditar-epi-windows/app/'

          # Preserva o transporte e a autenticação da base 2.0.9 confirmada como estável.
          Copy-Item -Force 'auditar-epi-windows/stable-central-config.js' 'auditar-epi-windows/app/central-config.js'
          Copy-Item -Force 'auditar-epi-windows/pc-stable.js' 'auditar-epi-windows/app/pc-stable.js'
          Copy-Item -Force 'auditar-epi-windows/pc-modern.js' 'auditar-epi-windows/app/pc-modern.js'
          Copy-Item -Force 'auditar-epi-windows/pc-integrity.js' 'auditar-epi-windows/app/pc-integrity.js'
          Copy-Item -Force 'auditar-epi-windows/pc-login-session.js' 'auditar-epi-windows/app/pc-login-session.js'
          Copy-Item -Force 'auditar-epi-windows/pc-runtime-fix.js' 'auditar-epi-windows/app/pc-runtime-fix.js'

          $indexPath = 'auditar-epi-windows/app/index.html'
          $index = Get-Content $indexPath -Raw
          $scripts = "`r`n  <script src=`"app.js`"></script>`r`n  <script src=`"pc-login-session.js`"></script>`r`n  <script src=`"pc-stable.js`"></script>`r`n  <script src=`"central-config.js`"></script>`r`n  <script src=`"indicators.js`"></script>`r`n  <script src=`"pc-modern.js`"></script>`r`n  <script src=`"pc-integrity.js`"></script>`r`n  <script src=`"pc-runtime-fix.js`"></script>`r`n</body>`r`n</html>`r`n"
          $index = [regex]::Replace($index, '(?s)\s*<!-- Ordem obrigatória:.*?</body>\s*</html>\s*$', $scripts)
          Set-Content -Path $indexPath -Value $index -Encoding UTF8

          # Bloqueia os adaptadores que quebraram a sincronização nas versões anteriores.
          if ((Get-Content $indexPath -Raw) -match 'login-uppercase-gestao\.js|worker-link-gestao\.js|pc-fix\.js|prepare-pc\.js') {
            throw 'Entrou um adaptador de sincronização que não existe na base estável.'
          }

          node --check 'auditar-epi-windows/main.js'
          node --check 'auditar-epi-windows/app/app.js'
          node --check 'auditar-epi-windows/app/auth-gestao.js'
          node --check 'auditar-epi-windows/app/central-config.js'
          node --check 'auditar-epi-windows/app/pc-login-session.js'
          node --check 'auditar-epi-windows/app/pc-stable.js'
          node --check 'auditar-epi-windows/app/pc-modern.js'
          node --check 'auditar-epi-windows/app/pc-integrity.js'
          node --check 'auditar-epi-windows/app/pc-runtime-fix.js'
          node --check 'auditar-epi-windows/app/epi-photo-ca-gestao.js'

      - name: Gerar ícone do Windows
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y --no-progress
            $env:Path += ';C:\Program Files\ImageMagick-7.1.1-Q16-HDRI'
          }
          magick -background none 'auditar-epi-windows/app/icon.svg' -resize 512x512 'auditar-epi-windows/app-icon.png'
          if (-not (Test-Path 'auditar-epi-windows/app-icon.png')) { throw 'Não foi possível gerar o ícone do Gestão EPI.' }

      - name: Instalar dependências
        working-directory: auditar-epi-windows
        run: npm install

      - name: Gerar aplicativo Windows
        working-directory: auditar-epi-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-PC-v2.2.1-LOGIN-TRAVAMENTO-CORRIGIDOS
          path: auditar-epi-windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
