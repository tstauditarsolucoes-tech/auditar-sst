name: Inspect v3.36.1 PC Mobile Actions

on:
  push:
    branches: [feature/v3.36.1-pc-enxuto]
    paths:
      - ".github/workflows/inspect-v3610-pc-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Montar v3.36.0
        run: python3 tools/assemble_v3600.py
      - name: Mostrar trechos exatos
        run: |
          APP=app/Auditar_SST_v1_5_dashboard
          for F in checklist_screen.dart action_detail_screen.dart improvements_screen.dart extinguishers_screen.dart safety_observations_screen.dart report_screen.dart signature_screen.dart home_screen.dart; do
            echo "===== IMPORTS $F ====="
            sed -n '1,35p' "$APP/lib/screens/$F"
          done
          echo '===== CHECKLIST 2498-2528 ====='; sed -n '2498,2528p' "$APP/lib/screens/checklist_screen.dart"
          echo '===== ACTION 510-540 ====='; sed -n '510,540p' "$APP/lib/screens/action_detail_screen.dart"
          echo '===== IMPROVEMENTS 1385-1420 ====='; sed -n '1385,1420p' "$APP/lib/screens/improvements_screen.dart"
          echo '===== EXTINGUISHERS 1348-1372 ====='; sed -n '1348,1372p' "$APP/lib/screens/extinguishers_screen.dart"
          echo '===== SAFETY 1238-1262 ====='; sed -n '1238,1262p' "$APP/lib/screens/safety_observations_screen.dart"
          echo '===== REPORT 508-625 ====='; sed -n '508,625p' "$APP/lib/screens/report_screen.dart"
          echo '===== SIGNATURE 532-556 ====='; sed -n '532,556p' "$APP/lib/screens/signature_screen.dart"
          echo '===== HOME 410-438 ====='; sed -n '410,438p' "$APP/lib/screens/home_screen.dart"
