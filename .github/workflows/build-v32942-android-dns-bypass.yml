name: Auditar SST Android v3.29.42 DNS Bypass

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/build-v32942-android-dns-bypass.yml"
      - "tools/patch_android_dns_bypass_v32942.py"
      - "tools/patch_android_dns_bypass_compile_fix.py"

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Montar Android v3.29.41 e registrar interface
        shell: bash
        run: |
          set -euo pipefail
          python tools/assemble_sync_response_fix.py android
          python tools/patch_sync_queue_android_v32940_v2.py "$APP_DIR"
          python tools/patch_android_transport_guard_v32941.py "$APP_DIR"
          grep -q 'version: 3.29.41+183' "$APP_DIR/pubspec.yaml"
          find "$APP_DIR/lib/screens" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/screens-before.sha256

      - name: Aplicar fallback DNS real
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_android_dns_bypass_v32942.py "$APP_DIR"
          python tools/patch_android_dns_bypass_compile_fix.py "$APP_DIR"
          grep -q 'version: 3.29.42+184' "$APP_DIR/pubspec.yaml"
          grep -q 'forceDnsFallbackForTesting' "$APP_DIR/lib/services/apps_script_http.dart"
          grep -q '1.1.1.1' "$APP_DIR/lib/services/apps_script_http.dart"
          grep -q 'SecureSocket.secure' "$APP_DIR/lib/services/apps_script_http.dart"

      - name: Confirmar interface móvel intacta
        shell: bash
        run: |
          set -euo pipefail
          find "$APP_DIR/lib/screens" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/screens-after.sha256
          diff -u /tmp/screens-before.sha256 /tmp/screens-after.sha256
          echo 'UI Android preservada byte a byte.'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar Android, analisar e testar
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib/services/apps_script_http.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi

      - name: Testar fallback DNS + TLS contra a Central real
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/dns_fallback_live_test.dart <<'DART'
          import 'dart:convert';
          import '../lib/services/apps_script_http.dart';

          Future<void> main() async {
            final endpoint = Uri.parse('https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec');
            AppsScriptHttp.forceDnsFallbackForTesting = true;
            final response = await AppsScriptHttp.postJson(
              endpoint,
              {'action': 'auth_status'},
              timeout: const Duration(seconds: 20),
            );
            if (response.statusCode != 200) {
              throw StateError('HTTP ${response.statusCode}: ${response.body}');
            }
            final decoded = jsonDecode(response.body);
            if (decoded is! Map) {
              throw StateError('Resposta não JSON/mapa: ${response.body}');
            }
            print('DNS_FALLBACK_LIVE_OK status=${response.statusCode} body=${response.body}');
          }
          DART
          dart run tool/dns_fallback_live_test.dart

      - name: Compilar APK release
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDITAR_SYNC_KEY:-}"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" "dist/android/Auditar-SST-v3.29.42-DNS-FALLBACK-REAL-UI-PRESERVADA.apk"
          sha256sum "dist/android/Auditar-SST-v3.29.42-DNS-FALLBACK-REAL-UI-PRESERVADA.apk" > "dist/android/Auditar-SST-v3.29.42-DNS-FALLBACK-REAL-UI-PRESERVADA.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.42-Android-DNS-Fallback-Real
          path: dist/android/*
          retention-days: 30
