name: Validar Android v3.29.83 Pre-Admissao Pesquisa

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/validate-v32983-pre-admission-search.yml'
      - 'tools/patch_signature_handoff_v32982.py'
      - 'tools/patch_pre_admission_search_v32983.py'
      - 'build_sources/v3.29.82-pre-admission/**'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Montar Android v3.29.81
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          python tools/patch_management_panel_logo_theme_v32970_v3308.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          for src,out in [
            ('build_sources/v3.29.71-nc-quick-resolve/patch_nc_quick_resolve_v32971.py.xz.b64','/tmp/p71.py'),
            ('build_sources/v3.29.74-training-photo/patch_training_import_photo_v32974.py.xz.b64','/tmp/p74.py'),
            ('build_sources/v3.29.77-checklist-fine-face/patch_checklist_fine_face_v32977.py.xz.b64','/tmp/p77.py'),
          ]:
            Path(out).write_bytes(lzma.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY
          python /tmp/p71.py "$APP_DIR"
          python tools/patch_login_resilience_v32972.py "$APP_DIR"
          python tools/patch_training_bulk_import_v32973.py "$APP_DIR"
          python /tmp/p74.py "$APP_DIR"
          python tools/patch_training_import_robust_v32975.py "$APP_DIR"
          python tools/patch_cipa_management_v32976.py "$APP_DIR"
          python /tmp/p77.py "$APP_DIR"
          python tools/patch_refine_new_features_v32978.py "$APP_DIR"
          python tools/patch_refine_new_features_v32979.py "$APP_DIR"
          python tools/patch_performance_report_v32980.py "$APP_DIR"
          python tools/patch_cross_platform_refinement_v32981.py "$APP_DIR" android

      - name: Proteger sincronizacao
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1])
          files=[
            'lib/services/device_sync_service.dart',
            'lib/services/media_sync_service.dart',
            'lib/services/apps_script_http.dart',
            'lib/services/sync_coordinator.dart',
            'lib/database.dart',
          ]
          Path('/tmp/protected83.json').write_text(json.dumps({
            f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files
          }))
          PY

      - name: Aplicar v3.29.82 e v3.29.83
        run: |
          python tools/patch_signature_handoff_v32982.py "$APP_DIR" android
          python tools/patch_pre_admission_search_v32983.py "$APP_DIR" android

      - name: Confirmar sincronizacao intacta
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1]); old=json.loads(Path('/tmp/protected83.json').read_text())
          changed=[f for f,h in old.items() if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('SYNC ALTERADO: '+', '.join(changed))
          print('SYNC_V32983_INTACTO_OK')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          python ../../tools/fix_read_pdf_text_r8_v32965.py .
          python ../../tools/fix_mlkit_text_r8_v32974.py .

      - name: Formatar analisar testar
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Regressoes e marcadores
        run: |
          set -euo pipefail
          grep -q 'version: 3.29.83+225' "$APP_DIR/pubspec.yaml"
          grep -q 'ASSINANDO AGORA' "$APP_DIR/lib/screens/training_records_screen.dart"
          grep -q 'Participante .* de ' "$APP_DIR/lib/screens/training_records_screen.dart"
          grep -q 'Pré-admissão / integração' "$APP_DIR/lib/screens/training_records_screen.dart"
          grep -q 'Adicionar participante em pré-admissão' "$APP_DIR/lib/screens/sst_record_form_screen.dart"
          grep -q 'Pesquisar por nome' "$APP_DIR/lib/screens/trainings_screen.dart"
          grep -q 'SearchableWorkerField' "$APP_DIR/lib/screens/cipa_management_screen.dart"
          grep -q 'showWorkerSearchDialog' "$APP_DIR/lib/screens/cipa_election_detail_screen.dart"
          grep -q 'PRÉ-ADMISSÃO' "$APP_DIR/lib/services/dds_pdf_service.dart"
          python tools/regression_report_templates_v32962.py "$APP_DIR" 3.29.83+225
          python tools/regression_training_records_v32968_v3306.py "$APP_DIR" 3.29.83+225
          python tools/regression_internal_management_training_v32969_v3307.py "$APP_DIR" 3.29.83+225
          echo PRE_ADMISSION_SEARCH_ANDROID_OK
