name: Diagnose Data Safety Progress

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/diag-data-safety-progress.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble current Windows source
        run: python tools/assemble_sync_response_fix.py windows
      - name: Locate data safety screen and sync hooks
        run: |
          APP=app/Auditar_SST_v1_5_dashboard
          echo '--- FILES MATCHING DATA SAFETY ---'
          grep -RIl --include='*.dart' -E 'Segurança dos dados|Seguranca dos dados|Proteção e recuperação|Protecao e recuperacao' "$APP/lib" || true
          echo '--- MATCHES ---'
          grep -RIn --include='*.dart' -E 'Segurança dos dados|Seguranca dos dados|Proteção e recuperação|Protecao e recuperacao|CircularProgressIndicator|sincroniza' "$APP/lib/screens" | head -n 300 || true
          echo '--- DEVICE SYNC API ---'
          grep -n -E 'syncNow|sync|pending|progress|ValueNotifier|Stream|ChangeNotifier|countPending' "$APP/lib/services/device_sync_service.dart" | head -n 300 || true
          echo '--- TARGET FILE CONTENT ---'
          FILE=$(grep -RIl --include='*.dart' -E 'Segurança dos dados|Seguranca dos dados' "$APP/lib/screens" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "FILE=$FILE"
            nl -ba "$FILE" | sed -n '1,420p'
          fi
