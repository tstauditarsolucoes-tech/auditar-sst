name: Diagnose Data Safety Progress

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/diag-data-safety-progress.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble current Android source
        run: python tools/assemble_sync_response_fix.py android
      - name: Inspect Android sync pagination
        run: |
          APP=app/Auditar_SST_v1_5_dashboard
          nl -ba "$APP/lib/services/device_sync_service.dart" | sed -n '170,290p'
