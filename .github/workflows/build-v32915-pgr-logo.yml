name: Auditar SST v3.29.15 PGR + Logo

on:
  push:
    branches: [feature/v3.29.15]
    paths:
      - ".github/workflows/build-v32915-pgr-logo.yml"
      - "tools/assemble_v32915.py"
      - "tools/patch_pgr_logo_v32915.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android v3.29.15
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.15
        run: python3 tools/assemble_v32915.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          for perm in ('<uses-permission android:name="android.permission.CAMERA" />','<uses-permission android:name="android.permission.INTERNET" />'):
              if perm not in text:
                  text=text.replace('<application',perm+'\n    <application',1)
          manifest.write_text(text)
          PY
          flutter pub get
      - name: Analisar e testar
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          dart format lib
          python3 - <<'PY'
          from pathlib import Path
          pub=Path('pubspec.yaml').read_text()
          db=Path('lib/database.dart').read_text()
          pgr=Path('lib/screens/pgr_screen.dart').read_text()
          pgrsvc=Path('lib/services/pgr_service.dart').read_text()
          media=Path('lib/services/media_sync_service.dart').read_text()
          companies=Path('lib/screens/companies_screen.dart').read_text()
          pdf=Path('lib/services/pdf_service.dart').read_text()
          assert 'version: 3.29.15+158' in pub
          assert 'version: 22' in db
          assert 'getPgrDocuments' in db and 'deletePgrDocument' in db
          assert 'Adicionar outro PGR' in pgr and 'Remover este PGR' in pgr
          assert "File(p.join(folder.path, '$id.pdf'))" in pgrsvc
          assert "entityType: 'company_logo'" in media or "entityType:'company_logo'" in media
          assert 'registerCompanyLogo' in media and 'clearCompanyLogo' in media
          assert 'recuperada após reinstalar o app' in companies
          for marker in ('QUANTITATIVO OPERACIONAL','QUADRO DE PROVIDÊNCIAS','O QUE FICOU PENDENTE','O QUE JÁ FOI RESOLVIDO','Evidência principal'):
              assert marker in pdf, marker
          PY
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Empacotar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.15-Android
          path: dist/android/*
          retention-days: 30

  windows:
    name: Windows v3.29.15
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.15
        run: python tools/assemble_v32915.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar, analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          $pub = Get-Content pubspec.yaml -Raw
          $db = Get-Content lib/database.dart -Raw
          $pgr = Get-Content lib/screens/pgr_screen.dart -Raw
          $media = Get-Content lib/services/media_sync_service.dart -Raw
          $companies = Get-Content lib/screens/companies_screen.dart -Raw
          $pdf = Get-Content lib/services/pdf_service.dart -Raw
          if (-not $pub.Contains('version: 3.29.15+158')) { throw 'versão incorreta' }
          if (-not $db.Contains('getPgrDocuments') -or -not $db.Contains('deletePgrDocument')) { throw 'suporte a múltiplos PGRs ausente' }
          if (-not $pgr.Contains('Adicionar outro PGR') -or -not $pgr.Contains('Remover este PGR')) { throw 'UI de múltiplos PGRs ausente' }
          if (-not $media.Contains('registerCompanyLogo') -or -not $media.Contains('clearCompanyLogo')) { throw 'sincronização de logo ausente' }
          if (-not $companies.Contains('recuperada após reinstalar o app')) { throw 'confirmação de logo persistente ausente' }
          foreach ($marker in @('QUANTITATIVO OPERACIONAL','QUADRO DE PROVIDÊNCIAS','O QUE FICOU PENDENTE','O QUE JÁ FOI RESOLVIDO','Evidência principal')) { if (-not $pdf.Contains($marker)) { throw "marcador ausente: $marker" } }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.29.15-PORTATIL.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.15-Windows
          path: dist/windows/*
          retention-days: 30
