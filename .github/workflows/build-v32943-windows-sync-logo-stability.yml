name: Auditar SST Windows v3.29.43 Sync Logo Stability

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/build-v32943-windows-sync-logo-stability.yml"
      - "tools/patch_windows_sync_logo_stability_v32943.py"

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte Windows e aplicar correções
        shell: pwsh
        run: |
          python tools/assemble_sync_response_fix.py windows
          python tools/patch_sync_progress_v32939_32942.py "$env:APP_DIR" windows
          python tools/patch_sync_progress_compile_safety.py "$env:APP_DIR"
          python tools/patch_windows_sync_logo_stability_v32943.py "$env:APP_DIR"
          $pub=Get-Content "$env:APP_DIR/pubspec.yaml" -Raw
          $media=Get-Content "$env:APP_DIR/lib/services/media_sync_service.dart" -Raw
          $companies=Get-Content "$env:APP_DIR/lib/screens/companies_screen.dart" -Raw
          $coord=Get-Content "$env:APP_DIR/lib/services/sync_coordinator.dart" -Raw
          if (-not $pub.Contains('version: 3.29.43+185')) { throw 'versão 3.29.43+185 ausente' }
          if (-not $media.Contains('uploadCompanyLogoNow')) { throw 'upload imediato de logo ausente' }
          if (-not $media.Contains('_localOnlyPathUpdate')) { throw 'proteção contra ciclo de paths ausente' }
          if (-not $companies.Contains('uploadCompanyLogoNow(company.id)')) { throw 'tela de empresas não envia logo imediatamente' }
          if (-not $coord.Contains('const showText = false;')) { throw 'indicador global ainda mostra texto' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analisar e testar
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          if (Test-Path 'test') { dart format test }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'flutter analyze falhou' }
          if (Test-Path 'test') { flutter test; if ($LASTEXITCODE -ne 0) { throw 'flutter test falhou' } }
      - name: Testar Central Online real
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          @'
          import 'dart:convert';
          import 'package:flutter_test/flutter_test.dart';
          import '../lib/services/apps_script_http.dart';

          void main() {
            const endpoint = 'https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec';
            const key = String.fromEnvironment('AUDITAR_SYNC_KEY');
            test('Central responde push/pull JSON válido', () async {
              expect(key, isNotEmpty);
              final uri = Uri.parse(endpoint);
              final push = await AppsScriptHttp.postJson(uri, {
                'action': 'device_sync_push',
                'syncKey': key,
                'deviceId': 'ci-v32943-windows',
                'platform': 'windows',
                'changes': const [],
              });
              expect(push.statusCode, 200);
              final pj = jsonDecode(utf8.decode(push.bodyBytes));
              expect(pj, isA<Map>());
              expect((pj as Map)['ok'], true);

              final pull = await AppsScriptHttp.postJson(uri, {
                'action': 'device_sync_pull',
                'syncKey': key,
                'deviceId': 'ci-v32943-windows',
                'platform': 'windows',
                'sinceVersion': 0,
                'limit': 1,
              });
              expect(pull.statusCode, 200);
              final qj = jsonDecode(utf8.decode(pull.bodyBytes));
              expect(qj, isA<Map>());
              expect((qj as Map)['ok'], true);
            }, timeout: const Timeout(Duration(minutes: 2)));
          }
          '@ | Set-Content test/live_v32943_central_test.dart -Encoding UTF8
          flutter test test/live_v32943_central_test.dart --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
          if ($LASTEXITCODE -ne 0) { throw 'teste vivo da Central falhou' }
          Remove-Item test/live_v32943_central_test.dart -Force
      - name: Compilar Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar portátil e instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $release=(Resolve-Path "$env:APP_DIR/build/windows/x64/runner/Release").Path
          Compress-Archive "$release/*" 'dist/windows/Auditar-SST-Windows-v3.29.43-SYNC-LOGO-STABILITY-PORTATIL.zip' -Force
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup não disponível' }
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppId={{E659A16C-8CF2-4B57-B357-5B4DB8F32200}
          AppName=Auditar SST
          AppVersion=3.29.43
          AppPublisher=Auditar Soluções
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.43-SYNC-LOGO-STABILITY
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar-v32943.iss" $iss -Encoding UTF8
          & $iscc "$env:RUNNER_TEMP\auditar-v32943.iss"
          if (-not (Test-Path 'dist/windows/Auditar-SST-Setup-v3.29.43-SYNC-LOGO-STABILITY.exe')) { throw 'instalador não foi gerado' }
          Get-FileHash 'dist/windows/Auditar-SST-Setup-v3.29.43-SYNC-LOGO-STABILITY.exe' -Algorithm SHA256 | Format-List | Out-File 'dist/windows/Auditar-SST-Setup-v3.29.43-SYNC-LOGO-STABILITY.sha256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.43-Windows-Sync-Logo-Stability
          path: dist/windows/*
          retention-days: 30
