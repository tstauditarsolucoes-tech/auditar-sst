name: Auditar SST - agenda e permissões (homologação)
on:
  push:
    branches: [feature/client-panel-permissions-v329106]
    paths:
      - 'Auditar-SST/**'
      - 'feature_sources/OperationalAgendaV1.gs'
      - 'tools/test_operational_agenda_v1.cjs'
      - 'feature_sources/TechnicianSupervisionCloud_v1.gs'
      - 'tools/test_technician_supervision_v1.cjs'
      - '.github/workflows/validate-operational-agenda.yml'
  pull_request:
    paths:
      - 'Auditar-SST/**'
      - 'feature_sources/OperationalAgendaV1.gs'
      - 'tools/test_operational_agenda_v1.cjs'
      - 'feature_sources/TechnicianSupervisionCloud_v1.gs'
      - 'tools/test_technician_supervision_v1.cjs'
      - '.github/workflows/validate-operational-agenda.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-isolado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar fontes SST da pasta unica para teste
        shell: bash
        run: |
          set -euo pipefail
          test -d Auditar-SST/tools
          cp -a Auditar-SST/. .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do módulo aditivo
        run: node --check --input-type=commonjs < feature_sources/OperationalAgendaV1.gs
      - name: Verificar sintaxe da supervisao
        run: node --check --input-type=commonjs < feature_sources/TechnicianSupervisionCloud_v1.gs
      - name: Testar supervisao ADM e isolamento
        run: node tools/test_technician_supervision_v1.cjs
      - name: Testar permissoes, idempotencia e historico
        run: node tools/test_operational_agenda_v1.cjs
