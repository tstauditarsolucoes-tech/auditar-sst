name: Inspect NC detail source

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/inspect-nc-detail-source.yml'

permissions:
  contents: read
env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble and print NC detail
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          echo '===== non_conformity_detail_screen.dart ====='
          sed -n '1,360p' "$APP_DIR/lib/screens/non_conformity_detail_screen.dart"
          echo '===== action_detail_screen.dart ====='
          sed -n '1,320p' "$APP_DIR/lib/screens/action_detail_screen.dart"
