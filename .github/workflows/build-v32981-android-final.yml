name: Auditar SST Android v3.29.81 Refinado Final

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/build-v32981-android-final.yml'
      - 'tools/patch_cross_platform_refinement_v32981.py'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
  PUB_CACHE: /tmp/auditar-pub-v32981

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Montar base v3.29.80
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          python tools/patch_management_panel_logo_theme_v32970_v3308.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          for src,out in [
            ('build_sources/v3.29.71-nc-quick-resolve/patch_nc_quick_resolve_v32971.py.xz.b64','/tmp/p71.py'),
            ('build_sources/v3.29.74-training-photo/patch_training_import_photo_v32974.py.xz.b64','/tmp/p74.py'),
            ('build_sources/v3.29.77-checklist-fine-face/patch_checklist_fine_face_v32977.py.xz.b64','/tmp/p77.py'),
          ]:
            Path(out).write_bytes(lzma.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY
          python /tmp/p71.py "$APP_DIR"
          python tools/patch_login_resilience_v32972.py "$APP_DIR"
          python tools/patch_training_bulk_import_v32973.py "$APP_DIR"
          python /tmp/p74.py "$APP_DIR"
          python tools/patch_training_import_robust_v32975.py "$APP_DIR"
          python tools/patch_cipa_management_v32976.py "$APP_DIR"
          python /tmp/p77.py "$APP_DIR"
          python tools/patch_refine_new_features_v32978.py "$APP_DIR"
          python tools/patch_refine_new_features_v32979.py "$APP_DIR"
          python tools/patch_performance_report_v32980.py "$APP_DIR"

      - name: Proteger sincronizacao
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1])
          files=['lib/services/device_sync_service.dart','lib/services/media_sync_service.dart','lib/services/apps_script_http.dart','lib/services/sync_coordinator.dart','lib/database.dart']
          Path('/tmp/protected.json').write_text(json.dumps({x:hashlib.sha256((root/x).read_bytes()).hexdigest() for x in files}))
          PY

      - name: Aplicar refinamento final
        run: python tools/patch_cross_platform_refinement_v32981.py "$APP_DIR" android

      - name: Confirmar sincronizacao intacta
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1]); old=json.loads(Path('/tmp/protected.json').read_text())
          changed=[x for x,h in old.items() if hashlib.sha256((root/x).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('SYNC ALTERADO: '+', '.join(changed))
          print('SYNC_ANDROID_INTACTO_OK')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          python ../../tools/fix_read_pdf_text_r8_v32965.py .
          python ../../tools/fix_mlkit_text_r8_v32974.py .

      - name: Analisar testar regressoes
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          cd ../..
          python tools/regression_report_templates_v32962.py "$APP_DIR" 3.29.81+223
          python tools/regression_training_records_v32968_v3306.py "$APP_DIR" 3.29.81+223
          python tools/regression_internal_management_training_v32969_v3307.py "$APP_DIR" 3.29.81+223

      - name: Compilar APK release
        working-directory: ${{ env.APP_DIR }}
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Empacotar
        run: |
          mkdir -p dist
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" dist/Auditar-SST-v3.29.81-Android.apk
          sha256sum dist/Auditar-SST-v3.29.81-Android.apk > dist/Auditar-SST-v3.29.81-Android.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.81-Android-Refinado
          path: dist/*
          retention-days: 30
