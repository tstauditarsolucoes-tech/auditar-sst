name: SST Investigacao guiada - preflight isolado
on:
  push:
    branches:
      - feature/auditar-sst-investigacao-guiada-20261125
    paths:
      - 'feature_sources/sst_accident_investigation_guide_v1.dart'
      - 'feature_sources/sst_report_center_screen_v1.dart'
      - 'feature_sources/sst_report_center_models_v1.dart'
      - 'tools/patch_sst_report_center_v1.py'
      - 'tools/test_sst_accident_investigation_guide_v1.py'
      - '.github/workflows/test-sst-accident-investigation-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar vinculos e escopo sem tocar dados reais
        run: python3 tools/test_sst_accident_investigation_guide_v1.py
