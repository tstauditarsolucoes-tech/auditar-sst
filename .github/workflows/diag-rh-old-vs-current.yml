name: Diagnostico RH v3.29.5 vs v3.29.62

on:
  workflow_dispatch:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/diag-rh-old-vs-current.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Montar v3.29.5 e guardar importador
        run: |
          python tools/assemble_v3295.py
          cp app/Auditar_SST_v1_5_dashboard/lib/services/worker_import_service.dart /tmp/worker_old.dart
          cp app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/Code.gs /tmp/code_old.gs
          sha256sum /tmp/worker_old.dart /tmp/code_old.gs

      - name: Montar v3.29.62 e comparar
        run: |
          bash tools/assemble_android_v32962.sh app/Auditar_SST_v1_5_dashboard
          cp app/Auditar_SST_v1_5_dashboard/lib/services/worker_import_service.dart /tmp/worker_new.dart
          cp app/Auditar_SST_v1_5_dashboard/painel_web_google_apps_script/Code.gs /tmp/code_new.gs
          echo '===== HASHES NOVOS ====='
          sha256sum /tmp/worker_new.dart /tmp/code_new.gs
          echo '===== DIFF WORKER IMPORT ====='
          diff -u /tmp/worker_old.dart /tmp/worker_new.dart || true
          echo '===== DIFF AI EMPLOYEE BACKEND ====='
          python - <<'PY'
          from pathlib import Path
          import difflib

          def extract(text):
              chunks=[]
              markers=[
                  "function runAiAssistant_",
                  "if (mode === 'employee_pdf_import')",
                  "if (mode === 'employee_pdf_import' || mode === 'medical_pdf_import')",
                  "if (mode === 'employee_pdf_import') {",
                  "AUDITAR_AI_MODEL",
                  "maxOutputTokens: mode === 'employee_pdf_import'",
              ]
              seen=[]
              for marker in markers:
                  start=0
                  while True:
                      i=text.find(marker,start)
                      if i<0: break
                      a=max(0,text.rfind('\n',0,max(0,i-900)))
                      b=min(len(text),i+3500)
                      piece=text[a:b]
                      key=(a,b)
                      if key not in seen:
                          seen.append(key); chunks.append(piece)
                      start=i+len(marker)
              return '\n\n--- CHUNK ---\n'.join(chunks)

          old=extract(Path('/tmp/code_old.gs').read_text(encoding='utf-8')).splitlines()
          new=extract(Path('/tmp/code_new.gs').read_text(encoding='utf-8')).splitlines()
          for line in difflib.unified_diff(old,new,fromfile='v3.29.5',tofile='v3.29.62',lineterm=''):
              print(line)
          PY
