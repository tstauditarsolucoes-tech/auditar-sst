name: Gerar Windows Gestão EPI Painel Mestre

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gestao-epi-master/**'
      - 'gestao-epi-master-windows/**'
      - '.github/workflows/build-gestao-epi-master.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Painel Mestre
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'gestao-epi-master-windows/app' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'gestao-epi-master-windows/app' | Out-Null
          Copy-Item -Recurse -Force 'gestao-epi-master/*' 'gestao-epi-master-windows/app/'

      - name: Gerar ícone do Painel Mestre
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y --no-progress
            $env:Path += ';C:\Program Files\ImageMagick-7.1.1-Q16-HDRI'
          }
          magick -background none 'gestao-epi-master-windows/app/icon.svg' -resize 512x512 'gestao-epi-master-windows/app-icon.png'
          if (-not (Test-Path 'gestao-epi-master-windows/app-icon.png')) { throw 'Não foi possível gerar o ícone do Painel Mestre.' }

      - name: Instalar dependências
        working-directory: gestao-epi-master-windows
        run: npm install

      - name: Gerar aplicativo Windows
        working-directory: gestao-epi-master-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Disponibilizar Painel Mestre
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Painel-Mestre-Windows
          path: gestao-epi-master-windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
