name: Diagnose Windows v33027 Current Media Core

on:
  push:
    branches: [fix-field-speed-media-status-v329104]
    paths:
      - '.github/workflows/diag-windows-current-media.yml'
      - 'tools/patch_ronda_checklist_models_v329103.py'
      - 'build_sources/v3.29.103-ronda-models/**'
      - 'tools/patch_dual_ai_v329102.py'
      - 'tools/regression_dual_ai_v329102.py'
      - 'build_sources/v3.29.102-dual-ai/**'
      - 'tools/patch_ronda_pdf_pagination_v329101.py'
      - 'tools/patch_ronda_pdf_pagination_windows_v33025.py'
      - 'build_sources/v3.29.101-ronda-pdf/**'
      - 'tools/patch_windows_receive_first_v33024.py'
      - 'tools/patch_home_immediate_sync_v32993_v33020.py'
      - 'tools/regression_home_immediate_sync_v32993.py'
      - 'tools/restore_fast_home_sync_windows_v33023.py'
      - 'tools/patch_checklist_ai_stable_v32992_v33019.py'
      - 'tools/regression_checklist_ai_stable_v32992.py'
      - 'tools/patch_workers_manual_registration_v32994_v33021.py'
      - 'tools/regression_workers_manual_registration_v32994.py'
      - 'tools/patch_workers_windows_load_compat_v33021.py'
      - 'tools/patch_worker_ai_central_endpoint_v32995_v33022.py'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5

      - name: Montar base Windows atual
        shell: pwsh
        run: |
          python tools/assemble_windows_v3309_mobile_parity.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Base Windows falhou' }
          python tools/patch_signature_handoff_v32982.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura Windows falhou' }
          python tools/patch_pre_admission_search_v32983.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Pre-admissao Windows falhou' }
          python tools/patch_deferred_inspection_ai_v32984.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA base Windows falhou' }
          python tools/patch_checklist_reality_v32985.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Checklists revisados falharam' }
          python tools/patch_checklist_ai_background_v32986_v33013.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA background base falhou' }

      - name: Proteger sincronizacao e banco
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          files=[
            'lib/services/media_sync_service.dart',
            'lib/services/apps_script_http.dart',
            'lib/services/sync_coordinator.dart',
            'lib/services/auth_service.dart',
            'lib/services/drive_service.dart',
            'lib/database.dart',
          ]
          Path('protected33021.json').write_text(
            json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files}),
            encoding='utf-8'
          )
          '@ | python -

      - name: Aplicar recursos atuais e correcao da IA do checklist
        shell: pwsh
        run: |
          python tools/patch_checklist_ai_confirm_v32987_v33014.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Confirmacao IA falhou' }
          python tools/patch_reports_management_v32988_v33015.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Relatorios gerenciais falharam' }
          python tools/patch_report_template_ai_import_v32989_v33016.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Criador de modelos IA falhou' }
          python tools/patch_management_panel_refine_v32990_v33017.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Painel Gerencial refinado falhou' }
          python tools/patch_checklist_ai_stable_v32992_v33019.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA estavel do checklist falhou' }
          python tools/patch_home_immediate_sync_v32993_v33020.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Sync imediato Home Windows falhou' }
          python tools/patch_workers_manual_registration_v32994_v33021.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Cadastro de trabalhadores falhou' }
          python tools/patch_workers_windows_load_compat_v33021.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Compatibilidade tela Windows falhou' }
          python tools/patch_worker_ai_central_endpoint_v32995_v33022.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Central da IA falhou' }
          python tools/restore_fast_home_sync_windows_v33023.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Restauracao da versao Windows falhou' }
          python tools/patch_windows_receive_first_v33024.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Recebimento inicial Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          protected=['lib/services/device_sync_service.dart','lib/services/sync_coordinator.dart','lib/services/media_sync_service.dart','lib/services/ai_assistant_service.dart','lib/screens/express_round_screen.dart','lib/database.dart']
          Path('pdf_win_protected.json').write_text(json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in protected}),encoding='utf-8')
          '@ | python -
          python tools/patch_ronda_pdf_pagination_windows_v33025.py "$env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Paginacao PDF Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          old=json.loads(Path('pdf_win_protected.json').read_text(encoding='utf-8'))
          changed=[f for f,h in old.items() if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('Fora do escopo PDF: '+', '.join(changed))
          print('RONDA_PDF_WINDOWS_PATCH_ISOLADO_OK')
          '@ | python -
          python tools/patch_dual_ai_v329102.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'IA texto/foto Windows falhou' }
          @'
          from pathlib import Path
          import hashlib,json
          root=Path(r"app/Auditar_SST_v1_5_dashboard")
          protected=['lib/services/device_sync_service.dart','lib/services/sync_coordinator.dart','lib/services/media_sync_service.dart','lib/services/ai_assistant_service.dart','lib/screens/checklist_screen.dart','lib/screens/safety_observations_screen.dart','lib/database.dart']
          Path('ronda_model_windows_protected.json').write_text(json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in protected}),encoding='utf-8')
          '@ | python -
          python tools/patch_ronda_checklist_models_v329103.py "$env:APP_DIR" windows
          if ($LASTEXITCODE -ne 0) { throw 'Modelos da Ronda Windows falharam' }
          New-Item -ItemType Directory -Force audit | Out-Null
          Copy-Item "$env:APP_DIR/lib/services/device_sync_service.dart" 'audit/device_sync_service.dart'
          Copy-Item "$env:APP_DIR/lib/services/media_sync_service.dart" 'audit/media_sync_service.dart'
          Copy-Item "$env:APP_DIR/lib/screens/home_screen.dart" 'audit/home_screen.dart'
          Copy-Item "$env:APP_DIR/lib/screens/checklist_screen.dart" 'audit/checklist_screen.dart'
          Copy-Item "$env:APP_DIR/pubspec.yaml" 'audit/pubspec.yaml'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-current-media-source
          path: audit/*
          retention-days: 3
