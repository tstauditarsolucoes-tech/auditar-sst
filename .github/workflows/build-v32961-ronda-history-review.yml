name: Auditar SST Android v3.29.61 Ronda History Review

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths: ['.github/workflows/build-v32961-ronda-history-review.yml']

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Montar v3.29.61
        run: bash tools/assemble_android_v32961.sh "$APP_DIR"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter analyze e testes
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib/screens/express_round_screen.dart lib/services/ai_assistant_service.dart lib/services/apps_script_http.dart lib/services/sync_coordinator.dart lib/services/device_sync_service.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Regressao v3.29.61
        run: python tools/regression_android_v32961.py "$APP_DIR"

      - name: Teste real Central e foto IA da Ronda
        working-directory: ${{ env.APP_DIR }}
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDITAR_SYNC_KEY:-}"
          mkdir -p tool
          cp ../../tools/live_ronda_ai_probe_v32960.dart tool/live_ronda_ai_probe.dart
          dart run --define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY" tool/live_ronda_ai_probe.dart

      - name: Compilar APK release
        working-directory: ${{ env.APP_DIR }}
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Preparar artefato
        run: |
          mkdir -p dist/android
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" dist/android/Auditar-SST-v3.29.61-RONDA-HISTORICO-REVISAO-IA.apk
          sha256sum dist/android/Auditar-SST-v3.29.61-RONDA-HISTORICO-REVISAO-IA.apk > dist/android/Auditar-SST-v3.29.61-RONDA-HISTORICO-REVISAO-IA.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.61-Android-Ronda-Historico-Revisao-IA
          path: dist/android/*
          retention-days: 30
