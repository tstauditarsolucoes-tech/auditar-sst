name: SST Gestao Neutro Android v1.0.2

on:
  workflow_dispatch:
  push:
    branches: [neutral-sst-separate-edition]
    paths:
      - '.github/workflows/build-neutral-sst-android-v1.yml'
      - 'tools/assemble_neutral_android_v1.sh'
      - 'tools/patch_neutral_sst_edition_v1.py'
      - 'tools/patch_neutral_sst_edition_v1_fixed.py'
      - 'tools/patch_neutral_sst_edition_v1_fixed2.py'
      - 'tools/patch_neutral_brand_widget_compat_v1.py'
      - 'tools/patch_neutral_env_v1.py'
      - 'tools/patch_neutral_final_identity_v1.py'
      - 'tools/patch_neutral_epi_module_v1.py'
      - 'neutral_modules/epi/**'
      - 'tools/patch_neutral_tests_v1.py'
      - 'tools/regression_neutral_sst_v1.py'
      - 'tools/scan_neutral_artifact_v1.py'

permissions:
  contents: read

env:
  SOURCE_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - name: Montar edicao neutra em clone temporario isolado
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/SST_Gestao_Neutro"
          test -z "$(git status --porcelain -- "$SOURCE_DIR")"

          TMP_REPO="$RUNNER_TEMP/sst-neutral-source-repo"
          rm -rf "$TMP_REPO" "$APP_DIR"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$TMP_REPO"
          cd "$TMP_REPO"
          git checkout --detach "$GITHUB_SHA"
          bash tools/assemble_neutral_android_v1.sh "$SOURCE_DIR"

          cp -a "$TMP_REPO/$SOURCE_DIR" "$APP_DIR"

          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain -- "$SOURCE_DIR")"
          git diff --exit-code -- "$SOURCE_DIR"
          echo 'BASE_AUDITAR_INTACTA: montagem ocorreu somente no clone temporario.'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar plataforma Android separada
        working-directory: ${{ runner.temp }}/SST_Gestao_Neutro
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --no-pub --platforms=android --org br.com.sstgestao --project-name sst_gestao .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          sed -i 's/android:label="sst_gestao"/android:label="SST Gestão"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          marker = '<application'
          permissions = []
          if 'android.permission.INTERNET' not in text:
              permissions.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if 'android.permission.ACCESS_NETWORK_STATE' not in text:
              permissions.append('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')
          if 'android.permission.CAMERA' not in text:
              permissions.append('    <uses-permission android:name="android.permission.CAMERA" />')
          if permissions:
              if marker not in text:
                  raise SystemExit('AndroidManifest sem <application>')
              text = text.replace(marker, '\n'.join(permissions) + '\n\n    ' + marker, 1)
              p.write_text(text, encoding='utf-8', newline='\n')
          PY
          find android/app/src/main/res -type f -name 'ic_launcher.png' -print0 | while IFS= read -r -d '' f; do cp assets/branding/sst_icon.png "$f"; done
          flutter pub get
          grep -R "applicationId = \"br.com.sstgestao.sst_gestao\"" android/app/build.gradle.kts
          grep -F 'android:label="SST Gestão"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml

      - name: Analyze e testes
        working-directory: ${{ runner.temp }}/SST_Gestao_Neutro
        run: |
          set -euo pipefail
          dart format \
            lib/brand.dart \
            lib/widgets/sst_brand_logo.dart \
            lib/services/report_template_service.dart \
            lib/services/pdf_service.dart \
            lib/services/styled_report_pdf_service.dart \
            lib/services/backup_service.dart \
            lib/services/auth_service.dart \
            lib/services/background_sync_service.dart \
            lib/screens/login_screen.dart \
            lib/screens/splash_screen.dart \
            lib/screens/home_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/epi_module_screen.dart \
            lib/main.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Regressao neutra final
        run: python tools/regression_neutral_sst_v1.py "$RUNNER_TEMP/SST_Gestao_Neutro"

      - name: Compilar APK neutro ofuscado
        working-directory: ${{ runner.temp }}/SST_Gestao_Neutro
        env:
          SST_APPS_SCRIPT_URL: ${{ secrets.SST_APPS_SCRIPT_URL }}
          SST_SYNC_KEY: ${{ secrets.SST_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SST_APPS_SCRIPT_URL"
          test -n "$SST_SYNC_KEY"
          case "$SST_APPS_SCRIPT_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo 'SST_APPS_SCRIPT_URL inválida'; exit 1 ;;
          esac
          if grep -RniF 'AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ' lib; then
            echo 'Endpoint da Central original encontrado na edição neutra.'
            exit 1
          fi
          sed -i -E 's/^version:.*/version: 1.0.2+3/' pubspec.yaml
          grep -F 'version: 1.0.2+3' pubspec.yaml
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols-neutral/android \
            --dart-define=SST_APPS_SCRIPT_URL="$SST_APPS_SCRIPT_URL" \
            --dart-define=SST_SYNC_KEY="$SST_SYNC_KEY"

      - name: Validar artefato totalmente neutro e base congelada
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/SST_Gestao_Neutro"
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -qi 'assets/branding/auditar' && { echo 'Ativo da marca antiga encontrado no APK'; exit 1; } || true
          python tools/scan_neutral_artifact_v1.py "$APK"
          test -z "$(git status --porcelain -- "$SOURCE_DIR")"
          git diff --exit-code -- "$SOURCE_DIR"
          mkdir -p dist/neutral
          cp "$APK" 'dist/neutral/SST-Gestao-v1.0.2-Android.apk'
          sha256sum 'dist/neutral/SST-Gestao-v1.0.2-Android.apk' > 'dist/neutral/SST-Gestao-v1.0.2-Android.sha256.txt'
          echo 'BASE_AUDITAR_INTACTA_FINAL: nenhuma alteracao na fonte original.'

      - uses: actions/upload-artifact@v4
        with:
          name: SST-Gestao-Neutro-v1.0.2-Android
          path: dist/neutral/*
          retention-days: 30
