name: DIAG v3.29.61 Ronda History Source

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths: ['.github/workflows/diag-v32961-ronda-history-source.yml']

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.60
        run: bash tools/assemble_android_v32960.sh "$APP_DIR"
      - name: Mostrar UI final e fluxo de fechamento
        run: |
          set -euo pipefail
          F="$APP_DIR/lib/screens/express_round_screen.dart"
          echo '=== FINISH 1030-1210 ==='
          sed -n '1030,1210p' "$F"
          echo '=== UI 1210-1660 ==='
          sed -n '1210,1660p' "$F"
          echo '=== COMPANY DETAIL 370-425 ==='
          sed -n '370,425p' "$APP_DIR/lib/screens/company_detail_screen.dart"
          echo '=== COMPANIES 500-545 ==='
          sed -n '500,545p' "$APP_DIR/lib/screens/companies_screen.dart"
