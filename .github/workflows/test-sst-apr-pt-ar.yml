name: Auditar SST - APR PT AR preflight
on:
  push:
    branches:
      - feature/auditar-sst-apr-pt-ar-guiados-20261125
    paths:
      - 'feature_sources/sst_risk_documents_models_v1.dart'
      - 'feature_sources/sst_risk_documents_pdf_v1.dart'
      - 'feature_sources/sst_risk_documents_screen_v1.dart'
      - 'feature_sources/sst_risk_documents_test_v1.dart'
      - 'feature_sources/sst_report_center_screen_v1.dart'
      - 'tools/patch_sst_report_center_v1.py'
      - 'tools/test_sst_apr_pt_ar_v1.py'
      - '.github/workflows/test-sst-apr-pt-ar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar estrutura APR PT AR (sem dados de producao)
        run: python3 tools/test_sst_apr_pt_ar_v1.py
