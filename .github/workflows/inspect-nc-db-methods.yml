name: Inspect NC database methods

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/inspect-nc-db-methods.yml'

permissions:
  contents: read
env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble and print DB NC methods
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          grep -nE "verifyNonConformity|reopenNonConformity|syncNonConformityStatus|getActionsForNonConformity|update.*Action|complete.*Action|upsertAction" "$APP_DIR/lib/database.dart" | head -n 80
          echo '===== snippets ====='
          python - "$APP_DIR/lib/database.dart" <<'PY'
          from pathlib import Path
          import sys
          t=Path(sys.argv[1]).read_text()
          for pat in ['Future<void> verifyNonConformity','Future<void> reopenNonConformity','Future<void> syncNonConformityStatus','Future<List<ActionPlan>> getActionsForNonConformity']:
              i=t.find(pat)
              if i>=0: print('\n###',pat,'\n',t[i:i+4500])
          PY
