name: Export v3.36.1 Full Audit Reference

on:
  workflow_dispatch:
  push:
    branches: [debug/export-v361-layout]
    paths:
      - ".github/workflows/export-v361-full-audit.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.36.1
        run: python3 tools/assemble_v3610.py
      - name: Empacotar referência completa para auditoria
        run: |
          set -euo pipefail
          APP=app/Auditar_SST_v1_5_dashboard
          mkdir -p dist/audit
          cp "$APP/pubspec.yaml" dist/audit/
          cp -r "$APP/lib" dist/audit/lib
          cp -r "$APP/painel_web_google_apps_script" dist/audit/painel_web_google_apps_script
          find dist/audit -type f | sort > dist/audit/FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.36.1-Full-Audit-Reference
          path: dist/audit/**
          retention-days: 2
