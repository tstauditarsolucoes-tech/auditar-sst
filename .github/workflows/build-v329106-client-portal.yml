      - name: Compilar APK com chave permanente verificada
        working-directory: ${{ env.APP_DIR }}
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
          AUDITAR_ANDROID_KEYSTORE_B64: ${{ secrets.AUDITAR_ANDROID_KEYSTORE_B64 }}
          AUDITAR_ANDROID_SIGNER_SHA256: ${{ secrets.AUDITAR_ANDROID_SIGNER_SHA256 }}
          AUDITAR_ANDROID_STORE_PASSWORD: ${{ secrets.AUDITAR_ANDROID_STORE_PASSWORD }}
          AUDITAR_ANDROID_KEY_ALIAS: ${{ secrets.AUDITAR_ANDROID_KEY_ALIAS }}
          AUDITAR_ANDROID_KEY_PASSWORD: ${{ secrets.AUDITAR_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A permanent, independently backed-up key is mandatory. Never generate a
          # new key on a runner or fall back to an ephemeral Android debug signer.
          # A NEW certificate cannot update old installations in place; first
          # complete and verify the per-company records and media migration.
          for secret_name in AUDITAR_SYNC_KEY AUDITAR_ANDROID_KEYSTORE_B64 AUDITAR_ANDROID_STORE_PASSWORD AUDITAR_ANDROID_KEY_ALIAS AUDITAR_ANDROID_KEY_PASSWORD AUDITAR_ANDROID_SIGNER_SHA256; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing $secret_name; no verified permanent signer is configured."
              exit 1
            fi
          done
          export AUDITAR_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/auditar-permanent-release.jks"
          umask 077
          printf '%s' "$AUDITAR_ANDROID_KEYSTORE_B64" | base64 --decode > "$AUDITAR_ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$AUDITAR_ANDROID_KEYSTORE_PATH"' EXIT
          # Pin the certificate of the chosen permanent key in a GitHub secret.
          # Old and new certs are different: migration of local data is required.
          expected_cert="$(printf '%s' "$AUDITAR_ANDROID_SIGNER_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected_cert" =~ ^[0-9A-F]{64}$ ]] || { echo '::error::Invalid signer SHA-256'; exit 1; }
          configured_cert="$(keytool -list -v -keystore "$AUDITAR_ANDROID_KEYSTORE_PATH" -alias "$AUDITAR_ANDROID_KEY_ALIAS" -storepass:env AUDITAR_ANDROID_STORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$configured_cert" != "$expected_cert" ]]; then
            echo '::error::Keystore certificate differs from pinned permanent certificate; release stopped.'
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tools/configure_release_signing_v329122.py" .
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
          apk='build/app/outputs/flutter-apk/app-release.apk'
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          signer="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$signer" && test -n "$aapt"
          "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/auditar-apk-certificate.txt"
          python3 "$GITHUB_WORKSPACE/tools/verify_android_apk_certificate_v329123.py" "$RUNNER_TEMP/auditar-apk-certificate.txt"
          apk_package="$("$aapt" dump badging "$apk" | awk -F "'" '/^package:/{print $2;exit}')"
          if [[ "$apk_package" != 'br.com.auditar.auditar_sst' ]]; then
            echo '::error::Unexpected package ID; not publishing artifact.'
            exit 1
          fi
          echo 'SAFE_ANDROID_SIGNER_VERIFIED: permanent certificate and package ID match. This does not imply compatibility with old signatures.'

      - name: Empacotar
        run: |
          mkdir -p dist
          mkdir -p dist/Central-Painel-Cliente
