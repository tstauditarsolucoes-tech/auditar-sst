name: Diagnostico sessao neutra
on:
  workflow_dispatch:
  push:
    branches: [neutral-sst-separate-edition]
    paths: ['.github/workflows/diag-neutral-session-test.yml']
permissions:
  contents: read
env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/assemble_neutral_android_v1.sh "$APP_DIR"
      - name: Mostrar teste e secure store
        run: |
          echo '=== TEST 120-165 ==='
          nl -ba "$APP_DIR/test/device_sync_roundtrip_test.dart" | sed -n '120,165p'
          echo '=== AUTH SECURE STORE ==='
          nl -ba "$APP_DIR/lib/services/auth_secure_store.dart" | sed -n '1,240p'
