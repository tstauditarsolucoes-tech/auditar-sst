name: Gerar APK Auditar EPI Campo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auditar-epi/**'
      - 'auditar-epi-mobile/**'
      - '.github/workflows/build-epi-android.yml'

concurrency:
  group: auditar-epi-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar interface Campo
        env:
          AUDITAR_EPI_SYNC_KEY: ${{ secrets.AUDITAR_EPI_SYNC_KEY }}
        run: |
          if [ -z "$AUDITAR_EPI_SYNC_KEY" ]; then
            echo "::error::Configure AUDITAR_EPI_SYNC_KEY nos segredos do repositório."
            exit 1
          fi
          rm -rf auditar-epi-mobile/www
          mkdir -p auditar-epi-mobile/www
          cp -R auditar-epi/. auditar-epi-mobile/www/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('auditar-epi-mobile/www')
          key = os.environ['AUDITAR_EPI_SYNC_KEY']
          (root/'compiled-config.js').write_text(
              "try{localStorage.setItem('auditarEpiCentralKey'," + json.dumps(key) + ");}catch(e){}\n",
              encoding='utf-8'
          )
          index = root/'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('<script src="cloud-sync.js"></script>', '<script src="compiled-config.js"></script>\n  <script src="cloud-sync.js"></script>')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Instalar Capacitor
        working-directory: auditar-epi-mobile
        run: npm install

      - name: Criar projeto Android
        working-directory: auditar-epi-mobile
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          feature = '<uses-feature android:name="android.hardware.camera.front" android:required="false" />'
          if permission not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission + '\n    ' + feature,
                  text,
                  count=1
              )
          manifest.write_text(text, encoding='utf-8')

          java_dir = Path('android/app/src/main/java/br/com/auditar/epi')
          java_dir.mkdir(parents=True, exist_ok=True)

          (java_dir/'ScreenOrientationPlugin.java').write_text(r'''package br.com.auditar.epi;

          import android.content.pm.ActivityInfo;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ScreenOrientation")
          public class ScreenOrientationPlugin extends Plugin {
              @PluginMethod
              public void lock(PluginCall call) {
                  String orientation = call.getString("orientation", "portrait");
                  final int requested;
                  if (orientation.startsWith("landscape")) {
                      requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE;
                  } else if (orientation.startsWith("portrait")) {
                      requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT;
                  } else {
                      requested = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;
                  }
                  getActivity().runOnUiThread(() -> {
                      getActivity().setRequestedOrientation(requested);
                      call.resolve();
                  });
              }

              @PluginMethod
              public void unlock(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      getActivity().setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                      call.resolve();
                  });
              }
          }
          ''', encoding='utf-8')

          (java_dir/'MainActivity.java').write_text(r'''package br.com.auditar.epi;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ScreenOrientationPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''', encoding='utf-8')
          PY

      - name: Compilar APK
        working-directory: auditar-epi-mobile/android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp auditar-epi-mobile/android/app/build/outputs/apk/debug/app-debug.apk Auditar-EPI-Campo.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Auditar-EPI-Campo-APK
          path: Auditar-EPI-Campo.apk
          if-no-files-found: error
          retention-days: 14