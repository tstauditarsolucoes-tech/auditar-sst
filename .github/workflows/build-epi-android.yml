name: Gerar APK Gestão EPI Campo

on:
  workflow_dispatch:
  push:
    branches: [main, feature/gestao-epi-biometria-evidencia-v281, feature/gestao-epi-worker-portal-v290, feature/gestao-epi-ux-v300]
    paths:
      - 'auditar-epi/**'
      - 'auditar-epi-mobile/**'
      - 'backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt'
      - 'backend/PortalTrabalhador.html'
      - '.github/workflows/build-epi-android.yml'

concurrency:
  group: gestao-epi-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar interface Campo
        run: |
          rm -rf auditar-epi-mobile/www
          mkdir -p auditar-epi-mobile/www
          cp -R auditar-epi/. auditar-epi-mobile/www/

      - name: Instalar Capacitor
        working-directory: auditar-epi-mobile
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        working-directory: auditar-epi-mobile
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          feature = '<uses-feature android:name="android.hardware.camera.front" android:required="false" />'
          if permission not in text:
              text = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission + '\n    ' + feature, text, count=1)

          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_gestao_epi"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ic_gestao_epi"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          drawable = Path('android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable/'ic_gestao_epi.xml').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#F7FBFA" android:pathData="M0,0H512V512H0Z"/>
              <path android:fillColor="#078468" android:pathData="M256,38 L424,121 L424,251 C424,362 360,434 256,474 C152,434 88,362 88,251 L88,121 Z"/>
              <path android:fillColor="#0B4F59" android:pathData="M256,38 L424,121 L424,251 C424,362 360,434 256,474 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M138,235 C145,165 186,116 239,100 L239,76 L273,76 L273,100 C326,116 367,165 374,235 L385,235 C394,235 401,242 401,251 C401,260 394,267 385,267 L127,267 C118,267 111,260 111,251 C111,242 118,235 127,235 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M224,119 C224,110 231,103 240,103 L272,103 C281,103 288,110 288,119 L288,191 L224,191 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M132,293 L215,374 L380,217 L410,249 L215,437 L102,327 Z"/>
          </vector>
          ''', encoding='utf-8')

          java_dir = Path('android/app/src/main/java/br/com/gestao/epi')
          java_dir.mkdir(parents=True, exist_ok=True)

          (java_dir/'ScreenOrientationPlugin.java').write_text(r'''package br.com.gestao.epi;

          import android.content.pm.ActivityInfo;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ScreenOrientation")
          public class ScreenOrientationPlugin extends Plugin {
              @PluginMethod
              public void lock(PluginCall call) {
                  String orientation = call.getString("orientation", "portrait");
                  final int requested;
                  if (orientation.startsWith("landscape")) requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE;
                  else if (orientation.startsWith("portrait")) requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT;
                  else requested = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;
                  getActivity().runOnUiThread(() -> { getActivity().setRequestedOrientation(requested); call.resolve(); });
              }
              @PluginMethod
              public void unlock(PluginCall call) {
                  getActivity().runOnUiThread(() -> { getActivity().setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); call.resolve(); });
              }
          }
          ''', encoding='utf-8')

          (java_dir/'MainActivity.java').write_text(r'''package br.com.gestao.epi;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ScreenOrientationPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''', encoding='utf-8')
          PY

      - name: Conferir módulos novos
        working-directory: auditar-epi-mobile/www
        run: |
          node --check holdings-replacements.js
          node --check return-epi.js
          node --check cloud-sync.js
          node --check biometric-crypto-v1.js
          node --check biometric-face.js
          node --check liveness-face.js
          node --check worker-portal-share-v1.js
          node --check ux-v300.js

      - name: Validar Portal do Trabalhador
        run: |
          cp backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt /tmp/gestao-epi-portal.js
          node --check /tmp/gestao-epi-portal.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('backend/PortalTrabalhador.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          if not m:
              raise SystemExit('JavaScript do Portal não encontrado.')
          Path('/tmp/portal-html.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/portal-html.js

      - name: Compilar APK
        working-directory: auditar-epi-mobile/android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp auditar-epi-mobile/android/app/build/outputs/apk/debug/app-debug.apk Gestao-EPI-Campo-v3.0.0-PRO.apk

      - name: Publicar APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gestao-epi-campo-v3.0.0
          name: Gestão EPI Campo v3.0.0
          body: |
            Gestão EPI Campo v3.0 com nova identidade profissional e fluxo de uso simplificado.
            Inclui Entrega Rápida, Trabalhador 360°, busca global, kits por função, favoritos/recentes, QR do trabalhador, troca inteligente, status online/offline e confirmação final mais clara.
            Mantidas assinatura, biometria, estoque, CA, Portal do Trabalhador, operação offline, histórico, sincronização e demais funções já validadas.
          files: Gestao-EPI-Campo-v3.0.0-PRO.apk
          make_latest: false
          overwrite_files: true

      - name: Disponibilizar Portal do Trabalhador
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Portal-Trabalhador-v4.4.0
          path: |
            backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt
            backend/PortalTrabalhador.html
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Campo-v3.0.0-PRO
          path: Gestao-EPI-Campo-v3.0.0-PRO.apk
          if-no-files-found: error
          retention-days: 14
