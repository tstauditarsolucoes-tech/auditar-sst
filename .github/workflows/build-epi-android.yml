name: Gerar APK Gestão EPI Campo

on:
  workflow_dispatch:
  push:
    branches: [main, feature/gestao-epi-biometria-evidencia-v281, feature/gestao-epi-worker-portal-v290, feature/gestao-epi-brand-login-v300, feature/gestao-epi-android-cache-hotfix-v301, feature/gestao-epi-login-refine-v302, feature/gestao-epi-quality-v310, feature/gestao-epi-legal-v320, feature/gestao-epi-android-freeze-hotfix-v321, feature/gestao-epi-android-freeze-hotfix-v322, feature/gestao-epi-android-more-hotfix-v324, feature/gestao-epi-android-invoice-import-v325, feature/gestao-epi-ca-validity-v326, feature/gestao-epi-ca-sheet-v327, feature/gestao-epi-fichas-completas-v328, feature/gestao-epi-fichas-resumidas-v329, feature/gestao-epi-central-ca-v330, feature/gestao-epi-nf-refino-v331]
    paths:
      - 'auditar-epi/**'
      - 'auditar-epi-mobile/**'
      - 'backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt'
      - 'backend/PortalTrabalhador.html'
      - '.github/workflows/build-epi-android.yml'

concurrency:
  group: gestao-epi-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar interface Campo
        run: |
          rm -rf auditar-epi-mobile/www
          mkdir -p auditar-epi-mobile/www
          cp -R auditar-epi/. auditar-epi-mobile/www/

      - name: Instalar Capacitor
        working-directory: auditar-epi-mobile
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        working-directory: auditar-epi-mobile
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          feature = '<uses-feature android:name="android.hardware.camera.front" android:required="false" />'
          if permission not in text:
              text = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission + '\n    ' + feature, text, count=1)

          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_gestao_epi"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ic_gestao_epi"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          gradle_text = gradle.read_text(encoding='utf-8')
          gradle_text = re.sub(r'versionCode\s+\d+', 'versionCode 331', gradle_text, count=1)
          gradle_text = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "3.3.1"', gradle_text, count=1)
          gradle.write_text(gradle_text, encoding='utf-8')

          drawable = Path('android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable/'ic_gestao_epi.xml').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#063C43" android:pathData="M0,0H512V512H0Z"/>
              <path android:fillColor="#0BC58E" android:pathData="M256,58 L406,132 L406,255 C406,345 350,410 256,457 C162,410 106,345 106,255 L106,132 Z"/>
              <path android:fillColor="#075C56" android:pathData="M256,58 L406,132 L406,255 C406,345 350,410 256,457 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M164,225 C170,177 198,146 244,132 L244,109 H286 L286,132 C332,146 360,177 366,225 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M162,221 H368 A14,14 0,0 1,382 235 A14,14 0,0 1,368 249 H162 A14,14 0,0 1,148 235 A14,14 0,0 1,162 221 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M137,294 L220,377 L383,218 L412,247 L220,436 L108,324 Z"/>
          </vector>
          ''', encoding='utf-8')

          java_dir = Path('android/app/src/main/java/br/com/gestao/epi')
          java_dir.mkdir(parents=True, exist_ok=True)

          (java_dir/'ScreenOrientationPlugin.java').write_text(r'''package br.com.gestao.epi;

          import android.content.pm.ActivityInfo;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ScreenOrientation")
          public class ScreenOrientationPlugin extends Plugin {
              @PluginMethod
              public void lock(PluginCall call) {
                  String orientation = call.getString("orientation", "portrait");
                  final int requested;
                  if (orientation.startsWith("landscape")) requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE;
                  else if (orientation.startsWith("portrait")) requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT;
                  else requested = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;
                  getActivity().runOnUiThread(() -> { getActivity().setRequestedOrientation(requested); call.resolve(); });
              }
              @PluginMethod
              public void unlock(PluginCall call) {
                  getActivity().runOnUiThread(() -> { getActivity().setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); call.resolve(); });
              }
          }
          ''', encoding='utf-8')

          (java_dir/'MainActivity.java').write_text(r'''package br.com.gestao.epi;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ScreenOrientationPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''', encoding='utf-8')
          PY

      - name: Conferir módulos novos
        working-directory: auditar-epi-mobile/www
        run: |
          node --check holdings-replacements.js
          node --check return-epi.js
          node --check cloud-sync.js
          node --check biometric-crypto-v1.js
          node --check biometric-face.js
          node --check liveness-face.js
          node --check worker-portal-share-v1.js
          node --check brand-login-v300.js
          node --check ux-v300.js
          node --check quality-v310.js
          node --check legal-evidence-v320.js
          node --check company-branding.js
          grep -q "logoSig" company-branding.js
          node --check more-shortcut-v323.js
          grep -q "Mais funções" more-shortcut-v323.js
          grep -q "Devoluções" more-shortcut-v323.js
          grep -q "Alertas" more-shortcut-v323.js
          node --check invoice-epi-ai-v350.js
          node --check mobile-general-report-v330.js
          node --check smart-management-v350.js
          node --check quick-epi-v325.js
          node --check ca-validity-display-v326.js
          grep -q "Importar EPI pela Nota Fiscal com IA" invoice-epi-ai-v350.js
          grep -q "Relatório geral de EPI" mobile-general-report-v330.js
          grep -q "Gestão inteligente de EPI" smart-management-v350.js
          grep -q "Cadastrar EPI" quick-epi-v325.js
          grep -q "Validade do CA" invoice-epi-ai-v350.js
          grep -q "Validade CA" ca-validity-display-v326.js
          grep -q "Ficha de CA dos EPIs" smart-management-v350.js
          grep -q "Validade CA" smart-management-v350.js
          grep -q "Fabricante / Modelo" smart-management-v350.js
          grep -q "Próxima troca" smart-management-v350.js
          grep -q "CA consultado em" smart-management-v350.js
          grep -q "Em posse:" smart-management-v350.js
          grep -q "ITEM DA NOTA / EPI IDENTIFICADO" invoice-epi-ai-v350.js
          grep -q "CADASTRO QUE SERÁ USADO + QUANTIDADE" invoice-epi-ai-v350.js
          grep -q "Saldo:" invoice-epi-ai-v350.js
          grep -q "invoiceIdentity" invoice-epi-ai-v350.js
          grep -q "digits(c.ca)!==digits(item.ca)" invoice-epi-ai-v350.js
          node --check ca-center-v330.js
          grep -q "Central de CA" ca-center-v330.js
          grep -q "Atualizar CAs" ca-center-v330.js
          grep -q "Alertas de CA" ca-center-v330.js
          grep -q "Sem validade" ca-center-v330.js
          ! grep -q "MutationObserver" ca-center-v330.js
          ! grep -q "MutationObserver" invoice-epi-ai-v350.js
          ! grep -q "MutationObserver" mobile-general-report-v330.js
          ! grep -q "MutationObserver" smart-management-v350.js
          ! grep -q "MutationObserver" quick-epi-v325.js
          ! grep -q "MutationObserver" ca-validity-display-v326.js
          node --check sw.js
          grep -q "gestao-epi-v322-shell" sw.js
          grep -q "brand-login-v300.js" sw.js
          grep -q "ux-v300.js" sw.js
          grep -q "biometric-crypto-v1.js" sw.js
          grep -q "worker-portal-share-v1.js" sw.js
          grep -q "quality-v310.js" sw.js
          grep -q "legal-evidence-v320.js" sw.js

      - name: Validar Portal do Trabalhador
        run: |
          cp backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt /tmp/gestao-epi-portal.js
          node --check /tmp/gestao-epi-portal.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('backend/PortalTrabalhador.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          if not m:
              raise SystemExit('JavaScript do Portal não encontrado.')
          Path('/tmp/portal-html.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/portal-html.js

      - name: Compilar APK
        working-directory: auditar-epi-mobile/android
        run: ./gradlew assembleDebug

      - name: Validar conteúdo real do APK
        run: |
          APK='auditar-epi-mobile/android/app/build/outputs/apk/debug/app-debug.apk'
          unzip -p "$APK" assets/public/company-branding.js | grep -q "logoSig"
          unzip -p "$APK" assets/public/index.html | grep -q "more-shortcut-v323.js"
          unzip -p "$APK" assets/public/more-shortcut-v323.js | grep -q "Mais funções"
          unzip -p "$APK" assets/public/more-shortcut-v323.js | grep -q "Devoluções"
          unzip -p "$APK" assets/public/more-shortcut-v323.js | grep -q "Alertas"
          unzip -p "$APK" assets/public/index.html | grep -q "invoice-epi-ai-v350.js"
          unzip -p "$APK" assets/public/index.html | grep -q "mobile-general-report-v330.js"
          unzip -p "$APK" assets/public/index.html | grep -q "smart-management-v350.js"
          unzip -p "$APK" assets/public/index.html | grep -q "quick-epi-v325.js"
          unzip -p "$APK" assets/public/invoice-epi-ai-v350.js | grep -q "Importar EPI pela Nota Fiscal com IA"
          unzip -p "$APK" assets/public/mobile-general-report-v330.js | grep -q "Relatório geral de EPI"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "Gestão inteligente de EPI"
          unzip -p "$APK" assets/public/quick-epi-v325.js | grep -q "Cadastrar EPI"
          unzip -p "$APK" assets/public/index.html | grep -q "ca-validity-display-v326.js"
          unzip -p "$APK" assets/public/invoice-epi-ai-v350.js | grep -q "Validade do CA"
          unzip -p "$APK" assets/public/ca-validity-display-v326.js | grep -q "Validade CA"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "Ficha de CA dos EPIs"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "Validade CA"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "Fabricante / Modelo"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "Próxima troca"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "CA consultado em"
          unzip -p "$APK" assets/public/smart-management-v350.js | grep -q "Em posse:"
          unzip -p "$APK" assets/public/invoice-epi-ai-v350.js | grep -q "ITEM DA NOTA / EPI IDENTIFICADO"
          unzip -p "$APK" assets/public/invoice-epi-ai-v350.js | grep -q "CADASTRO QUE SERÁ USADO + QUANTIDADE"
          unzip -p "$APK" assets/public/invoice-epi-ai-v350.js | grep -q "invoiceIdentity"
          unzip -p "$APK" assets/public/index.html | grep -q "ca-center-v330.js"
          unzip -p "$APK" assets/public/ca-center-v330.js | grep -q "Central de CA"
          unzip -p "$APK" assets/public/ca-center-v330.js | grep -q "Atualizar CAs"
          unzip -p "$APK" assets/public/ca-center-v330.js | grep -q "Alertas de CA"

      - name: Renomear APK
        run: cp auditar-epi-mobile/android/app/build/outputs/apk/debug/app-debug.apk Gestao-EPI-Campo-v3.3.1-NF-REFINADA.apk

      - name: Publicar APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gestao-epi-campo-v3.3.1
          name: Gestão EPI Campo v3.3.1
          body: |
            Gestão EPI Campo v3.3.1 mantém a linha HOTFIX-OBSERVER e o layout atual, refinando somente a conferência da Nota Fiscal antes do lançamento no estoque.
            Inclui EPIs em posse por trabalhador, controle de trocas por vencimento, desgaste, dano, perda e necessidade operacional, além da devolução com opção de retorno ao estoque.
            Mantidas assinatura em tela, reconhecimento facial, operação offline, sincronização, estoque, histórico e Portal do Trabalhador. As melhorias de interface são aditivas e não alteram o núcleo de sincronização.
          files: Gestao-EPI-Campo-v3.3.1-NF-REFINADA.apk
          make_latest: false
          overwrite_files: true

      - name: Disponibilizar Portal do Trabalhador
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Portal-Trabalhador-v4.4.0
          path: |
            backend/Code-Gestao-EPI-v4.4.0-PORTAL-TRABALHADOR.txt
            backend/PortalTrabalhador.html
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Campo-v3.3.1-NF-REFINADA
          path: Gestao-EPI-Campo-v3.3.1-NF-REFINADA.apk
          if-no-files-found: error
          retention-days: 14
