name: Gerar APK Gestão EPI Campo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auditar-epi/**'
      - 'auditar-epi-mobile/**'
      - '.github/workflows/build-epi-android.yml'

concurrency:
  group: gestao-epi-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar interface Campo
        run: |
          rm -rf auditar-epi-mobile/www
          mkdir -p auditar-epi-mobile/www
          cp -R auditar-epi/. auditar-epi-mobile/www/

      - name: Instalar Capacitor
        working-directory: auditar-epi-mobile
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        working-directory: auditar-epi-mobile
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          feature = '<uses-feature android:name="android.hardware.camera.front" android:required="false" />'
          if permission not in text:
              text = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission + '\n    ' + feature, text, count=1)

          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_gestao_epi"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ic_gestao_epi"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          drawable = Path('android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable/'ic_gestao_epi.xml').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#F8FBFA" android:pathData="M0,0H512V512H0Z"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#083B68" android:strokeWidth="30" android:strokeLineJoin="round" android:pathData="M256,52 L90,136 L90,264 C90,367 152,438 256,482"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#08B887" android:strokeWidth="30" android:strokeLineJoin="round" android:pathData="M256,52 L422,136 L422,264 C422,367 360,438 256,482"/>
              <path android:fillColor="#083B68" android:pathData="M162,231 C167,187 193,155 235,142 L235,121 L277,121 L277,142 C319,155 345,187 350,231 Z"/>
              <path android:fillColor="#083B68" android:pathData="M164,225 H348 A14,14 0,0 1,362 239 A14,14 0,0 1,348 253 H164 A14,14 0,0 1,150 239 A14,14 0,0 1,164 225 Z"/>
              <path android:fillColor="#083B68" android:pathData="M303,289 A47,47 0,1 1,209,289 A47,47 0,1 1,303,289"/>
              <path android:fillColor="#083B68" android:pathData="M150,415 C161,354 197,319 256,319 C315,319 351,354 362,415 L349,446 L163,446 Z"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#08B887" android:strokeWidth="31" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M188,379 L233,424 L327,324"/>
          </vector>
          ''', encoding='utf-8')

          java_dir = Path('android/app/src/main/java/br/com/gestao/epi')
          java_dir.mkdir(parents=True, exist_ok=True)

          (java_dir/'ScreenOrientationPlugin.java').write_text(r'''package br.com.gestao.epi;

          import android.content.pm.ActivityInfo;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ScreenOrientation")
          public class ScreenOrientationPlugin extends Plugin {
              @PluginMethod
              public void lock(PluginCall call) {
                  String orientation = call.getString("orientation", "portrait");
                  final int requested;
                  if (orientation.startsWith("landscape")) requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE;
                  else if (orientation.startsWith("portrait")) requested = ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT;
                  else requested = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;
                  getActivity().runOnUiThread(() -> { getActivity().setRequestedOrientation(requested); call.resolve(); });
              }
              @PluginMethod
              public void unlock(PluginCall call) {
                  getActivity().runOnUiThread(() -> { getActivity().setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); call.resolve(); });
              }
          }
          ''', encoding='utf-8')

          (java_dir/'MainActivity.java').write_text(r'''package br.com.gestao.epi;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ScreenOrientationPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''', encoding='utf-8')
          PY

      - name: Compilar APK
        working-directory: auditar-epi-mobile/android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp auditar-epi-mobile/android/app/build/outputs/apk/debug/app-debug.apk Gestao-EPI-Campo.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-EPI-Campo-APK-NOVA-LOGO
          path: Gestao-EPI-Campo.apk
          if-no-files-found: error
          retention-days: 14
