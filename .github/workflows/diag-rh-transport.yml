name: Diagnostico Transporte RH

on:
  workflow_dispatch:
  push:
    branches: [feature-report-templates-v32962]
    paths: ['.github/workflows/diag-rh-transport.yml']

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/assemble_android_v32962.sh "$APP_DIR" >/dev/null
      - run: |
          echo "===== worker import catch ====="
          sed -n '120,230p' "$APP_DIR/lib/services/worker_import_service.dart"
          echo "===== apps script transport ====="
          sed -n '1,300p' "$APP_DIR/lib/services/apps_script_http.dart"
