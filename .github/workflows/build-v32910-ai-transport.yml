name: Auditar SST v3.29.10 IA Transport

on:
  workflow_dispatch:
  push:
    branches: [feature/v3.29.10]
    paths:
      - ".github/workflows/build-v32910-ai-transport.yml"
      - "tools/assemble_v32910.py"
      - "tools/patch_ai_transport_v32910.py"

permissions:
  contents: read

jobs:
  android:
    name: Android v3.29.10
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.10
        run: python3 tools/assemble_v32910.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          for perm in ('<uses-permission android:name="android.permission.CAMERA" />','<uses-permission android:name="android.permission.INTERNET" />'):
              if perm not in text:
                  text=text.replace('<application',perm+'\n    <application',1)
          manifest.write_text(text)
          PY
          flutter pub get
      - name: Analisar e testar
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          dart format lib
          grep -Fq 'version: 3.29.10+153' pubspec.yaml
          grep -Fq 'const maxAttempts = 2;' lib/services/ai_assistant_service.dart
          grep -Fq 'página temporária do Google' lib/services/ai_assistant_service.dart
          grep -Fq 'on TimeoutException' lib/services/ai_assistant_service.dart
          grep -Fq "'mode': 'report_review_chat'" lib/services/ai_assistant_service.dart
          grep -Fq 'Revisor crítico: analisar e conversar' lib/screens/report_screen.dart
          grep -Fq 'Gerar plano de ação com IA' lib/screens/report_screen.dart
          grep -Fq 'Evidência principal' lib/services/pdf_service.dart
          grep -Fq 'Enviar relatório semanal' lib/screens/companies_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar APK
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY" || (echo 'AUDITAR_SYNC_KEY ausente' && exit 1)
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Empacotar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.10.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.10-Android
          path: dist/android/*
          retention-days: 30

  windows:
    name: Windows v3.29.10
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Montar fonte v3.29.10
        run: python tools/assemble_v32910.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar, analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          $pub = Get-Content pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.10+153')) { throw 'versão incorreta' }
          $ai = Get-Content lib/services/ai_assistant_service.dart -Raw
          if (-not $ai.Contains('const maxAttempts = 2;')) { throw 'retry IA ausente' }
          if (-not $ai.Contains('página temporária do Google')) { throw 'tratamento HTML ausente' }
          if (-not $ai.Contains("'mode': 'report_review_chat'")) { throw 'IA crítica perdida' }
          $report = Get-Content lib/screens/report_screen.dart -Raw
          if (-not $report.Contains('Revisor crítico: analisar e conversar')) { throw 'revisor crítico perdido' }
          if (-not $report.Contains('Gerar plano de ação com IA')) { throw 'plano IA perdido' }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compilar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar instalador e portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release/*' 'dist/windows/Auditar-SST-Windows-v3.29.10-PORTATIL.zip' -Force
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppName=Auditar SST
          AppVersion=3.29.10
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.10
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:RUNNER_TEMP\auditar.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.10-Windows
          path: dist/windows/*
          retention-days: 30
