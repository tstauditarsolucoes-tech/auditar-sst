name: Auditar SST Android v3.29.57 Sync Priority

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/build-v32957-android-sync-priority.yml"
      - "tools/patch_sync_priority_v32957.py"

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Montar base Android v3.29.54
        shell: bash
        run: |
          set -euo pipefail
          python tools/assemble_sync_response_fix.py android
          python tools/patch_sync_queue_android_v32940_v2.py "$APP_DIR"
          python tools/patch_android_transport_guard_v32941.py "$APP_DIR"
          python tools/patch_android_dns_bypass_v32942.py "$APP_DIR"
          python tools/patch_android_dns_bypass_compile_fix.py "$APP_DIR"
          python tools/patch_android_offline_background_sync_v32943.py "$APP_DIR"
          python tools/patch_android_offline_compile_fix_v32943.py "$APP_DIR"
          python tools/patch_android_sync_immediate_v32944.py "$APP_DIR"
          python tools/patch_android_sync_first_pull_v32945.py "$APP_DIR"
          python tools/patch_android_sync_core_v32946.py "$APP_DIR"
          python tools/patch_dds_digital_signature_v32947.py "$APP_DIR"
          python tools/patch_dds_formal_pdf_v32948.py "$APP_DIR"
          python tools/patch_dds_formal_pdf_compile_fix_v32948.py "$APP_DIR"
          python tools/patch_android_transport_ipv4_redirect_v32949.py "$APP_DIR"
          python - <<'PY'
          from pathlib import Path
          root=Path('app/Auditar_SST_v1_5_dashboard')
          pub=root/'pubspec.yaml'; coord=root/'lib/services/sync_coordinator.dart'
          p=pub.read_text(encoding='utf-8'); c=coord.read_text(encoding='utf-8')
          p=p.replace('version: 3.29.49+191','version: 3.29.50+192',1)
          c=c.replace("const Duration(seconds: 10),\n      (_) => _trySync(deviceOnly: true, force: true),","const Duration(seconds: 2),\n      (_) => _trySync(deviceOnly: true, force: true),",1)
          c=c.replace("const Duration(seconds: 30),\n      (_) {\n        _trySync(deviceOnly: true, force: true, pullWhenClean: true);\n        _tryAutoBackup();\n      },","const Duration(seconds: 10),\n      (_) {\n        _trySync(deviceOnly: true, force: true, pullWhenClean: true);\n      },",1)
          pub.write_text(p,encoding='utf-8'); coord.write_text(c,encoding='utf-8')
          PY
          python tools/patch_android_sync_latency_refresh_v32951.py "$APP_DIR"
          python tools/patch_dds_sector_optional_v32952.py "$APP_DIR"
          python tools/patch_dds_history_media_retry_v32953.py "$APP_DIR"
          python tools/patch_company_logo_persistence_v32954_v3303.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/Auditar_SST_v1_5_dashboard/lib/screens/companies_screen.dart')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'^\s*syncMedia:\s*false,\s*$', '', s, flags=re.M)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Aplicar Ronda Expressa v3.29.55
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          src=Path('build_sources/v3.29.55-ronda-ia-conformidade/patch_express_round_ai_conformity_v32955_v3304.py.xz.b64')
          out=Path('/tmp/patch_ronda.py')
          out.write_bytes(lzma.decompress(base64.b64decode(src.read_text().strip())))
          PY
          python /tmp/patch_ronda.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          r=Path('app/Auditar_SST_v1_5_dashboard/lib/screens/express_round_screen.dart')
          s=r.read_text(encoding='utf-8')
          s=s.replace('    final context = <String>[','    final technicianContext = <String>[',1)
          s=s.replace('      technicianContext: context,','      technicianContext: technicianContext,',1)
          r.write_text(s,encoding='utf-8')
          p=Path('app/Auditar_SST_v1_5_dashboard/lib/services/express_round_pdf_service.dart')
          x=p.read_text(encoding='utf-8')
          x=x.replace('company.cnpj.trim().isNotEmpty', "(company.cnpj ?? '').trim().isNotEmpty")
          x=x.replace("_tableRow('CNPJ', company.cnpj)", "_tableRow('CNPJ', company.cnpj ?? '')")
          p.write_text(x,encoding='utf-8')
          PY

      - name: Aplicar conclusão IA v3.29.56
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_ronda_ai_final_conclusion_v32956.py "$APP_DIR"

      - name: Priorizar sincronização v3.29.57
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_sync_priority_v32957.py "$APP_DIR"
          grep -q 'version: 3.29.57+199' "$APP_DIR/pubspec.yaml"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Analisar e testar
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib/screens/companies_screen.dart lib/screens/express_round_screen.dart lib/services/sync_coordinator.dart lib/services/device_sync_service.dart lib/services/media_sync_service.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi

      - name: Regressão prioridade sync
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pub=Path('pubspec.yaml').read_text(encoding='utf-8')
          coord=Path('lib/services/sync_coordinator.dart').read_text(encoding='utf-8')
          dev=Path('lib/services/device_sync_service.dart').read_text(encoding='utf-8')
          comp=Path('lib/screens/companies_screen.dart').read_text(encoding='utf-8')
          ronda=Path('lib/screens/express_round_screen.dart').read_text(encoding='utf-8')
          media=Path('lib/services/media_sync_service.dart').read_text(encoding='utf-8')
          assert 'version: 3.29.57+199' in pub
          assert 'Duration(seconds: 2)' in coord
          assert 'Duration(seconds: 10)' in coord
          assert 'limit: 500' in dev or 'pullLimit = 500' in dev or 'pullLimit: 500' in dev
          assert 'await ManagementPanelService.syncCompany(widget.company)' not in ronda
          assert 'Conclusão geral da ronda' in ronda
          assert 'Duration(seconds: 15)' in comp and 'missing.take(1)' in comp
          pos=comp.find('MediaSyncService.uploadCompanyLogoNow(company.id)')
          assert pos >= 0
          assert 'DeviceSyncService.synchronize' not in comp[pos:pos+700]
          assert '_postReliable(' in media
          print('REGRESSAO_OK: sync 2s/10s priorizado; Ronda e logos fora do caminho crítico')
          PY

      - name: Testar Central real sem escrita
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDITAR_SYNC_KEY:-}"
          mkdir -p tool
          cat > tool/live_pull.dart <<'DART'
          import 'dart:convert';
          import '../lib/services/apps_script_http.dart';
          const endpoint='https://script.google.com/macros/s/AKfycbxNG-wU-jZMKMR2cb1nR9OUd31GSUpGM0FIEagZEUP7sAHxkahLDuJ6T3wZvEe9rm6WrQ/exec';
          const key=String.fromEnvironment('AUDITAR_SYNC_KEY');
          Future<void> main() async {
            AppsScriptHttp.forceAndroidDirectForTesting=true;
            final r=await AppsScriptHttp.postJson(Uri.parse(endpoint),{
              'action':'device_sync_pull','syncKey':key,'deviceId':'v32957-readonly','platform':'android','sinceVersion':0,'limit':1,
            },timeout:const Duration(seconds:30));
            if(r.statusCode!=200) throw StateError('HTTP ${r.statusCode}');
            final x=jsonDecode(utf8.decode(r.bodyBytes,allowMalformed:true));
            if(x is! Map || x['ok']!=true) throw StateError('Central inesperada: $x');
            print('CENTRAL_REAL_OK');
          }
          DART
          dart run --define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY" tool/live_pull.dart

      - name: Compilar APK release
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDITAR_SYNC_KEY:-}"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" "dist/android/Auditar-SST-v3.29.57-SYNC-PRIORITY.apk"
          sha256sum "dist/android/Auditar-SST-v3.29.57-SYNC-PRIORITY.apk" > "dist/android/Auditar-SST-v3.29.57-SYNC-PRIORITY.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.57-Android-Sync-Priority
          path: dist/android/*
          retention-days: 30
