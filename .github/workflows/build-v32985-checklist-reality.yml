name: Auditar SST Android v3.29.85 Revisao Checklists

on:
  push:
    branches: [feature-report-templates-v32962]
    paths:
      - '.github/workflows/build-v32985-checklist-reality.yml'
      - 'tools/patch_checklist_reality_v32985.py'

permissions:
  contents: read

env:
  APP_DIR: app/Auditar_SST_v1_5_dashboard
  PUB_CACHE: /tmp/auditar-pub-v32985

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Montar Android atual v3.29.84
        run: |
          set -euo pipefail
          bash tools/assemble_android_v32966.sh "$APP_DIR"
          python tools/patch_logo_extinguisher_media_v32967.py "$APP_DIR"
          python tools/patch_training_records_media_v32968_v3306.py "$APP_DIR" android
          python tools/patch_internal_management_training_v32969_v3307.py "$APP_DIR" android
          python tools/patch_management_panel_logo_theme_v32970_v3308.py "$APP_DIR" android
          python - <<'PY'
          from pathlib import Path
          import base64,lzma
          for src,out in [
            ('build_sources/v3.29.71-nc-quick-resolve/patch_nc_quick_resolve_v32971.py.xz.b64','/tmp/p71.py'),
            ('build_sources/v3.29.74-training-photo/patch_training_import_photo_v32974.py.xz.b64','/tmp/p74.py'),
            ('build_sources/v3.29.77-checklist-fine-face/patch_checklist_fine_face_v32977.py.xz.b64','/tmp/p77.py'),
          ]:
            Path(out).write_bytes(lzma.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY
          python /tmp/p71.py "$APP_DIR"
          python tools/patch_login_resilience_v32972.py "$APP_DIR"
          python tools/patch_training_bulk_import_v32973.py "$APP_DIR"
          python /tmp/p74.py "$APP_DIR"
          python tools/patch_training_import_robust_v32975.py "$APP_DIR"
          python tools/patch_cipa_management_v32976.py "$APP_DIR"
          python /tmp/p77.py "$APP_DIR"
          python tools/patch_refine_new_features_v32978.py "$APP_DIR"
          python tools/patch_refine_new_features_v32979.py "$APP_DIR"
          python tools/patch_performance_report_v32980.py "$APP_DIR"
          python tools/patch_cross_platform_refinement_v32981.py "$APP_DIR" android
          python tools/patch_signature_handoff_v32982.py "$APP_DIR" android
          python tools/patch_pre_admission_search_v32983.py "$APP_DIR" android
          python tools/patch_deferred_inspection_ai_v32984.py "$APP_DIR" android

      - name: Proteger sincronizacao e banco
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1])
          files=[
            'lib/services/device_sync_service.dart',
            'lib/services/media_sync_service.dart',
            'lib/services/apps_script_http.dart',
            'lib/services/sync_coordinator.dart',
            'lib/services/auth_service.dart',
            'lib/services/drive_service.dart',
            'lib/database.dart',
          ]
          Path('/tmp/v32985_protected.json').write_text(
            json.dumps({f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files})
          )
          PY

      - name: Aplicar revisao dos checklists
        run: |
          python tools/patch_checklist_reality_v32985.py "$APP_DIR" android

      - name: Confirmar sincronizacao intacta
        run: |
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1])
          old=json.loads(Path('/tmp/v32985_protected.json').read_text())
          changed=[
            f for f,h in old.items()
            if hashlib.sha256((root/f).read_bytes()).hexdigest()!=h
          ]
          if changed:
            raise SystemExit('SYNC/BANCO ALTERADO: '+', '.join(changed))
          print('SYNC_ANDROID_V32985_INTACTO_OK')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          python ../../tools/fix_read_pdf_text_r8_v32965.py .
          python ../../tools/fix_mlkit_text_r8_v32974.py .

      - name: Formatar analisar e testar
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Regressoes gerais e de checklist
        run: |
          set -euo pipefail
          python tools/regression_report_templates_v32962.py "$APP_DIR" 3.29.85+227
          python tools/regression_training_records_v32968_v3306.py "$APP_DIR" 3.29.85+227
          python tools/regression_internal_management_training_v32969_v3307.py "$APP_DIR" 3.29.85+227
          grep -q 'ASSINANDO AGORA' "$APP_DIR/lib/screens/training_records_screen.dart"
          grep -q 'PRE_ADMISSION_PARTICIPANT' "$APP_DIR/lib/services/pre_admission_participant_service.dart"
          grep -q 'panSpecificMachineIds' "$APP_DIR/lib/screens/new_inspection_screen.dart"
          grep -q 'Máquina de Panificação - Vistoria Genérica' "$APP_DIR/lib/ready_checklists.dart"
          grep -q 'Arquivos e armários' "$APP_DIR/lib/ready_checklists.dart"
          grep -q 'EPI e barreiras' "$APP_DIR/lib/ready_checklists.dart"
          python - "$APP_DIR" <<'PY'
          from pathlib import Path
          import re,sys,unicodedata,collections
          root=Path(sys.argv[1])
          s=(root/'lib/ready_checklists.dart').read_text(encoding='utf-8')
          def norm(x):
            x=unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower()
            x=re.sub(r'[^a-z0-9 ]+',' ',x)
            return re.sub(r'\s+',' ',x).strip()
          for block in s.split('ReadyChecklistDefinition(')[1:]:
            ident=re.search(r"id:\s*'([^']+)'",block)
            if not ident: continue
            texts=re.findall(r"text:\s*'([^']+\?)'",block)
            cnt=collections.Counter(norm(t) for t in texts)
            dups=[k for k,v in cnt.items() if v>1]
            if dups:
              raise SystemExit(f'DUPLICATA INTERNA EM {ident.group(1)}: {dups}')
          for ident in ['ready-apoio-administrativo','ready-saude-clinica']:
            p=s.find("id: '"+ident+"'")
            a=s.rfind('ReadyChecklistDefinition(',0,p)
            b=s.find('ReadyChecklistDefinition(',p+1)
            block=s[a:b if b>=0 else len(s)]
            if 'Máquinas e equipamentos existentes apresentam proteções' in block:
              raise SystemExit('PERGUNTA FORA DA REALIDADE EM '+ident)
          print('CHECKLIST_REALITY_REGRESSION_OK')
          PY

      - name: Compilar APK
        working-directory: ${{ env.APP_DIR }}
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Empacotar
        run: |
          mkdir -p dist
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" dist/Auditar-SST-v3.29.85-Android.apk
          sha256sum dist/Auditar-SST-v3.29.85-Android.apk > dist/Auditar-SST-v3.29.85-Android.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.85-Android-Checklists-Revisados
          path: dist/*
          retention-days: 30
