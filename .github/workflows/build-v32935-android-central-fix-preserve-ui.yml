name: Auditar SST v3.29.35 Android Central Fix Preserve UI

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/build-v32935-android-central-fix-preserve-ui.yml"
      - "tools/patch_android_central_transport_only.py"
      - "tools/patch_apps_script_transport_recovery.py"

permissions:
  contents: read

jobs:
  android:
    name: Android v3.29.35 Preserve UI
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - name: Montar exatamente a base Android v3.29.34
        run: |
          python tools/assemble_v32920.py
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, re
          root=Path('.')
          parts=['part00.b64','part01.b64','part02.b64','part03.b64','part04.b64','part05.b64','part06.b64','part07a.b64','part07b.b64','part08.b64']
          packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','', ''.join((root/'build_sources/v3.29.27-patch'/p).read_text() for p in parts)))
          assert hashlib.sha256(packed).hexdigest()=='0b238c75455f7cb942acaa5a28e6f8c3eeb18be0fb52cdaac06b2f5ba8dc2c7c'
          Path('v32927.patch').write_bytes(lzma.decompress(packed))
          specs=[
            ('build_sources/v3.29.28-panel/v32927_to_v32928.patch.xz.b64','v32928.patch'),
            ('build_sources/v3.29.31-pc-layout/v32930_to_v32931.patch.xz.b64','v32931.patch'),
            ('build_sources/v3.29.32-pc-premium/v32931_to_v32932.patch.xz.b64','v32932.patch'),
            ('build_sources/v3.29.34-drive-evidence/v32933_to_v32934.patch.xz.b64','v32934.patch')]
          for src,out in specs:
              packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',Path(src).read_text()))
              Path(out).write_bytes(lzma.decompress(packed))
          PY
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32927.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard build_sources/v3.29.27-patch/hotfix-sync-biblioteca.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32928.patch
          python tools/patch_tutorial_v32930.py app/Auditar_SST_v1_5_dashboard "$PWD"
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32931.patch
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32932.patch
          python tools/patch_photo_recovery_v32933.py app/Auditar_SST_v1_5_dashboard
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32934.patch
          grep -q 'version: 3.29.34+176' app/Auditar_SST_v1_5_dashboard/pubspec.yaml
          grep -q 'Reparar fotos do histórico' app/Auditar_SST_v1_5_dashboard/lib/screens/settings_screen.dart

      - name: Registrar assinatura da interface v3.29.34
        run: |
          cd app/Auditar_SST_v1_5_dashboard
          find lib/screens -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/mobile-ui-before.sha256"

      - name: Aplicar somente correções internas da Central Online
        run: |
          python tools/patch_android_central_transport_only.py app/Auditar_SST_v1_5_dashboard
          python tools/patch_apps_script_transport_recovery.py app/Auditar_SST_v1_5_dashboard
          grep -q 'version: 3.29.35+177' app/Auditar_SST_v1_5_dashboard/pubspec.yaml
          grep -q '_maxRootAttempts = 2' app/Auditar_SST_v1_5_dashboard/lib/services/apps_script_http.dart
          grep -q 'script.googleusercontent.com' app/Auditar_SST_v1_5_dashboard/lib/services/apps_script_http.dart

      - name: Confirmar que nenhuma tela/layout do celular mudou
        run: |
          cd app/Auditar_SST_v1_5_dashboard
          find lib/screens -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/mobile-ui-after.sha256"
          diff -u "$RUNNER_TEMP/mobile-ui-before.sha256" "$RUNNER_TEMP/mobile-ui-after.sha256"
          echo 'Interface mobile preservada byte a byte em lib/screens.'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib/services/apps_script_http.dart lib/services/web_service_config.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi

      - name: Compilar APK release
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Preparar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.35-CENTRAL-FIX-UI-PRESERVADA.apk
          sha256sum dist/android/Auditar-SST-v3.29.35-CENTRAL-FIX-UI-PRESERVADA.apk > dist/android/Auditar-SST-v3.29.35-CENTRAL-FIX-UI-PRESERVADA.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.35-Android-Central-Fix-UI-Preservada
          path: dist/android/*
          retention-days: 30
