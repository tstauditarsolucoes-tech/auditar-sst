name: Auditar SST Sync Drain Android and Windows

on:
  workflow_dispatch:
  push:
    branches: [build-v3.29.38-central-recovery]
    paths:
      - ".github/workflows/build-v32937-v32940-sync-drain.yml"
      - "tools/patch_sync_drain_v32937_32940.py"

permissions:
  contents: read

jobs:
  android:
    name: Android v3.29.37 Sync Drain
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Montar Android v3.29.34
        run: |
          python tools/assemble_v32920.py
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, re
          root=Path('.')
          parts=['part00.b64','part01.b64','part02.b64','part03.b64','part04.b64','part05.b64','part06.b64','part07a.b64','part07b.b64','part08.b64']
          packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','', ''.join((root/'build_sources/v3.29.27-patch'/p).read_text() for p in parts)))
          assert hashlib.sha256(packed).hexdigest()=='0b238c75455f7cb942acaa5a28e6f8c3eeb18be0fb52cdaac06b2f5ba8dc2c7c'
          Path('v32927.patch').write_bytes(lzma.decompress(packed))
          specs=[
            ('build_sources/v3.29.28-panel/v32927_to_v32928.patch.xz.b64','v32928.patch'),
            ('build_sources/v3.29.31-pc-layout/v32930_to_v32931.patch.xz.b64','v32931.patch'),
            ('build_sources/v3.29.32-pc-premium/v32931_to_v32932.patch.xz.b64','v32932.patch'),
            ('build_sources/v3.29.34-drive-evidence/v32933_to_v32934.patch.xz.b64','v32934.patch')]
          for src,out in specs:
              packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',Path(src).read_text()))
              Path(out).write_bytes(lzma.decompress(packed))
          PY
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32927.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard build_sources/v3.29.27-patch/hotfix-sync-biblioteca.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32928.patch
          python tools/patch_tutorial_v32930.py app/Auditar_SST_v1_5_dashboard "$PWD"
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32931.patch
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32932.patch
          python tools/patch_photo_recovery_v32933.py app/Auditar_SST_v1_5_dashboard
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32934.patch
          grep -q 'version: 3.29.34+176' app/Auditar_SST_v1_5_dashboard/pubspec.yaml
      - name: Registrar interface Android
        run: |
          find app/Auditar_SST_v1_5_dashboard/lib/screens -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/screens-before.sha256"
      - name: Aplicar correcoes internas da Central e drenagem
        run: |
          python tools/patch_v32938_central_recovery.py app/Auditar_SST_v1_5_dashboard android
          python tools/patch_apps_script_transport_recovery.py app/Auditar_SST_v1_5_dashboard
          python tools/patch_fresh_login_v32936_32939.py app/Auditar_SST_v1_5_dashboard android
          python tools/patch_sync_drain_v32937_32940.py app/Auditar_SST_v1_5_dashboard android
          grep -q 'version: 3.29.37+179' app/Auditar_SST_v1_5_dashboard/pubspec.yaml
          grep -q '_queuedForceSync' app/Auditar_SST_v1_5_dashboard/lib/services/device_sync_service.dart
          grep -q 'Duration(seconds: 20)' app/Auditar_SST_v1_5_dashboard/lib/services/sync_coordinator.dart
          grep -q 'cada nova inicialização do aplicativo exige senha novamente' app/Auditar_SST_v1_5_dashboard/lib/services/auth_service.dart
      - name: Confirmar que nenhuma tela do celular mudou
        run: |
          find app/Auditar_SST_v1_5_dashboard/lib/screens -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/screens-after.sha256"
          diff -u "$RUNNER_TEMP/screens-before.sha256" "$RUNNER_TEMP/screens-after.sha256"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Analisar e testar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format lib
          if [ -d test ]; then dart format test; fi
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi
      - name: Compilar APK release
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          test -n "$AUDITAR_SYNC_KEY"
          flutter build apk --release --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"
      - name: Preparar APK
        run: |
          mkdir -p dist/android
          cp app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-release.apk dist/android/Auditar-SST-v3.29.37-SYNC-DRENAGEM.apk
          sha256sum dist/android/Auditar-SST-v3.29.37-SYNC-DRENAGEM.apk > dist/android/Auditar-SST-v3.29.37-SYNC-DRENAGEM.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.37-Android-Sync-Drenagem
          path: dist/android/*
          retention-days: 30

  windows:
    name: Windows v3.29.40 Sync Drain
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - name: Montar Windows v3.29.37
        shell: pwsh
        run: |
          python tools/assemble_v32920.py
          @'
          from pathlib import Path
          import base64, hashlib, lzma, re
          root=Path('.')
          parts=['part00.b64','part01.b64','part02.b64','part03.b64','part04.b64','part05.b64','part06.b64','part07a.b64','part07b.b64','part08.b64']
          packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','', ''.join((root/'build_sources/v3.29.27-patch'/p).read_text() for p in parts)))
          assert hashlib.sha256(packed).hexdigest()=='0b238c75455f7cb942acaa5a28e6f8c3eeb18be0fb52cdaac06b2f5ba8dc2c7c'
          Path('v32927.patch').write_bytes(lzma.decompress(packed))
          specs=[
            ('build_sources/v3.29.28-panel/v32927_to_v32928.patch.xz.b64','v32928.patch'),
            ('build_sources/v3.29.31-pc-layout/v32930_to_v32931.patch.xz.b64','v32931.patch'),
            ('build_sources/v3.29.32-pc-premium/v32931_to_v32932.patch.xz.b64','v32932.patch'),
            ('build_sources/v3.29.34-drive-evidence/v32933_to_v32934.patch.xz.b64','v32934.patch'),
            ('build_sources/v3.29.35-pc-deep/v32934_to_v32935.patch.xz.b64','v32935.patch'),
            ('build_sources/v3.29.36-pc-syncfix/v32935_to_v32936_v2.patch.xz.b64','v32936.patch'),
            ('build_sources/v3.29.37-data-safety/v32936_to_v32937.patch.xz.b64','v32937.patch')]
          for src,out in specs:
              packed=base64.b64decode(re.sub(r'[^A-Za-z0-9+/=]','',Path(src).read_text()))
              Path(out).write_bytes(lzma.decompress(packed))
          '@ | Set-Content "$env:RUNNER_TEMP\rebuild.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\rebuild.py"
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32927.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard build_sources/v3.29.27-patch/hotfix-sync-biblioteca.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32928.patch
          python tools/patch_tutorial_v32930.py app/Auditar_SST_v1_5_dashboard "$PWD"
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32931.patch
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32932.patch
          python tools/patch_photo_recovery_v32933.py app/Auditar_SST_v1_5_dashboard
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32934.patch
          git apply --directory=app/Auditar_SST_v1_5_dashboard v32935.patch
          git apply -p1 --directory=app/Auditar_SST_v1_5_dashboard v32936.patch
          git apply -p2 --directory=app/Auditar_SST_v1_5_dashboard v32937.patch
          $pub=Get-Content app/Auditar_SST_v1_5_dashboard/pubspec.yaml -Raw
          if (-not $pub.Contains('version: 3.29.37+179')) { throw 'versão base v3.29.37 ausente' }
      - name: Registrar interface Windows
        shell: pwsh
        run: |
          Get-ChildItem app/Auditar_SST_v1_5_dashboard/lib/screens -File | Sort-Object FullName | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash) $($_.Name)" } | Set-Content "$env:RUNNER_TEMP\screens-before.txt"
      - name: Aplicar correcoes internas da Central e drenagem
        shell: pwsh
        run: |
          python tools/patch_v32938_central_recovery.py app/Auditar_SST_v1_5_dashboard windows
          python tools/patch_apps_script_transport_recovery.py app/Auditar_SST_v1_5_dashboard
          python tools/patch_fresh_login_v32936_32939.py app/Auditar_SST_v1_5_dashboard windows
          python tools/patch_sync_drain_v32937_32940.py app/Auditar_SST_v1_5_dashboard windows
          $pub=Get-Content app/Auditar_SST_v1_5_dashboard/pubspec.yaml -Raw
          $sync=Get-Content app/Auditar_SST_v1_5_dashboard/lib/services/device_sync_service.dart -Raw
          $coord=Get-Content app/Auditar_SST_v1_5_dashboard/lib/services/sync_coordinator.dart -Raw
          if (-not $pub.Contains('version: 3.29.40+182')) { throw 'versão v3.29.40 ausente' }
          if (-not $sync.Contains('_queuedForceSync')) { throw 'fila de force ausente' }
          if (-not $coord.Contains('Duration(seconds: 20)')) { throw 'continuação parcial ausente' }
      - name: Confirmar que nenhuma tela do Windows mudou
        shell: pwsh
        run: |
          Get-ChildItem app/Auditar_SST_v1_5_dashboard/lib/screens -File | Sort-Object FullName | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash) $($_.Name)" } | Set-Content "$env:RUNNER_TEMP\screens-after.txt"
          if ((Get-FileHash "$env:RUNNER_TEMP\screens-before.txt").Hash -ne (Get-FileHash "$env:RUNNER_TEMP\screens-after.txt").Hash) { Compare-Object (Get-Content "$env:RUNNER_TEMP\screens-before.txt") (Get-Content "$env:RUNNER_TEMP\screens-after.txt"); throw 'A interface Windows foi alterada' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analisar e testar Windows
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --no-pub --platforms=windows --org br.com.auditar --project-name auditar_sst .
          if ((Test-Path 'test/widget_test.dart') -and (Select-String test/widget_test.dart -Pattern 'MyApp' -Quiet)) { Remove-Item test/widget_test.dart -Force }
          flutter pub get
          dart format lib
          if (Test-Path 'test') { dart format test }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'flutter analyze falhou' }
          if (Test-Path 'test') { flutter test; if ($LASTEXITCODE -ne 0) { throw 'flutter test falhou' } }
      - name: Compilar Windows release
        working-directory: app/Auditar_SST_v1_5_dashboard
        shell: pwsh
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUDITAR_SYNC_KEY)) { throw 'AUDITAR_SYNC_KEY ausente' }
          flutter build windows --release --dart-define=AUDITAR_SYNC_KEY="$env:AUDITAR_SYNC_KEY"
      - name: Gerar portatil e instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $release=(Resolve-Path 'app/Auditar_SST_v1_5_dashboard/build/windows/x64/runner/Release').Path
          Compress-Archive "$release/*" 'dist/windows/Auditar-SST-Windows-v3.29.40-SYNC-DRENAGEM-PORTATIL.zip' -Force
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup não disponível' }
          $output=(Resolve-Path 'dist/windows').Path
          $iss=@"
          [Setup]
          AppId={{E659A16C-8CF2-4B57-B357-5B4DB8F32200}
          AppName=Auditar SST
          AppVersion=3.29.40
          AppPublisher=Auditar Soluções
          DefaultDirName={autopf}\Auditar SST
          DefaultGroupName=Auditar SST
          OutputDir=$output
          OutputBaseFilename=Auditar-SST-Setup-v3.29.40-SYNC-DRENAGEM
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          Name: "{autodesktop}\Auditar SST"; Filename: "{app}\auditar_sst.exe"
          [Run]
          Filename: "{app}\auditar_sst.exe"; Description: "Abrir Auditar SST"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content "$env:RUNNER_TEMP\auditar.iss" $iss -Encoding UTF8
          & $iscc "$env:RUNNER_TEMP\auditar.iss"
          if (-not (Test-Path 'dist/windows/Auditar-SST-Setup-v3.29.40-SYNC-DRENAGEM.exe')) { throw 'instalador não foi gerado' }
          Get-FileHash 'dist/windows/Auditar-SST-Setup-v3.29.40-SYNC-DRENAGEM.exe' -Algorithm SHA256 | Format-List | Out-File 'dist/windows/Auditar-SST-Setup-v3.29.40-SYNC-DRENAGEM.sha256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-v3.29.40-Windows-Sync-Drenagem
          path: dist/windows/*
          retention-days: 30
