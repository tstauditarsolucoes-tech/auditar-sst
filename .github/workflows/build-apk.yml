name: Gerar APK Auditar SST

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'auditar-epi/**'
      - 'auditar-epi-gestao/**'
      - 'auditar-epi-mobile/**'
      - 'auditar-epi-windows/**'
      - '.github/workflows/build-epi-android.yml'
      - '.github/workflows/build-epi-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p app
          unzip -q Auditar_SST_v1.5_dashboard_completo.zip -d app

      - name: Aplicar correções mais recentes
        run: |
          cp -R source_overrides/Auditar_SST_v1_5_dashboard/. app/Auditar_SST_v1_5_dashboard/

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        working-directory: app/Auditar_SST_v1_5_dashboard
        run: |
          flutter create --no-pub --platforms=android --org br.com.auditar --project-name auditar_sst .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          texto = manifest.read_text(encoding="utf-8")

          permissoes = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ]

          for permissao in permissoes:
              if permissao not in texto:
                  texto = texto.replace(
                      "<application",
                      permissao + "\n    <application",
                      1
                  )

          manifest.write_text(texto, encoding="utf-8")
          PY
          sed -i 's/archive: \^4.2.0/archive: \^4.0.9/' pubspec.yaml
          sed -i 's/file_picker: \^8.1.7/file_picker: \^10.3.8/' pubspec.yaml
          sed -i 's/Auditar SST • versão 3.20.3/Auditar SST • versão 3.21.2/' lib/screens/home_screen.dart
          flutter pub get
          

      - name: Gerar APK de teste
        working-directory: app/Auditar_SST_v1_5_dashboard
        env:
          AUDITAR_SYNC_KEY: ${{ secrets.AUDITAR_SYNC_KEY }}
        run: |
          if [ -z "$AUDITAR_SYNC_KEY" ]; then
            echo "::error::Configure AUDITAR_SYNC_KEY nos segredos do repositório."
            exit 1
          fi
          flutter build apk --debug \
            --dart-define=AUDITAR_SYNC_KEY="$AUDITAR_SYNC_KEY"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-APK-TESTE
          path: app/Auditar_SST_v1_5_dashboard/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Empacotar código-fonte corrigido
        run: |
          cd app
          zip -qr ../Auditar-SST-Codigo-Fonte-v3.21.2.zip Auditar_SST_v1_5_dashboard \
            -x "Auditar_SST_v1_5_dashboard/build/*" \
               "Auditar_SST_v1_5_dashboard/.dart_tool/*" \
               "Auditar_SST_v1_5_dashboard/android/.gradle/*"

      - name: Disponibilizar código-fonte corrigido
        uses: actions/upload-artifact@v4
        with:
          name: Auditar-SST-Codigo-Fonte-v3.21.2
          path: Auditar-SST-Codigo-Fonte-v3.21.2.zip
          if-no-files-found: error
          retention-days: 14
