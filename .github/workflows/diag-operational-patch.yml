name: Validate compressed quick-media patch
on:
  push:
    branches: [fix-operational-quick-media-v329104]
    paths:
      - '.github/workflows/diag-operational-patch.yml'
      - 'tools/patch_operational_quick_media_v329104.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python - <<'PY'
          import base64,lzma
          src=open('tools/patch_operational_quick_media_v329104.py',encoding='utf8').read()
          q=src.split("b64decode('")[1].split("')")[0]
          decoded=lzma.decompress(base64.b64decode(q))
          print('PATCH_DECODE_OK',len(decoded),decoded[:80])
          compile(decoded,'patch','exec')
          PY
