name: auditar_sst
description: Aplicativo offline para checklist, inspeções e planos de ação de Segurança do Trabalho.
publish_to: "none"
version: 3.22.0+80

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  image_picker: ^1.1.2
  image: ^4.5.4
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.20.1
  signature: ^5.5.0
  share_plus: ^10.1.2
  file_picker: ^10.3.8
  archive: ^4.0.9
  connectivity_plus: ^7.3.1
  cross_file: ^0.3.4+2
  http: ^1.2.2
  crypto: ^3.0.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/auditar_icon.png
    - assets/branding/auditar_icon_transparent.png
    - assets/branding/auditar_logo.jpg
